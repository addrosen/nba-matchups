<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="robots" content="noindex,nofollow">
<title>NBA Matchups</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: a press-box shooting sheet, sibling to the Receiver Matchup Board.
   Night picker on top, four tabbed sheets, every number a conditional-format cell. */
:root {
  --bg: #EEF1EE;
  --surface: #FFFFFF;
  --ink: #15201B;
  --ink-2: #48554E;
  --ink-3: #78847D;
  --line: #D6DCD7;
  --line-strong: #A9B3AC;
  --accent: #A3471B;
  --accent-soft: #F3E1D6;
  --lo: #F8696B;
  --mid: #FFEB84;
  --hi: #63BE7B;
  --cell-ink: #14191A;
  --bar: #EBCDB9;
  --lock: #17456B;
  --hi-ink: #1E7A3E;
  --lo-ink: #B4232A;
  --g-jump: #2563A8; --g-zone: #5B4BC4; --g-rim: #B85C14; --g-boards: #2E7D4F; --g-ast: #9C3D8F; --g-pt: #127A80;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101513; --surface: #19201D; --ink: #E7ECE8; --ink-2: #AEB9B2; --ink-3: #808C85;
    --line: #2C3632; --line-strong: #4A5751; --accent: #F0A57A; --accent-soft: #3A2A20;
    --lo: #DC5E61; --mid: #E4CD66; --hi: #58AE73; --cell-ink: #0F1413; --bar: #4A3324;
    --lock: #86BBE2; --hi-ink: #7BD394; --lo-ink: #F08A8C; color-scheme: dark;
    --g-jump: #6FA8E8; --g-zone: #A49AF0; --g-rim: #EDA266; --g-boards: #73C795; --g-ast: #E08AD3; --g-pt: #5FC6CC;
  }
}
:root[data-theme="dark"] {
  --bg: #101513; --surface: #19201D; --ink: #E7ECE8; --ink-2: #AEB9B2; --ink-3: #808C85;
  --line: #2C3632; --line-strong: #4A5751; --accent: #F0A57A; --accent-soft: #3A2A20;
  --lo: #DC5E61; --mid: #E4CD66; --hi: #58AE73; --cell-ink: #0F1413; --bar: #4A3324;
  --lock: #86BBE2; --hi-ink: #7BD394; --lo-ink: #F08A8C; color-scheme: dark;
  --g-jump: #6FA8E8; --g-zone: #A49AF0; --g-rim: #EDA266; --g-boards: #73C795; --g-ast: #E08AD3; --g-pt: #5FC6CC;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.45; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px 40px; display: flex; flex-direction: column; gap: 16px; }
@media (min-width: 700px) { .wrap { padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); } }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
h1 { font-size: 34px; font-weight: 700; letter-spacing: .01em; text-transform: uppercase; line-height: 1; }
.sub { margin: 6px 0 0; color: var(--ink-2); max-width: 74ch; }
.eyebrow { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.mast { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; justify-content: space-between; }
.seg.mode button { font-family: var(--display); font-size: 16px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding: 6px 16px; }
@media (max-width: 640px) { .seg.mode { flex-wrap: wrap; } .seg.mode button { font-size: 14px; padding: 6px 10px; } }
.dim { color: var(--ink-3); }
.lens { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 0; border-top: 1px solid var(--line); }
.lens > div { padding: 8px 14px 10px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.lens > div:last-child { border-right: 0; }
.lens b { font-family: var(--display); font-size: 22px; font-weight: 700; }
.lens small { color: var(--ink-2); font-size: 12px; }
/* night picker */
.picker { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
.field select { font: inherit; font-size: 16px; font-weight: 500; color: var(--ink); background: var(--bg); border: 1px solid var(--line-strong); border-radius: 4px; padding: 7px 10px; min-width: 0; max-width: 100%; }
.stamp { display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: var(--ink-2); padding-bottom: 4px; }
.lock { display: inline-flex; align-items: center; gap: 6px; font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--lock); }
.lock svg { width: 13px; height: 13px; fill: currentColor; }
.lock.preview { color: var(--accent); }
.wibar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; padding: 10px 14px; margin-bottom: 12px; border: 1px solid var(--accent); border-radius: 4px; background: color-mix(in srgb, var(--accent) 8%, var(--surface)); font-size: 14px; color: var(--ink-2); }
.wibar b { color: var(--ink); }
.wibtns { display: flex; gap: 8px; }
.gm.lk svg { width: 11px; height: 11px; fill: var(--lock); margin-right: 5px; vertical-align: -1px; }
.gms { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 320px; min-width: 0; }
.gm { font: inherit; font-size: 13px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 3px; padding: 5px 10px; cursor: pointer; white-space: nowrap; font-variant-numeric: tabular-nums; }
.gm:hover { color: var(--ink); border-color: var(--ink-3); }
.gm .ou { font-family: var(--display); font-weight: 700; font-size: 14px; color: var(--ink); margin-left: 3px; }
.gm[aria-pressed="true"] .ou { color: inherit; }
.gmn { align-self: center; font-size: 12.5px; color: var(--ink-3); padding-left: 2px; }
.gm[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }

/* tabs + key */
.bar { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button { font-family: var(--display); font-size: 17px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); background: transparent; border: 1px solid transparent; border-bottom: 3px solid transparent; padding: 6px 12px; cursor: pointer; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.key { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; font-size: 13px; color: var(--ink-2); }
.scale { display: flex; align-items: center; gap: 8px; }
.scale i { display: block; width: 120px; height: 12px; border-radius: 2px; background: linear-gradient(90deg, var(--lo), var(--mid), var(--hi)); }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 3px; overflow: hidden; }
.seg button { font: inherit; font-size: 13px; padding: 4px 10px; background: var(--surface); color: var(--ink-2); border: 0; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }

/* cards + tables */
#view { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; min-width: 0; display: flex; flex-direction: column; }
.card > header { padding: 12px 16px 8px; display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; justify-content: space-between; }
.card h3 { font-size: 21px; font-weight: 600; text-transform: uppercase; letter-spacing: .02em; }
.cap { color: var(--ink-2); font-size: 13px; margin: 0; max-width: 86ch; }
.card > .cap { padding: 0 16px 10px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 0 16px 10px; font-size: 13px; color: var(--ink-2); }
.scroll { overflow-x: auto; min-width: 0; }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 7px; text-align: right; white-space: nowrap; }
thead th { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); border-bottom: 1px solid var(--line-strong); vertical-align: bottom; background: var(--surface); }
tbody td { border-bottom: 1px solid var(--line); }
tbody tr:last-child td { border-bottom: 0; }
th.l, td.l { text-align: left; }
th.pl, td.pl { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; padding-left: 16px; }
td.pl { font-weight: 600; }
td.pl small { display: block; font-weight: 400; color: var(--ink-3); font-size: 12px; }
td.rk { color: var(--ink-3); font-size: 12.5px; padding-left: 16px; text-align: left; width: 1%; }
td.rk + td.pl { padding-left: 4px; }
td.h { color: var(--cell-ink); font-weight: 500; box-shadow: inset 0 0 0 1px var(--surface); border-bottom-color: transparent; }
td.mut, th.mut { color: var(--ink-3); }
.whyb { all: unset; cursor: pointer; display: block; text-align: left; color: var(--ink-2); }
.whyb:hover .whymore, .whyb:focus-visible .whymore { text-decoration: underline; }
.whyb:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.whymore { color: var(--accent); font-size: 12px; white-space: nowrap; }
tr.whyrow > td { text-align: left; white-space: normal; background: var(--bg); padding: 10px 16px 14px; }
.whywrap { position: sticky; left: 16px; max-width: min(900px, calc(100vw - 72px)); }
.whysum { margin: 0 0 8px; font-size: 13.5px; line-height: 1.45; color: var(--ink); }
.whylist { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; max-width: 900px; }
.whylist li { display: grid; grid-template-columns: 128px 48px 1fr; gap: 10px; font-size: 13px; line-height: 1.45; color: var(--ink-2); align-items: baseline; }
.whylist li > span:first-child { font-weight: 600; color: var(--ink); }
.whylist li > b { text-align: right; font-variant-numeric: tabular-nums; }
@media (max-width: 620px) { .whylist li { grid-template-columns: 1fr auto; } .whylist li > span:last-child { grid-column: 1 / -1; } }
td.why { text-align: left; color: var(--ink-2); white-space: normal; min-width: 190px; max-width: 280px; font-size: 12.5px; line-height: 1.35; }
td.share { background-image: linear-gradient(90deg, var(--bar) calc(var(--w) * 1%), transparent 0); font-weight: 600; }
.gs { border-left: 2px solid var(--line-strong); }
.g { display: inline-block; min-width: 30px; text-align: center; font-family: var(--display); font-weight: 700; font-size: 15px; padding: 1px 6px; border-radius: 3px; color: var(--cell-ink); }
.g.lv { opacity: .5; box-shadow: inset 0 0 0 1px var(--line-strong); cursor: help; }
.g.ng { background: transparent; color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--line-strong); cursor: help; }
.fcat { border-left: 6px solid var(--gc); scroll-margin-top: 12px; }
button.fgrp { border: 0; cursor: pointer; font-size: 13px; padding: 5px 10px; }
button.fgrp:hover { filter: brightness(1.12); text-decoration: underline; }
button.fcatlink { font-family: inherit; font-size: 12.5px; font-weight: 500; color: var(--ink); background: var(--surface); border: 1px solid color-mix(in srgb, var(--gc) 45%, transparent); border-left: 4px solid var(--gc); border-radius: 3px; padding: 4px 9px; cursor: pointer; line-height: 1.3; }
button.fcatlink:hover { background: color-mix(in srgb, var(--gc) 12%, var(--surface)); }
button.fgrp:disabled { opacity: .35; cursor: default; text-decoration: none; filter: none; }
.fcat > header h3 { display: flex; align-items: center; gap: 10px; }
.fgrp { font-family: var(--display); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--surface); background: var(--gc); border-radius: 3px; padding: 2px 7px; line-height: 1.3; }
.fdef { margin: 12px 16px 14px; border: 1px solid var(--line); border-left: 5px solid var(--tc); border-radius: 4px; background: color-mix(in srgb, var(--tc) 6%, var(--surface)); overflow: hidden; }
.fdef-h { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 10px 12px; }
.fdef .scroll { background: var(--surface); border-top: 1px solid var(--line); }
.fdef .cap { padding: 8px 12px 10px !important; background: var(--surface); border-top: 1px solid var(--line); }
.tpill { display: inline-block; font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .04em; color: #fff; background: var(--tc); border-radius: 3px; padding: 1px 8px; line-height: 1.35; border: 1px solid color-mix(in srgb, #fff 18%, var(--tc)); cursor: pointer; }
.tpill.sm { font-size: 13px; padding: 0 6px; }
.frank { font-family: var(--display); font-size: 18px; font-weight: 700; }
.achip { display: inline-block; font-size: 12.5px; font-weight: 600; color: var(--cell-ink, #1a1a1a); border-radius: 3px; padding: 1px 7px; line-height: 1.4; white-space: nowrap; }
.abtns { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 10px; }
button.abtn { font: inherit; font-size: 12.5px; color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong); border-left: 5px solid var(--ah); border-radius: 3px; padding: 3px 8px; cursor: pointer; }
button.abtn:hover { background: color-mix(in srgb, var(--ah) 18%, var(--surface)); }
button.abtn.on { background: color-mix(in srgb, var(--ah) 35%, var(--surface)); border-color: var(--ink-2); border-left-color: var(--ah); font-weight: 600; }
.ainfo { background: var(--surface); border-top: 1px solid var(--line); padding: 8px 12px 10px; font-size: 13px; color: var(--ink-2); }
.ainfo p { margin: 0 0 4px; }
.adrvs { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink); }
.adrv { white-space: nowrap; }
@media (max-width: 600px) { .adrv { white-space: normal; } }
.flag { display: inline-block; margin-left: 6px; font-family: var(--display); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); border: 1px solid currentColor; border-radius: 2px; padding: 0 4px; vertical-align: 1px; }
.hit { font-weight: 600; }
th .sortb { font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; white-space: nowrap; }
th .sortb:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
th[aria-sort] .sortb { color: var(--accent); }
th[aria-sort="descending"] .sortb::after { content: " \25BC"; font-size: 9px; }
th[aria-sort="ascending"] .sortb::after { content: " \25B2"; font-size: 9px; }
@media (max-width: 520px) { td.pl { white-space: normal; min-width: 128px; max-width: 150px; } }

/* teams tab */
.tmhero { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 18px 20px 18px; border-radius: 6px; background: var(--tc); color: #fff; border-bottom: 7px solid var(--ts); }
.tmhero > :not(.tmwm) { position: relative; }
.tmhero :focus-visible { outline-color: #fff; }
.tmwm { position: absolute; right: -0.04em; bottom: -0.2em; font-family: var(--display); font-weight: 700; font-size: clamp(120px, 24vw, 250px); line-height: 1; letter-spacing: -.02em; color: rgb(255 255 255 / .08); pointer-events: none; user-select: none; }
.tmtop { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: flex-end; justify-content: space-between; }
.tmhero h2 { font-size: clamp(36px, 7vw, 66px); font-weight: 700; line-height: .9; text-transform: uppercase; letter-spacing: .005em; color: #fff; }
.tmhero select { font: inherit; font-size: 15px; font-weight: 600; color: #15201B; background: #fff; border: 0; border-radius: 4px; padding: 7px 10px; max-width: 100%; }
.tmmeta { margin: 0; font-size: 14px; color: rgb(255 255 255 / .82); max-width: 72ch; }
.tmpills { display: flex; flex-wrap: wrap; gap: 6px; }
.tmpills button { font: inherit; font-size: 13px; color: #fff; background: transparent; border: 1px solid rgb(255 255 255 / .42); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.tmpills button:hover { border-color: #fff; }
.tmpills button[aria-pressed="true"] { background: #fff; color: var(--tc); border-color: #fff; font-weight: 600; }
.tmshare { display: flex; flex-direction: column; gap: 8px; }
.tmshare-t { margin: 0; font-family: var(--display); font-size: 19px; font-weight: 600; color: #fff; }
.tmbar { display: flex; gap: 2px; height: 38px; }
.tmbar span { min-width: 3px; display: flex; align-items: center; justify-content: center; overflow: hidden; background: rgb(255 255 255 / var(--a)); color: #fff; font-family: var(--display); font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tmbar span:first-child { border-radius: 3px 0 0 3px; } .tmbar span:last-child { border-radius: 0 3px 3px 0; }
.tmbar span.lt { color: var(--tc); }
.tmleg { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: rgb(255 255 255 / .9); }
.tmleg li { display: flex; align-items: center; gap: 6px; }
.tmleg i { width: 10px; height: 10px; border-radius: 2px; background: rgb(255 255 255 / var(--a)); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .35); }
.tmleg b { font-weight: 600; font-variant-numeric: tabular-nums; }
.tmchips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; }
.tmchip { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 999px; padding: 5px 12px; cursor: pointer; text-align: left; }
.tmchip small { color: var(--ink-3); margin-left: 6px; font-size: 12px; }
.tmchip:hover { border-color: var(--ink-3); }
.tmchip[data-st="out"] { background: color-mix(in srgb, var(--lo) 22%, var(--surface)); border-color: var(--lo-ink); font-weight: 600; }
.tmchip[data-st="in"] { background: color-mix(in srgb, var(--hi) 22%, var(--surface)); border-color: var(--hi-ink); font-weight: 600; }
.tmnever { padding: 0 16px 10px; }
@media (max-width: 520px) { .tmchip { font-size: 12.5px; padding: 4px 10px; } .tmchip small { margin-left: 4px; } }
td.tmsel { font-weight: 600; }
td.tmsel small { display: block; font-weight: 400; font-size: 11.5px; }
.tmgrid th { text-align: center; line-height: 1.2; }
.tmgrid td { text-align: center; }
.tmgrid td.pl { text-align: left; }
td.tmh { background: color-mix(in srgb, var(--accent) var(--h), var(--surface)); box-shadow: inset 0 0 0 1px var(--surface); }
td.tmh.top { font-weight: 700; }
td.tmsat { color: var(--ink-3); font-family: var(--display); font-size: 11px; letter-spacing: .06em; }
.tmsit { margin: 0 16px 14px; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.tmsit-h { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; padding: 8px 12px; background: var(--bg); border-bottom: 1px solid var(--line); }
.tmsit td.pl { padding-left: 12px; }

/* player panel */
.link { font: inherit; font-weight: 600; color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.link:hover { color: var(--accent); text-decoration-color: currentColor; }
.scrim { position: fixed; inset: 0; z-index: 30; background: rgb(10 14 12 / .42); }
.panel { position: fixed; z-index: 31; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--bg); border-left: 1px solid var(--line-strong); box-shadow: -12px 0 32px rgb(0 0 0 / .18); overflow-y: auto; overscroll-behavior: contain; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
@media (max-width: 600px) { .panel { padding-left: env(safe-area-inset-left, 0px); border-left: 0; } }
.pin { display: flex; flex-direction: column; gap: 14px; padding: 16px; }
.phead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }

    const D = state.defense && state.defense.shots3;
    if (!D || !Object.keys(D).length) return v3Empty("Areas", "Defensive shot-location data isn't loaded yet.");
    const pick = AREA_PICK.some((x) => x[0] === v3Opt("area")) ? v3Opt("area") : "all", A = areaList(pick);
    const spot = pick === "all" ? "all spots" : (AREA_PICK.find((x) => x[0] === pick) || [, ""])[1].toLowerCase();
    const nT = Object.keys(D).length;
    const lg = {}; SA.forEach((a) => { lg[a] = v3Avg(Object.values(D).map((v) => (v[a] || {}).pg)) || 0.01; });
    const rk = {}; SA.forEach((a) => { rk[a] = v3RankBy(D, (v) => (v[a] ? v[a].pg : null)); });
    const sumPg = (v) => A.reduce((s, a) => s + ((v[a] || {}).pg || 0), 0);
    const rkSel = v3RankBy(D, sumPg), rkAll = v3RankBy(D, (v) => SA.reduce((s, a) => s + ((v[a] || {}).pg || 0), 0));
    const games = (n.games || []).filter((g) => inSel(g.game));
    const facing = {}; games.forEach((g) => { facing[g.home] = g.away; facing[g.away] = g.home; });
    const defs = Object.keys(facing).filter((t) => D[t]).sort((a, b) => rkSel[a] - rkSel[b]);
    const dHead = `<th class="pl">Defense</th>${SA.map((a) => `<th${A.includes(a) ? ' class="gs"' : ""} title="Threes allowed per game from the ${SAL[a].toLowerCase()}; small number = rank of ${nT}, 1 = allows the most">${SAL[a]}</th>`).join("")}<th title="All threes allowed per game">All 3PA</th>`;
    const dRows = defs.map((t) => `<tr><td class="pl">${tpill(t, 1)}<small>defends ${esc(facing[t])}</small></td>${SA.map((a) => v3Rank(D[t][a] && D[t][a].pg, rk[a][t], nT, f1)).join("")}${v3Rank(SA.reduce((s, a) => s + ((D[t][a] || {}).pg || 0), 0), rkAll[t], nT, f1)}</tr>`).join("")
      + `<tr><td class="pl mut">League average</td>${SA.map((a) => `<td class="mut">${f1(lg[a])}</td>`).join("")}<td class="mut">${f1(SA.reduce((s, a) => s + lg[a], 0))}</td></tr>`;
    const pending = v3Docs(n);
    const rows = v3Rows(n).map((r) => {
      const p = v3Player(r), s3 = p && p.shots3, d = D[r.opp];
      if (!s3 || !s3.games || s3.games < S3_MIN_GP || !d) return null;
      const tot = SA.reduce((t, a) => t + s3.areas[a][0], 0); if (!tot) return null;
      const att = A.reduce((t, a) => t + s3.areas[a][0], 0), made = A.reduce((t, a) => t + s3.areas[a][1], 0);
      const fit = A.reduce((t, a) => t + (s3.areas[a][0] / s3.games) * (((d[a] || {}).pg ?? lg[a]) / lg[a] - 1), 0);
      const top = SA.slice().sort((x, y) => s3.areas[y][0] - s3.areas[x][0])[0];
      return { r, pg: att / s3.games, share: att / tot, pct: att ? made / att : null, att, fit, dpg: sumPg(d), drk: rkSel[r.opp], top, topShare: s3.areas[top][0] / tot };
    }).filter((x) => x && x.pg >= (A.length === 1 ? 0.2 : 0.4)).sort((a, b) => b.fit - a.fit);
    const maxPg = Math.max(0.01, ...rows.map((x) => x.pg));
    const sHead = `<th class="mut" style="text-align:left">#</th><th class="pl">Shooter</th><th title="His threes per game from ${esc(spot)}">His 3PA/g</th><th title="${pick === "all" ? "Where he takes the most threes, and its share of them" : "Share of his threes taken from " + esc(spot)}">${pick === "all" ? "Main spot" : "Share"}</th><th title="His 3P% from ${esc(spot)} (attempts)">3P%</th><th title="Threes per game his defense allows from ${esc(spot)}; small number = rank of ${nT}, 1 = allows the most">Def allows</th><th class="gs" title="Extra threes per game his spots get against this defense compared with a league-average one">Spot fit</th><th title="Projected made threes tonight">Proj 3PM</th>${pick === "all" ? `<th title="What the model adds to his made threes tonight for the 3P% this defense allows by zone">Zone edge</th>` : ""}`;
    const sRows = rows.map((x, i) => `<tr><td class="rk">${i + 1}</td>${v3Who(x.r)}<td class="share" style="--w:${Math.round((x.pg / maxPg) * 100)}">${f1(x.pg)}</td><td>${pick === "all" ? `${esc(SAL[x.top])} <span class="dim">${pct(x.topShare, 0)}</span>` : pct(x.share, 0)}</td><td>${x.pct != null ? `${pct(x.pct, 0)} <span class="dim">(${x.att})</span>` : "–"}</td>${v3Rank(x.dpg, x.drk, nT, f1)}${v3Edge(x.fit, A.length === 1 ? 0.5 : 1.5, 2)}<td>${f2(x.r.proj_3pm)}</td>${pick === "all" ? v3Edge(x.r.base_pa * x.r.f_pace * x.r.f_vol * (x.r.d_zone || 0), 0.1, 2) : ""}</tr>`);
    return `<section class="card"><header><h3>Where tonight's defenses give up threes</h3></header>
      <p class="cap">Threes each defense allows per game from each spot, this season. The small number is its rank of ${nT} (1 = allows the most); green = more than most teams. Sorted by the spots picked below.</p>
      <div class="scroll"><table><thead><tr>${dHead}</tr></thead><tbody>${dRows}</tbody></table></div></section>
      <section class="card"><header><h3>Shooters by spot${allG() ? "" : ": " + esc(selLabel())}</h3></header>
      ${v3Chips("area", AREA_PICK, pick, "Spot")}
      <p class="cap">Tonight's shooters ranked by <b>Spot fit</b>: the extra threes per game his usual spots get against this defense compared with a league-average one (his 3PA/g from each spot × how much more or less the defense allows there).${pick === "all" ? " <b>Zone edge</b> is what the model already adds to his made threes for the 3P% the defense allows by zone." : ""} This season's games; shooters need ${S3_MIN_GP}+ games with shot data. Click a player for his shot map.${v3Loading(pending)}</p>
      ${v3Table("v3-areas-" + pick, sHead, sRows, "shooters", pending ? "Loading shot data…" : "No shooters with enough shot data from here.")}</section>`;
  }

  // --- Volume: three-point attempts that move with teammates out ---
  function volumeHTML() {
    const n = currentNight(); if (!n) return emptyBoard();
    const pending = v3Docs(n);
    const mode = v3Opt("vol", "out") === "q" ? "q" : "out";
    const orig = {}; (n.rows || []).forEach((r) => (orig[String(r.player_id)] = r));
    const Q = qList(n);
    const nm = (team, id) => { const td = state.teamDocs[team], p = td && td.players && td.players[id]; const inj = ((n.injuries || {})[team] || []).find((x) => String(x.player_id) === id); const q = Q.find((x) => x.pid === id); return (p && p.name) || (inj && inj.player) || (q && q.name) || "Teammate"; };
    const rows = v3Rows(n).map((r) => {
      const pid = String(r.player_id), o = orig[pid] || r, td = state.teamDocs[r.team], ctx = td && td.inj;
      const k = o.inj_pa || 1, km = o.inj_min || 1;
      const pa0 = o.proj_3pa / k, pm0 = o.proj_3pm / k, min0 = o.min / km;
      const outs = currentOuts(n, r.team).filter((x) => x !== pid);
      const outsRot = ctx ? outs.filter((x) => ctx.min[x] != null) : outs;
      const qs = Q.filter((x) => x.team === r.team && x.pid !== pid && !outs.includes(x.pid) && callOf(n, x.pid) !== "plays" && (!ctx || ctx.min[x.pid] != null)).map((x) => x.pid);
      let qPa = null;
      if (qs.length && ctx) { const a = injuryRatios(ctx, pid, outs, "pa")[1], b = injuryRatios(ctx, pid, [...outs, ...qs], "pa")[1]; qPa = r.proj_3pa * (b / (a || 1) - 1); }
      return { r, pa0, pm0, min0, dPa: r.proj_3pa - pa0, dPm: r.proj_3pm - pm0, dMin: r.min - min0, outs: outsRot, qs, qPa };
    });
    const names = (team, ids) => ids.map((id) => esc(nm(team, id))).join(", ");
    const list = mode === "out"
      ? rows.filter((x) => x.dPa >= 0.1).sort((a, b) => b.dPa - a.dPa)
      : rows.filter((x) => x.qPa != null && x.qPa >= 0.1).sort((a, b) => b.qPa - a.qPa);
    const maxD = Math.max(0.01, ...list.map((x) => (mode === "out" ? x.dPa : x.qPa)));
    const arrow = (a, b, fmt) => `<span class="dim">${fmt(a)}</span> → <b>${fmt(b)}</b>`;
    const head = mode === "out"
      ? `<th class="mut" style="text-align:left">#</th><th class="pl">Shooter</th><th class="l" title="Teammates ruled out tonight (and any you've sat as a test)">Teammates out</th><th class="gs" title="Extra three-point attempts tonight from teammates being out">+3PA</th><th title="Projected attempts with everyone available → tonight">3PA</th><th title="Projected minutes with everyone available → tonight">Min</th><th title="Projected made threes with everyone available → tonight">3PM</th><th title="More attempts on top of tonight's if every questionable teammate sits">If Q sit</th>`
      : `<th class="mut" style="text-align:left">#</th><th class="pl">Shooter</th><th class="l" title="Questionable or doubtful teammates not yet ruled out">Questionable</th><th class="gs" title="Extra three-point attempts if they all sit">+3PA</th><th title="Projected attempts tonight → if they sit">3PA</th><th title="Projected made threes tonight → if they sit">3PM</th>`;
    const body = list.map((x, i) => {
      const r = x.r;
      if (mode === "out") return `<tr><td class="rk">${i + 1}</td>${v3Who(r)}<td class="l why">${x.outs.length ? names(r.team, x.outs) : "–"}</td><td class="share" style="--w:${Math.round((x.dPa / maxD) * 100)}"><b>+${f1(x.dPa)}</b></td><td>${arrow(x.pa0, r.proj_3pa, f1)}</td><td>${arrow(x.min0, r.min, f1)}</td><td>${arrow(x.pm0, r.proj_3pm, f2)} <span class="up">+${f2(x.dPm)}</span></td><td${x.qPa != null && x.qPa >= 0.05 ? ` title="If ${esc(x.qs.map((id) => nm(r.team, id)).join(", "))} sit${x.qs.length === 1 ? "s" : ""}"` : ""}>${x.qPa != null && x.qPa >= 0.05 ? `+${f1(x.qPa)}` : `<span class="mut">–</span>`}</td></tr>`;
      const f = r.proj_3pa ? 1 + x.qPa / r.proj_3pa : 1;
      return `<tr><td class="rk">${i + 1}</td>${v3Who(r)}<td class="l why">${names(r.team, x.qs)}</td><td class="share" style="--w:${Math.round((x.qPa / maxD) * 100)}"><b>+${f1(x.qPa)}</b></td><td>${arrow(r.proj_3pa, r.proj_3pa + x.qPa, f1)}</td><td>${arrow(r.proj_3pm, r.proj_3pm * f, f2)}</td></tr>`;
    });
    const MODES = [["out", "Teammates out"], ["q", "If questionable sit"]];
    return `<section class="card"><header><h3>${mode === "out" ? "Volume bumps tonight" : "If questionable teammates sit"}${allG() ? "" : ": " + esc(selLabel())}</h3>${v3Seg("vol", MODES, mode, "Which teammates")}</header>
      <p class="cap">${mode === "out"
        ? "Shooters picking up three-point attempts because teammates are out tonight, ranked by the extra attempts. Each column shows his projection with everyone available, then tonight's. <b>If Q sit</b> is how many more he'd get on top of that if every questionable teammate sits. Uses the board's injury math, and your tests and calls once they're on."
        : "How many more threes each shooter would take if every questionable or doubtful teammate not yet ruled out sits, on top of tonight's projection. Test or confirm a player on the <button type=\"button\" class=\"tlink\" data-tab=\"quest\">Questionable</button> tab to make it count."}${v3Loading(pending)}</p>
      ${v3Table("v3-vol-" + mode, head, body, "shooters", pending ? "Loading teammate data…" : mode === "out" ? `Nobody's attempts move with teammates out ${allG() ? "tonight" : inThese()}.` : `No questionable teammates would move anyone's attempts ${allG() ? "tonight" : inThese()}.`)}</section>`;
  }

  // ----- 3PM extra views (nba_x3.py docs): C&S / Pull-up, Pace & 3PA, Defenders, Hit rates -----
  function x3Doc(name) {
    state.x3 = state.x3 || {};
    if (!(name in state.x3) && state.db) {
      state.x3[name] = undefined;
      state.db.doc("x3/" + name).get().then((s) => { state.x3[name] = s.exists ? s.data() : null; }, () => { state.x3[name] = null; })
        .then(() => { if (state.tab === "board" && state.stat === "3pm") render(); });
    }
    return state.x3[name];
  }
  const x3Wait = (t) => v3Empty(t, "Loading…");
  const x3Missing = (t) => v3Empty(t, "This view's data isn't built yet. It comes with the next board run on your Mac.");
  const x3Out = (n, team, pid) => currentOuts(n, team).includes(String(pid));

  // --- C&S / Pull-up: who allows the most of each, and who on the other side takes them ---
  function shotHTML() {
    const n = currentNight(); if (!n) return emptyBoard();
    const X = x3Doc("all"); if (X === undefined) return x3Wait("C&amp;S / Pull-up"); if (!X) return x3Missing("C&amp;S / Pull-up");
    const T = X.teams || {}, P = X.players || {};
    const mode = v3Opt("shot", "cs") === "pullup" ? "pullup" : "cs", oth = mode === "cs" ? "pullup" : "cs";
    const NM = { cs: "C&amp;S", pullup: "Pull-up" }, LONG = { cs: "catch-and-shoot", pullup: "pull-up" };
    const view = v3Opt("shotv", "team") === "fit" ? "fit" : "team";
    const sub = (t, k) => (T[t] && T[t][k]) || {};
    const has = Object.keys(T).filter((t) => T[t].cs || T[t].pullup), nT = has.length;
    const rk = {}, lg = {};
    ["cs", "pullup"].forEach((k) => {
      rk[k] = { a: v3RankBy(T, (d) => (d[k] ? d[k].a : null)), f: v3RankBy(T, (d) => (d[k] ? d[k].f : null)), p: v3RankBy(T, (d) => (d[k] ? d[k].p : null)) };
      lg[k] = { a: v3Avg(has.map((t) => sub(t, k).a)), f: v3Avg(has.map((t) => sub(t, k).f)), p: v3Avg(has.map((t) => sub(t, k).p)) };
    });
    const facing = pFacing(n);
    const defs = Object.keys(facing).filter((t) => T[t] && T[t][mode]).sort((a, b) => (rk[mode].a[a] ?? 99) - (rk[mode].a[b] ?? 99));
    const trio = (t, k) => `${v3Rank(sub(t, k).a, rk[k].a[t], nT, f1)}${v3Rank(sub(t, k).f, rk[k].f[t], nT, (v) => pct(v, 1))}${v3Rank(sub(t, k).p, rk[k].p[t], nT, (v) => pct(v, 1))}`;
    const th = (k, gs) => `<th${gs ? ' class="gs"' : ""} title="${LONG[k]} threes allowed per game; small number = rank of ${nT}, 1 = allows the most">${NM[k]} 3PA/g</th><th title="NBA.com 3FG FREQ%: ${LONG[k]} threes allowed as a share of all shots allowed; 1 = highest">${NM[k]} FREQ%</th><th title="${LONG[k]} 3P% allowed; 1 = highest">${NM[k]} 3P%</th>`;
    const dHead = `<th class="pl">Defense</th>${th(mode, true)}${th(oth, false)}`;
    const dRows = defs.map((t) => `<tr><td class="pl">${tpill(t, 1)}<small>defends ${esc(facing[t])}</small></td>${trio(t, mode)}${trio(t, oth)}</tr>`).join("")
      + `<tr><td class="pl mut">League average</td>${[mode, oth].map((k) => `<td class="mut">${f1(lg[k].a)}</td><td class="mut">${pct(lg[k].f, 1)}</td><td class="mut">${pct(lg[k].p, 1)}</td>`).join("")}</tr>`;
    const rows = v3Rows(n).map((r) => {
      const p = P[String(r.player_id)], s = p && p[mode]; if (!s || s.a == null) return null;
      const d = sub(r.opp, mode);
      return { r, s, o: p[oth] || {}, all3: p.a3, of3: p.a3 ? s.a / p.a3 : null, fit: d.a != null && lg[mode].a ? s.a * (d.a / lg[mode].a - 1) : null };
    }).filter((x) => x && x.s.a >= 0.3);
    const maxA = Math.max(0.1, ...rows.map((x) => x.s.a));
    const pRow = (x, i) => `<tr><td class="rk">${i == null ? "" : i + 1}</td>${v3Who(x.r)}<td class="share" style="--w:${Math.round((x.s.a / maxA) * 100)}">${f1(x.s.a)}</td><td>${pct(x.s.f, 1)}</td><td>${x.s.p != null ? `${pct(x.s.p, 0)} <span class="dim">(${x.s.tot})</span>` : "–"}</td><td>${x.of3 != null ? pct(Math.min(1, x.of3), 0) : "–"}</td><td class="mut">${f1(x.o.a)}</td>${view === "fit" ? v3Edge(x.fit, 0.8, 2) : ""}<td>${f2(x.r.proj_3pm)}</td></tr>`;
    const sHead = `<th class="mut" style="text-align:left">#</th><th class="pl">Shooter</th><th class="gs" title="His ${LONG[mode]} threes per game">${NM[mode]} 3PA/g</th><th title="NBA.com 3FG FREQ%: his ${LONG[mode]} threes as a share of all his shots">FREQ%</th><th title="His ${LONG[mode]} 3P% (attempts)">3P%</th><th title="Share of all his threes that are ${LONG[mode]}">Of his 3s</th><th title="His ${LONG[oth]} threes per game, for comparison">${NM[oth]} 3PA/g</th>${view === "fit" ? `<th class="gs" title="Extra ${LONG[mode]} threes per game against this defense: his ${NM[mode]} 3PA/g × how much more (or less) than league average the defense allows">Fit</th>` : ""}<th title="Projected made threes tonight">Proj 3PM</th>`;
    let body, more = "";
    if (view === "team") {
      body = defs.map((t) => {
        const list = rows.filter((x) => x.r.opp === t).sort((a, b) => b.s.a - a.s.a);
        const d = sub(t, mode);
        return `<tr class="grp"><td colspan="8">${tpill(t, 1)} allows <b>${f1(d.a)}</b> ${LONG[mode]} 3PA/g <span class="dim">(${rk[mode].a[t] ?? "–"} of ${nT}) · ${pct(d.f, 1)} FREQ · ${pct(d.p, 1)}</span> → ${tpill(facing[t], 1)} shooters</td></tr>`
          + (list.map((x) => pRow(x, null)).join("") || `<tr><td></td><td class="l mut" colspan="7">No ${LONG[mode]} shooters on the board.</td></tr>`);
      }).join("");
      body = `<div class="scroll"><table><thead><tr>${sHead}</tr></thead><tbody>${body || `<tr><td class="l" colspan="8" style="padding:14px 16px">No games.</td></tr>`}</tbody></table></div>`;
    } else {
      const list = rows.filter((x) => x.fit != null).sort((a, b) => b.fit - a.fit);
      body = v3Table(`v3-shot-${mode}`, sHead, list.map((x, i) => pRow(x, i)), "shooters", `No ${LONG[mode]} shooters on the board.`);
    }
    const MODES = [["cs", "Catch & shoot", "Threes off a pass, no dribble"], ["pullup", "Pull-up", "Threes off the dribble"]];
    const VIEWS = [["team", "By matchup"], ["fit", "Best fits"]];
    return `<section class="card"><header><h3>Who allows ${LONG[mode]} threes</h3>${v3Seg("shot", MODES, mode, "Shot type")}</header>
      <p class="cap">Tonight's defenses, this season. <b>FREQ%</b> is NBA.com's 3FG FREQ%: those threes as a share of every shot the defense allows. The small number is the rank of ${nT} (1 = allows the most, or the highest 3P%); green = more than most teams. Sorted by ${LONG[mode]} 3PA allowed per game.</p>
      <div class="scroll"><table><thead><tr>${dHead}</tr></thead><tbody>${dRows}</tbody></table></div></section>
      <section class="card"><header><h3>${view === "team" ? "Who takes them" : `Best ${LONG[mode]} fits`}${allG() ? "" : ": " + esc(selLabel())}</h3>${v3Seg("shotv", VIEWS, view, "Layout")}</header>
      <p class="cap">${view === "team"
        ? `Each defense above, then the shooters on the other side ranked by ${LONG[mode]} threes per game.`
        : `Every shooter ranked by <b>Fit</b>: his ${LONG[mode]} threes per game × how many more (or fewer) of them his defense allows than the league average.`} <b>FREQ%</b> is NBA.com's 3FG FREQ% (those threes as a share of all his shots); <b>Of his 3s</b> is the share of his threes that are ${LONG[mode]}. This season, per game played. Shooters on tonight's board with 0.3+ a game. Context only: the projection already counts catch-and-shoot share through its shot-diet adjustment.</p>
      ${body}</section>`;
  }

  // --- Pace & 3PA: game speed and how many threes each defense lets teams try ---
  function paceHTML() {
    const n = currentNight(); if (!n) return emptyBoard();
    const X = x3Doc("all"); if (X === undefined) return x3Wait("Pace &amp; 3PA"); if (!X) return x3Missing("Pace &amp; 3PA");
    const T = X.teams || {}, nT = Object.keys(T).length;
    const mode = v3Opt("pace3", "boost") === "games" ? "games" : "boost";
    const rk = {}; ["pace", "opp3a", "opp3r", "opp3p", "own3a"].forEach((k) => { rk[k] = v3RankBy(T, (d) => d[k]); });
    const lg = (k) => v3Avg(Object.values(T).map((d) => d[k]));
    const rows = v3Rows(n);
    const games = (n.games || []).filter((g) => inSel(g.game));
    const g3 = {}; games.forEach((g) => { g3[g.game] = rows.filter((r) => r.game === g.game).reduce((s, r) => s + (r.proj_3pa || 0), 0); });
    const gOf = (r) => games.find((g) => g.game === r.game);
    const facing = pFacing(n);
    const defs = Object.keys(facing).filter((t) => T[t]).sort((a, b) => (rk.opp3a[a] ?? 99) - (rk.opp3a[b] ?? 99));
    const dHead = `<th class="pl">Defense</th><th class="gs" title="Three-point attempts opponents take per game against it; small number = rank of ${nT}, 1 = most">Opp 3PA/g</th><th title="Share of opponents' shots that are threes; 1 = highest">Opp 3PA rate</th><th title="3P% allowed; 1 = highest">Opp 3P%</th><th title="Possessions per 48 minutes; 1 = fastest">Pace</th><th title="How many threes the offense it faces tonight takes per game; 1 = most">Their 3PA/g</th><th title="Sportsbook over/under">Game O/U</th>`;
    const dRows = defs.map((t) => { const d = T[t], o = facing[t], g = games.find((x) => x.away === t || x.home === t);
      return `<tr><td class="pl">${tpill(t, 1)}<small>defends ${esc(o)}</small></td>${v3Rank(d.opp3a, rk.opp3a[t], nT, f1)}${v3Rank(d.opp3r, rk.opp3r[t], nT, (v) => pct(v, 1))}${v3Rank(d.opp3p, rk.opp3p[t], nT, (v) => pct(v, 1))}${v3Rank(d.pace, rk.pace[t], nT, f1)}${T[o] ? v3Rank(T[o].own3a, rk.own3a[o], nT, f1) : `<td class="mut">–</td>`}<td>${ouOf(g) != null ? f1(ouOf(g)) : "–"}</td></tr>`; }).join("")
      + `<tr><td class="pl mut">League average</td><td class="mut">${f1(lg("opp3a"))}</td><td class="mut">${pct(lg("opp3r"), 1)}</td><td class="mut">${pct(lg("opp3p"), 1)}</td><td class="mut">${f1(lg("pace"))}</td><td class="mut">${f1(lg("own3a"))}</td><td></td></tr>`;
    const list = rows.map((r) => {
      const fp = r.f_pace || 1, fv = r.f_vol || 1, g = gOf(r);
      return { r, fp, fv, extra: (r.proj_3pa || 0) - (r.proj_3pa || 0) / (fp * fv), g3: g3[r.game] || 0, ou: ouOf(g) };
    }).filter((x) => x.r.proj_3pa >= 2)
      .sort((a, b) => (mode === "boost" ? b.extra - a.extra : b.g3 - a.g3 || b.r.proj_3pa - a.r.proj_3pa));
    const maxPa = Math.max(1, ...list.map((x) => x.r.proj_3pa));
    const pctS = (f) => v3Sign((f - 1) * 100, 1) + "%";
    const sHead = `<th class="mut" style="text-align:left">#</th><th class="pl">Shooter</th><th title="Pace adjustment for his game">Pace</th><th title="Adjustment for how many threes his defense lets teams try">Def volume</th><th${mode === "boost" ? ' class="gs"' : ""} title="Three-point attempts the pace and defense-volume adjustments add (or take away) tonight">+3PA</th><th title="Projected three-point attempts tonight">Proj 3PA</th><th${mode === "games" ? ' class="gs"' : ""} title="Every board shooter's projected 3PA in his game, both teams">Game 3PA</th><th title="Game over/under">O/U</th><th title="Projected made threes tonight">Proj 3PM</th>`;
    const sRows = list.map((x, i) => `<tr><td class="rk">${i + 1}</td>${v3Who(x.r)}<td class="h" style="background:${heat(edgeT(x.fp - 1, 0.06))}">${pctS(x.fp)}</td><td class="h" style="background:${heat(edgeT(x.fv - 1, 0.12))}">${pctS(x.fv)}</td>${v3Edge(x.extra, 1, 1)}<td class="share" style="--w:${Math.round((x.r.proj_3pa / maxPa) * 100)}">${f1(x.r.proj_3pa)}</td><td>${f1(x.g3)}</td><td>${x.ou != null ? f1(x.ou) : "–"}</td><td>${f2(x.r.proj_3pm)}</td></tr>`);
    const MODES = [["boost", "Biggest boosts"], ["games", "Highest-volume games"]];
    return `<section class="card"><header><h3>How many threes tonight's defenses allow</h3></header>
      <p class="cap">This season. <b>Opp 3PA rate</b> is the share of opponents' shots that are threes. <b>Their 3PA/g</b> is how many threes the offense it faces tonight takes. The small number is the rank of ${nT} (1 = most, fastest or highest); green = more threes for shooters. Sorted by opponent 3PA per game.</p>
      <div class="scroll"><table><thead><tr>${dHead}</tr></thead><tbody>${dRows}</tbody></table></div></section>
      <section class="card"><header><h3>${mode === "boost" ? "Biggest pace &amp; volume boosts" : "Shooters in the highest-volume games"}${allG() ? "" : ": " + esc(selLabel())}</h3>${v3Seg("pace3", MODES, mode, "Rank by")}</header>
      <p class="cap">${mode === "boost"
        ? "Shooters ranked by the three-point attempts the model's pace and defense-volume adjustments add to his projection tonight. <b>Pace</b> and <b>Def volume</b> are those two adjustments."
        : "Shooters in the games where the board projects the most threes (both teams added up) first, then by projected attempts."} Shooters projected for 2+ attempts; your what-ifs count.</p>
      ${v3Table("v3-pace-" + mode, sHead, sRows, "shooters", "No shooters in these games.")}</section>`;
  }

  // --- Defenders: likely primary defender for each shooter and how he handles threes ---
  function x3MatchIdx(M) {
    if (state.x3idx && state.x3idx.src === M) return state.x3idx;
    const byOff = {};
    (M.pairs || []).forEach((p) => { (byOff[p[0]] = byOff[p[0]] || []).push(p); });
    const byTeam = {};
    Object.entries(M.defs || {}).forEach(([id, d]) => { (byTeam[d.team] = byTeam[d.team] || []).push([id, d]); });
    state.x3idx = { src: M, byOff, byTeam };
    return state.x3idx;
  }
  function defHTML() {
    const n = currentNight(); if (!n) return emptyBoard();
    const M = x3Doc("match");
    if (M === undefined) return x3Wait("Defenders");
    if (!M) return v3Empty("Defenders", "Who-guarded-whom data comes from NBA.com's matchup table with the once-a-day morning data pull, so this view fills in after the next one. To get it sooner, run <code>python3 nba_daily.py pull</code> on your Mac.");
    const I = x3MatchIdx(M), lg = M.league || {}, D = M.defs || {};
    const sort = v3Opt("dsort", "gen") === "tough" ? "tough" : "gen";
    const posOf = (pid) => (M.pos || {})[String(pid)] || "G";
    const avail = (n2, t) => (I.byTeam[t] || []).filter(([id]) => !x3Out(n2, t, id));
    const vsTd = (v, span = 0.35) => (v == null ? `<td class="mut">–</td>` : `<td class="h" style="background:${heat(edgeT(v - 1, span))}">${v3Sign((v - 1) * 100, 0)}%</td>`);
    const dname = (id) => (D[id] ? D[id].name : "Defender");
    const rows = v3Rows(n).filter((r) => (r.base_pa || r.proj_3pa) >= 1.5).map((r) => {
      const pos = posOf(r.player_id), cand = avail(n, r.opp).map(([id, d]) => [id, d, d.pg[pos] || 0]).filter((x) => x[2] > 0);
      const W = cand.reduce((s, x) => s + x[2], 0); if (!W) return null;
      cand.sort((a, b) => b[2] - a[2]);
      const fit = cand.reduce((s, x) => s + (x[2] / W) * (x[1].vs - 1), 0);
      const hist = (I.byOff[r.player_id] || []).filter((p) => (p[5] || (D[p[1]] || {}).team) === r.opp);
      const hp = hist.reduce((s, p) => s + p[2], 0), hm = hist.reduce((s, p) => s + p[3], 0), ha = hist.reduce((s, p) => s + p[4], 0);
      const htop = hist.slice().sort((a, b) => b[2] - a[2])[0];
      return { r, pos, top: cand[0], share: cand[0][2] / W, second: cand[1] ? [cand[1], cand[1][2] / W] : null, fit, extra: (r.proj_3pa || 0) * fit, hp, hm, ha, htop };
    }).filter(Boolean).sort((a, b) => (sort === "gen" ? b.extra - a.extra : a.extra - b.extra));
    const sHead = `<th class="mut" style="text-align:left">#</th><th class="pl">Shooter</th><th title="NBA.com's listed position (G / F / C)">Pos</th><th class="l" title="The defender who spends the most time guarding his position per game, among tonight's available defenders, and his share of that time">Likely defender</th><th title="Threes the likely defender allows to the man he guards, vs what those same shooters take against everyone else (shrunk toward league average on small samples)">Def 3PA vs exp</th><th title="3P% allowed by the likely defender (makes/attempts)">Def 3P%</th><th class="gs" title="All of tonight's defenders who guard his position, weighted by how much they guard it: threes allowed vs expected">Mix vs exp</th><th title="His projected 3PA × Mix vs exp: rough change in attempts from tonight's defenders (not in the projection)">≈ 3PA</th><th title="What he did against this team's defenders this season: 3PM/3PA in partial possessions, and who guarded him most">Faced them</th><th title="Projected made threes tonight">Proj 3PM</th>`;
    const sRows = rows.map((x, i) => {
      const [tid, td] = x.top;
      const sec = x.second ? `<small class="dim" style="display:block">then ${esc(dname(x.second[0][0]))} ${pct(x.second[1], 0)}</small>` : "";
      const faced = x.hp >= 3 ? `<td class="l" title="${x.htop ? esc("Most: " + dname(x.htop[1]) + ", " + x.htop[3] + "/" + x.htop[4] + " in " + f1(x.htop[2]) + " poss") : ""}">${x.hm}/${x.ha} <span class="dim">in ${f1(x.hp)} poss</span></td>` : `<td class="mut">–</td>`;
      return `<tr><td class="rk">${i + 1}</td>${v3Who(x.r)}<td>${esc(x.pos)}</td><td class="l"><b>${esc(td.name)}</b> <span class="dim">${pct(x.share, 0)}</span>${sec}</td>${vsTd(td.vs)}<td>${td.a3 ? `${pct(td.m3 / td.a3, 0)} <span class="dim">(${td.m3}/${td.a3})</span>` : "–"}</td>${vsTd(1 + x.fit, 0.25)}${v3Edge(x.extra, 1, 1)}${faced}<td>${f2(x.r.proj_3pm)}</td></tr>`;
    });
    const facing = pFacing(n);
    const dl = Object.keys(facing).flatMap((t) => (I.byTeam[t] || []).map(([id, d]) => ({ id, d, t, out: x3Out(n, t, id) })))
      .filter((x) => x.d.poss >= 100).sort((a, b) => (sort === "gen" ? b.d.vs - a.d.vs : a.d.vs - b.d.vs));
    const guards = (d) => { const tot = POSN.reduce((s, k) => s + (d.pg[k] || 0), 0) || 1; return POSN.filter((k) => d.pg[k] / tot >= 0.15).map((k) => `${k} ${pct(d.pg[k] / tot, 0)}`).join(" · "); };
    const dHead = `<th class="mut" style="text-align:left">#</th><th class="pl">Defender</th><th class="l" title="Share of his matchup time by the position of the man guarded">Guards</th><th title="Partial possessions per game as the matchup defender">Poss/g</th><th title="Threes by the man he guards, per 100 partial possessions">3PA/100</th><th class="gs" title="Threes allowed vs what those same shooters take against everyone else">3PA vs exp</th><th title="3P% allowed (makes/attempts)">3P%</th>`;
    const dRows = dl.map((x, i) => `<tr${x.out ? ' class="mut"' : ""}><td class="rk">${i + 1}</td><td class="pl"><b>${esc(x.d.name)}</b>${x.out ? '<span class="flag">Out</span>' : ""}<small>${tpill(x.t, 1)} defends ${esc(facing[x.t])}</small></td><td class="l">${guards(x.d)}</td><td>${f1(x.d.poss / Math.max(1, x.d.gp))}</td><td>${f1(x.d.a100)}</td>${vsTd(x.d.vs)}<td>${x.d.a3 ? `${pct(x.d.m3 / x.d.a3, 0)} <span class="dim">(${x.d.m3}/${x.d.a3})</span>` : "–"}</td></tr>`);
    const SORTS = [["gen", "Most generous"], ["tough", "Toughest"]];
    return `<section class="card"><header><h3>Shooters and their likely defenders${allG() ? "" : ": " + esc(selLabel())}</h3>${v3Seg("dsort", SORTS, sort, "Order")}</header>
      <p class="cap">From NBA.com's matchup tracking this season (who guarded whom, in partial possessions). <b>Likely defender</b> is the available opponent who spends the most time per game on players at his position; the percentage is his share of that time. <b>3PA vs exp</b> compares the threes a defender's man takes with what those same shooters take against everyone else, so it accounts for who he usually guards; green = gives up more threes. 3P% allowed is shown but swings a lot on small samples. Context only: none of this is in the projection.</p>
      ${v3Table("v3-def-" + sort, sHead, sRows, "shooters", "No shooters with matchup data.")}</section>
      <section class="card"><header><h3>Tonight's defenders against threes</h3></header>
      <p class="cap">Every defender in these games with 100+ partial possessions, ${sort === "gen" ? "most generous first" : "toughest first"}. Players ruled out tonight are faded. League average: ${f1(lg.a100)} 3PA per 100 partial possessions, ${pct(lg.pct, 1)}.</p>
      ${v3Table("v3-defs-" + sort, dHead, dRows, "defenders", "No defenders with enough matchup data yet.")}</section>`;
  }
  const POSN = ["G", "F", "C"];

  // --- Hit rates: how often each shooter clears a 3PM line ---
  const x3AtLeast = (lam, k) => { if (!(lam > 0)) return 0; let t = Math.exp(-lam), s = 0; for (let i = 0; i < k; i++) { s += t; t *= lam / (i + 1); } return Math.max(0, 1 - s); };
  function hitsHTML() {
    const n = currentNight(); if (!n) return emptyBoard();
    const L = x3Doc("logs"); if (L === undefined) return x3Wait("Hit rates"); if (!L) return x3Missing("Hit rates");
    const LINES = [["0.5", "0.5+"], ["1.5", "1.5+"], ["2.5", "2.5+"], ["3.5", "3.5+"], ["4.5", "4.5+"]];
    const line = LINES.some((x) => x[0] === v3Opt("hl")) ? v3Opt("hl") : "1.5", k = Math.ceil(Number(line));
    const SORTS = [["l10", "Last 10"], ["season", "Season"], ["model", "Model"]];
    const sort = SORTS.some((x) => x[0] === v3Opt("hs")) ? v3Opt("hs") : "l10";
    const rate = (g) => (g.length ? g.filter((x) => x[3] >= k).length / g.length : null);
    const rows = v3Rows(n).map((r) => {
      const g = (L.players[String(r.player_id)] || []).filter((x) => x[0] < n.date);
      if (g.length < 3) return null;
      const l10 = g.slice(-10), l5 = g.slice(-5), vo = g.filter((x) => x[1] === r.opp);
      return { r, g, l10, l5, vo, s: rate(g), t10: rate(l10), t5: rate(l5), tv: vo.length ? rate(vo) : null, m: x3AtLeast(r.proj_3pm, k),
        avg: v3Avg(g.map((x) => x[3])), avg10: v3Avg(l10.map((x) => x[3])) };
    }).filter((x) => x && (x.m >= 0.05 || x.t10 > 0));
    const key = sort === "season" ? "s" : sort === "model" ? "m" : "t10";
    rows.sort((a, b) => b[key] - a[key] || b.m - a.m);
    const cell = (v, g, gs) => (v == null ? `<td class="mut">–</td>` : `<td class="h${gs ? " gs" : ""}" style="background:${heat(v)}">${pct(v, 0)} <span class="rkn">${Math.round(v * g.length)}/${g.length}</span></td>`);
    const dots = (g) => `<span class="hitdots" aria-hidden="true">${g.map((x) => `<i class="${x[3] >= k ? "y" : "n"}" title="${esc(fmtDate(x[0]))} vs ${esc(x[1])}: ${x[3]}/${x[4]} in ${x[2]} min"></i>`).join("")}</span>`;
    const head = `<th class="mut" style="text-align:left">#</th><th class="pl">Shooter</th><th title="Share of his games this season with ${k}+ made threes (games)">Season</th><th title="Last 10 games">L10</th><th title="Last 5 games">L5</th><th title="This season against tonight's opponent">vs opp</th><th title="Model's chance of ${k}+ tonight, from projected made threes">Model</th><th title="Last 10 games, oldest to newest: filled = cleared ${line}. Hover for the game.">Last 10</th><th title="Made threes per game: season (last 10)">3PM/g</th><th title="Projected made threes tonight">Proj 3PM</th>`;
    const body = rows.map((x, i) => `<tr><td class="rk">${i + 1}</td>${v3Who(x.r)}${cell(x.s, x.g, sort === "season")}${cell(x.t10, x.l10, sort === "l10")}${cell(x.t5, x.l5)}${x.tv == null ? `<td class="mut">–</td>` : cell(x.tv, x.vo)}<td class="h${sort === "model" ? " gs" : ""}" style="background:${heat(x.m)}">${pct(x.m, 0)}</td><td>${dots(x.l10)}</td><td>${f1(x.avg)} <span class="dim">${f1(x.avg10)}</span></td><td>${f2(x.r.proj_3pm)}</td></tr>`);
    return `<section class="card"><header><h3>Hit rates: ${esc(line)} threes${allG() ? "" : ": " + esc(selLabel())}</h3><span class="v3segs">${v3Seg("hs", SORTS, sort, "Sort by")}</span></header>
      ${v3Chips("hl", LINES, line, "Line")}
      <p class="cap">How often each shooter on tonight's board has made ${k}+ threes, this season and over his last 10 and 5 games (games played only), next to the model's chance tonight. Small numbers are games hit / games played. <b>Model</b> treats his projected made threes as a Poisson average, the same way the board's 2+ and 3+ are figured. Only games before ${esc(fmtDate(n.date))} count. Shooters with 3+ games.</p>
      ${v3Table(`v3-hits-${line}-${sort}`, head, body, "shooters", `Nobody on the board has cleared ${esc(line)} this season.`)}</section>`;
  }

  // ----- Points views: Board, Zones, Play types, Free throws, Pace & totals, Trends, Volume -----
  const VP = [["board", "Board"], ["zones", "Zones"], ["plays", "Play types"], ["ft", "Free throws"], ["pace", "Pace & totals"], ["trends", "Trends"], ["volume", "Volume"]];
  const vpCur = () => (VP.some((x) => x[0] === state.vp) ? state.vp : "board");
  const vpBar = () => `<nav class="v3bar" aria-label="Points views">${VP.map(([k, l]) => `<button type="button" data-vp="${k}" aria-pressed="${vpCur() === k}">${esc(l)}</button>`).join("")}</nav>`;
  function pointsHTML() {
    const v = vpCur();
    return vpBar() + (v === "zones" ? pZonesHTML() : v === "plays" ? pPlaysHTML() : v === "ft" ? pFtHTML() : v === "pace" ? pPaceHTML() : v === "trends" ? pTrendsHTML() : v === "volume" ? pVolumeHTML() : ptsBoardHTML());
  }
  // tonight's points rows (your what-ifs applied) in the picked games; null while loading
  function pRows(n) { const all = ptsRows(n); if (all == null) return null; let rows = wiRows(n, all.slice(), "pts") || []; if (!allG()) rows = rows.filter((r) => inSel(r.game)); return rows; }
  const pLoading = () => `<p class="notice">Loading points…</p>`;
  function pDef() { const PT = (state.defense && state.defense.pts_teams) || [], byT = {}; PT.forEach((d) => (byT[d.team] = d)); return { PT, byT, nT: PT.length }; }
  function pFacing(n) { const facing = {}; (n.games || []).filter((g) => inSel(g.game)).forEach((g) => { facing[g.home] = g.away; facing[g.away] = g.home; }); return facing; }
  // the model's points edge tonight from the picked zones ("z") or play types ("pt")
  const pEdge = (r, key, ks) => { const arr = r[key]; if (!arr) return null; return ks.reduce((t, k) => { const q = arr.find((y) => y[0] === k); return t + (q ? q[2] * r.base_pts * r.f_pace : 0); }, 0); };
  const pShare = (r, key, k) => { const q = (r[key] || []).find((y) => y[0] === k); return q ? q[1] : 0; };
  const pTop = (r, key, ks) => ks.slice().sort((a, b) => pShare(r, key, b) - pShare(r, key, a))[0];
  const pDefTd = (t, facing) => `<td class="pl">${tpill(t, 1)}<small>defends ${esc(facing[t])}</small></td>`;

  // --- Zones ---
  const VPZ = ["rim", "paint", "mid", "corner3", "atb3"];
  const PZ_SH = { rim: "Rim", paint: "Paint", mid: "Mid-range", corner3: "Corner 3", atb3: "Above-break 3", ft: "Free throws" };
  const PZ_PICK = [["all", "All zones"], ["inside", "Rim + paint"], ["rim", "Rim"], ["paint", "Paint"], ["mid", "Mid-range"], ["threes", "Threes"], ["corner3", "Corner 3"], ["atb3", "Above-break 3"]];
  const pzList = (k) => (k === "all" ? VPZ : k === "inside" ? ["rim", "paint"] : k === "threes" ? ["corner3", "atb3"] : [k]);
  const zPts100 = (z, v) => (v && v.per100 != null && v.pct != null ? v.per100 * v.pct * (z === "corner3" || z === "atb3" ? 3 : 2) : null);
  function pZonesHTML() {
    const n = currentNight(); if (!n) return emptyBoard();
    const { PT, byT, nT } = pDef(); if (!PT.length) return v3Empty("Zones", "Defense data isn't loaded yet.");
    const all = pRows(n); if (all == null) return pLoading();
    const pick = PZ_PICK.some((x) => x[0] === v3Opt("pz")) ? v3Opt("pz") : "all", Z = pzList(pick);
    const zv = (d, z) => zPts100(z, ((d || {}).zones || {})[z]);
    const rk = {}; VPZ.forEach((z) => { rk[z] = v3RankBy(byT, (d) => zv(d, z)); });
    const selSum = (d) => Z.reduce((s, z) => s + (zv(d, z) || 0), 0), rkSel = v3RankBy(byT, selSum);
    const lg = {}; VPZ.forEach((z) => { lg[z] = v3Avg(PT.map((d) => zv(d, z))); });
    const facing = pFacing(n), defs = Object.keys(facing).filter((t) => byT[t]).sort((a, b) => rkSel[a] - rkSel[b]);
    const dHead = `<th class="pl">Defense</th>${VPZ.map((z) => `<th${Z.includes(z) ? ' class="gs"' : ""} title="Points allowed per 100 possessions on ${esc(PZ_SH[z].toLowerCase())} shots (hover a cell for shots and FG%); small number = rank of ${nT}, 1 = allows the most">${esc(PZ_SH[z])}</th>`).join("")}`;
    const dRows = defs.map((t) => pDefTd(t, facing) + VPZ.map((z) => { const v = ((byT[t].zones || {})[z]) || {}; return v3Rank(zv(byT[t], z), rk[z][t], nT, f1, false, `${f1(v.per100)} shots per 100 at ${pct(v.pct, 1)}`); }).join("") + "</tr>").map((x) => "<tr>" + x).join("")
      + `<tr><td class="pl mut">League average</td>${VPZ.map((z) => `<td class="mut">${f1(lg[z])}</td>`).join("")}</tr>`;
    const pending = v3Docs(n);
    const rows = all.map((r) => {
      const e = pEdge(r, "z", Z); if (e == null) return null;
      const q = (v3Player(r) || {}).pts || null;
      const sh = Z.reduce((s, z) => s + pShare(r, "z", z), 0);
      const pg = q && q.zone_pts_pg ? Z.reduce((s, z) => s + (q.zone_pts_pg[z] || 0), 0) : r.base_pts * sh;
      let att = 0, made = 0; if (q && q.zones) Z.forEach((z) => { const x = q.zones[z]; if (x && x.att) { att += x.att; made += (x.raw ?? x.pct ?? 0) * x.att; } });
      const top = pTop(r, "z", VPZ);
      return { r, e, sh, pg, fg: att ? made / att : null, att, top, dv: selSum(byT[r.opp] || {}), drk: rkSel[r.opp] };
    }).filter((x) => x && x.sh >= (Z.length === 1 ? 0.05 : 0.1)).sort((a, b) => b.e - a.e);
    const maxPg = Math.max(0.01, ...rows.map((x) => x.pg));
    const spot = (PZ_PICK.find((x) => x[0] === pick) || [, ""])[1].toLowerCase();

    return `<section class="card"><header><h3>Where tonight's defenses give up points</h3></header>
      <p class="cap">Points each defense allows per 100 possessions from each zone (shots there × FG% allowed), this season. Hover a cell for the shots and FG% behind it. The small number is its rank of ${nT} (1 = allows the most); green = more than most teams. Sorted by the zones picked below.</p>

  }

  // --- Play types ---
  const PTK = ["PRBallHandler", "Isolation", "Spotup", "Transition", "PRRollman", "Cut", "Handoff", "OffScreen", "Postup", "OffRebound"];
  const PT_PICK = () => [["all", "All play types"], ...PTK.map((k) => [k, PTL[k]])];
  function pPlaysHTML() {
    const n = currentNight(); if (!n) return emptyBoard();
    const { PT, byT, nT } = pDef(); if (!PT.length) return v3Empty("Play types", "Defense data isn't loaded yet.");

    const pick = PT_PICK().some((x) => x[0] === v3Opt("ppt")) ? v3Opt("ppt") : "all", K = pick === "all" ? PTK : [pick];
    const pv = (d, k, f) => { const x = ((d || {}).playtypes || {})[k]; return x && x[f] != null ? x[f] : null; };
    const rkP = {}, rkF = {}; PTK.forEach((k) => { rkP[k] = v3RankBy(byT, (d) => pv(d, k, "ppp")); rkF[k] = v3RankBy(byT, (d) => pv(d, k, "freq")); });
    const lgP = {}, lgF = {}; PTK.forEach((k) => { lgP[k] = v3Avg(PT.map((d) => pv(d, k, "ppp"))); lgF[k] = v3Avg(PT.map((d) => pv(d, k, "freq"))); });
    const facing = pFacing(n);

    const defs = Object.keys(facing).filter((t) => byT[t]).sort((a, b) => (sortRk[a] ?? 99) - (sortRk[b] ?? 99));
    let dHead, dRows;
    if (pick === "all") {
      dHead = `<th class="pl">Defense</th>${PTK.map((k) => `<th title="Points per possession allowed on ${esc(PTL[k].toLowerCase())} plays (hover a cell for how often opponents run it); small number = rank of ${nT}, 1 = highest">${esc(PTL[k])}</th>`).join("")}`;
      dRows = defs.map((t) => `<tr>${pDefTd(t, facing)}${PTK.map((k) => v3Rank(pv(byT[t], k, "ppp"), rkP[k][t], nT, f2, false, `Opponents run it on ${pct(pv(byT[t], k, "freq"), 1)} of possessions (rank ${rkF[k][t] ?? "–"})`)).join("")}</tr>`).join("")
        + `<tr><td class="pl mut">League average</td>${PTK.map((k) => `<td class="mut">${f2(lgP[k])}</td>`).join("")}</tr>`;

      const rkPts = v3RankBy(byT, (d) => (pv(d, pick, "ppp") != null && pv(d, pick, "freq") != null ? pv(d, pick, "ppp") * pv(d, pick, "freq") * 100 : null));
      dRows = defs.map((t) => { const d = byT[t], f = pv(d, pick, "freq"), p = pv(d, pick, "ppp");
        return `<tr>${pDefTd(t, facing)}${v3Rank(f, rkF[pick][t], nT, (v) => pct(v, 1))}${v3Rank(p, rkP[pick][t], nT, f2)}${v3Rank(f != null && p != null ? f * p * 100 : null, rkPts[t], nT, f1)}</tr>`; }).join("")
        + `<tr><td class="pl mut">League average</td><td class="mut">${pct(lgF[pick], 1)}</td><td class="mut">${f2(lgP[pick])}</td><td class="mut">${f1(lgF[pick] != null && lgP[pick] != null ? lgF[pick] * lgP[pick] * 100 : null)}</td></tr>`;
    }
    const pending = v3Docs(n);
    const rows = all.map((r) => {
      const e = pEdge(r, "pt", K); if (e == null) return null;
      const q = (v3Player(r) || {}).pts || null, sh = K.reduce((s, k) => s + pShare(r, "pt", k), 0);
      const pg = q && q.pt_pts_pg ? K.reduce((s, k) => s + (q.pt_pts_pg[k] || 0), 0) : r.base_pts * sh;
      const each = PTK.map((k) => [k, pEdge(r, "pt", [k])]).filter((x) => x[1] != null && pShare(r, "pt", x[0]) > 0);
      const best = each.slice().sort((a, b) => b[1] - a[1])[0], worst = each.slice().sort((a, b) => a[1] - b[1])[0];
      const own = pick !== "all" && q && q.playtypes ? q.playtypes[pick] : null;
      return { r, e, sh, pg, top: pTop(r, "pt", PTK), best, worst, own };
    }).filter((x) => x && x.sh >= (K.length === 1 ? 0.05 : 0.1)).sort((a, b) => b.e - a.e);
    const maxPg = Math.max(0.01, ...rows.map((x) => x.pg));
    const ptCell = (x) => (x && Math.abs(x[1]) >= 0.05 ? `${esc(PTL[x[0]])} <span class="${x[1] > 0 ? "up" : "dim"}">${v3Sign(x[1], 1)}</span>` : `<span class="mut">–</span>`);
    const sHead = pick === "all"
      ? `<th class="mut" style="text-align:left">#</th><th class="pl">Scorer</th><th title="Points per game from play types">Play-type pts/g</th><th title="Play type he scores the most from, and its share of his points">Main play type</th><th title="The play type where tonight's defense helps him most">Best tonight</th><th title="The play type where tonight's defense hurts him most">Worst tonight</th><th class="gs" title="What the model adds to his points tonight across all play types">Play-type edge</th><th title="Projected points tonight">Proj pts</th>`
      : `<th class="mut" style="text-align:left">#</th><th class="pl">Scorer</th><th title="His points per game from ${esc(PTL[pick].toLowerCase())} plays">His pts/g</th><th title="Share of his points">Share</th><th title="His points per possession on it (possessions)">His PPP</th><th title="How often his defense sees it; small number = rank of ${nT}, 1 = most">Def how often</th><th title="Points per possession his defense allows on it; small number = rank, 1 = highest">Def PPP</th><th class="gs" title="What the model adds to his points tonight from how this defense handles it">Edge</th><th title="Projected points tonight">Proj pts</th>`;
    const sRows = rows.map((x, i) => pick === "all"
      ? `<tr><td class="rk">${i + 1}</td>${v3Who(x.r)}<td class="share" style="--w:${Math.round((x.pg / maxPg) * 100)}">${f1(x.pg)}</td><td>${esc(PTL[x.top])} <span class="dim">${pct(pShare(x.r, "pt", x.top), 0)}</span></td><td>${ptCell(x.best)}</td><td>${ptCell(x.worst)}</td>${v3Edge(x.e, 1.5, 1)}<td>${f1(x.r.proj_pts)}</td></tr>`
      : `<tr><td class="rk">${i + 1}</td>${v3Who(x.r)}<td class="share" style="--w:${Math.round((x.pg / maxPg) * 100)}">${f1(x.pg)}</td><td>${pct(x.sh, 0)}</td><td>${x.own && x.own.ppp != null ? `${f2(x.own.ppp)} <span class="dim">(${x.own.poss})</span>` : "–"}</td>${v3Rank(pv(byT[x.r.opp], pick, "freq"), rkF[pick][x.r.opp], nT, (v) => pct(v, 1))}${v3Rank(pv(byT[x.r.opp], pick, "ppp"), rkP[pick][x.r.opp], nT, f2)}${v3Edge(x.e, 0.8, 1)}<td>${f1(x.r.proj_pts)}</td></tr>`);
    const label = pick === "all" ? "play types" : PTL[pick].toLowerCase() + " plays";
    return `<section class="card"><header><h3>${pick === "all" ? "How tonight's defenses handle each play type" : esc(PTL[pick]) + ": tonight's defenses"}</h3></header>
      <p class="cap">${pick === "all" ? `Points per possession each defense allows on each play type, this season; hover a cell for how often opponents run it. Sorted by the defense's overall play-type edge for scorers.` : `How often opponents run it against each defense and how well it works, this season. Sorted by points allowed per 100 possessions from it.`} The small number is its rank of ${nT} (1 = most or highest); green = better for scorers.</p>
      <div class="scroll"><table><thead><tr>${dHead}</tr></thead><tbody>${dRows}</tbody></table></div></section>
      <section class="card"><header><h3>Scorers by play type${allG() ? "" : ": " + esc(selLabel())}</h3></header>
      ${v3Chips("ppt", PT_PICK(), pick, "Play type")}
      <p class="cap">Tonight's scorers ranked by the points the model adds (or takes away) from how his defense handles ${esc(label)}, given how much of his scoring comes from them. Same numbers as the play-type rows on his player card.${v3Loading(pending)}</p>
      ${v3Table("vp-plays-" + pick, sHead, sRows, "scorers", "No scorers get enough of their points from this.")}</section>`;
  }

  // --- Free throws ---
  function pFtHTML() {
    const n = currentNight(); if (!n) return emptyBoard();
    const { PT, byT, nT } = pDef(); if (!PT.length) return v3Empty("Free throws", "Defense data isn't loaded yet.");

    const dRows = defs.map((t) => `<tr>${pDefTd(t, facing)}${v3Rank(byT[t].fta_100, rkF[t], nT, f1)}${v3Rank(byT[t].def_rating, rkD[t], nT, f1)}${v3Rank(byT[t].pace, rkPace[t], nT, f1)}</tr>`).join("")
      + `<tr><td class="pl mut">League average</td><td class="mut">${f1(lgF)}</td><td class="mut">${f1(v3Avg(PT.map((d) => d.def_rating)))}</td><td class="mut">${f1(v3Avg(PT.map((d) => d.pace)))}</td></tr>`;

    const sHead = `<th class="mut" style="text-align:left">#</th><th class="pl">Scorer</th><th title="His free-throw points per game">FT pts/g</th><th title="Share of his points from free throws">Share</th><th title="Free-throw attempts per game at his projected minutes tonight">FTA tonight</th><th title="His FT%">FT%</th><th title="Free-throw attempts his defense allows per 100 possessions; small number = rank of ${nT}, 1 = most">Def FTA/100</th><th class="gs" title="What the model adds to his points tonight from how often this defense sends players to the line">FT edge</th><th title="Projected points tonight">Proj pts</th>`;
    const sRows = rows.map((x, i) => `<tr><td class="rk">${i + 1}</td>${v3Who(x.r)}<td class="share" style="--w:${Math.round((x.pg / maxPg) * 100)}">${f1(x.pg)}</td><td>${pct(x.sh, 0)}</td><td>${f1(x.fta)}</td><td>${x.ftp != null ? pct(x.ftp, 0) : "–"}</td>${x.d ? v3Rank(x.d.fta_100, rkF[x.r.opp], nT, f1) : `<td class="mut">–</td>`}${v3Edge(x.e, 0.6, 1)}<td>${f1(x.r.proj_pts)}</td></tr>`);

      ${v3Table("vp-ft", sHead, sRows, "scorers", "No free-throw scorers in these games.")}</section>`;
  }

  // --- Pace & totals ---
  function pPaceHTML() {
    const n = currentNight(); if (!n) return emptyBoard();
    const { byT, nT } = pDef();
    const all = pRows(n); if (all == null) return pLoading();
    const mode = v3Opt("ppace", "pace") === "total" ? "total" : "pace";
    const rkPace = v3RankBy(byT, (d) => d.pace);
    const games = (n.games || []).filter((g) => inSel(g.game));
    const boardPts = (t) => all.filter((r) => r.team === t).reduce((s, r) => s + (r.proj_pts || 0), 0);
    const paceOf = (g) => all.find((r) => r.game === g.game);
    const gRows = games.slice().sort((a, b) => (ouOf(b) ?? -1) - (ouOf(a) ?? -1)).map((g) => {
      const ap = byT[g.away], hp = byT[g.home], bp = boardPts(g.away) + boardPts(g.home), ou = ouOf(g), any = paceOf(g);
      return `<tr><td class="pl">${tpill(g.away, 1)} @ ${tpill(g.home, 1)}<small>${esc(g.tip || "")}</small></td><td class="gs"><b>${ou != null ? f1(ou) : "–"}</b>${g.total_src ? ` <span class="dim">${esc(g.total_src)}</span>` : ""}</td>${ap ? v3Rank(ap.pace, rkPace[g.away], nT, f1) : `<td class="mut">–</td>`}${hp ? v3Rank(hp.pace, rkPace[g.home], nT, f1) : `<td class="mut">–</td>`}<td>${any && any.f_pace ? v3Sign((any.f_pace - 1) * 100, 1) + "%" : "–"}</td><td>${f1(bp)}${ou != null ? ` <span class="${bp - ou >= 0 ? "up" : "dim"}">${v3Sign(bp - ou, 1)}</span>` : ""}</td></tr>`;
    }).join("");
    const gHead = `<th class="pl">Game</th><th class="gs" title="Sportsbook over/under">O/U</th><th title="Away team's pace (possessions per 48); small number = rank of ${nT}, 1 = fastest">Away pace</th><th title="Home team's pace; small number = rank, 1 = fastest">Home pace</th><th title="How much the model's pace adjustment moves points in this game">Pace effect</th><th title="Projected points of every player on the board in this game, added up, and the gap to the over/under">Board pts</th>`;
    const rows = all.map((r) => ({ r, pp: r.f_pace ? r.proj_pts * (1 - 1 / r.f_pace) : 0, ou: ouOf((n.games || []).find((g) => g.game === r.game)) }))
      .filter((x) => x.r.proj_pts >= 5)
      .sort((a, b) => (mode === "pace" ? b.pp - a.pp : (b.ou ?? -1) - (a.ou ?? -1) || b.r.proj_pts - a.r.proj_pts));
    const sHead = `<th class="mut" style="text-align:left">#</th><th class="pl">Scorer</th><th${mode === "total" ? ' class="gs"' : ""} title="Game over/under">Game O/U</th><th title="Pace adjustment for his game">Pace effect</th><th${mode === "pace" ? ' class="gs"' : ""} title="Points the model's pace adjustment adds or takes away">Pace pts</th><th title="Projected points tonight">Proj pts</th><th title="His projection against a league-average defense at league-average pace">Normal</th><th>Grade</th>`;
    const sRows = rows.map((x, i) => `<tr><td class="rk">${i + 1}</td>${v3Who(x.r)}<td>${x.ou != null ? f1(x.ou) : "–"}</td><td>${x.r.f_pace ? v3Sign((x.r.f_pace - 1) * 100, 1) + "%" : "–"}</td>${v3Edge(x.pp, 0.8, 2)}<td><b>${f1(x.r.proj_pts)}</b></td><td class="mut">${f1(x.r.base_pts)}</td><td>${gradeChip(x.r.grade, x.r.gate)}</td></tr>`);
    const MODES = [["pace", "Pace boost"], ["total", "Highest totals"]];
    return `<section class="card"><header><h3>Tonight's games by total</h3></header>
      <p class="cap">Each game's over/under next to both teams' pace this season and what the model's pace adjustment does to scoring. <b>Board pts</b> adds up every player's projected points in the game (players below the board's minutes cut aren't counted) and shows the gap to the over/under. The points model uses pace, not the over/under, so a big gap is worth a look. Pace small number = rank of ${nT}, 1 = fastest.</p>
      <div class="scroll"><table><thead><tr>${gHead}</tr></thead><tbody>${gRows || `<tr><td class="l" colspan="6" style="padding:14px 16px">No games.</td></tr>`}</tbody></table></div></section>
      <section class="card"><header><h3>${mode === "pace" ? "Biggest pace boosts" : "Scorers in the highest-total games"}${allG() ? "" : ": " + esc(selLabel())}</h3>${v3Seg("ppace", MODES, mode, "Rank by")}</header>
      <p class="cap">${mode === "pace" ? "Scorers ranked by the points the pace adjustment adds to their projection (5+ projected points)." : "Scorers in the games with the highest over/unders first, then by projected points (5+ projected points)."}</p>
      ${v3Table("vp-pace-" + mode, sHead, sRows, "scorers", "No scorers in these games.")}</section>`;
  }

  // --- Trends ---
  function pTrendsHTML() {
    const n = currentNight(); if (!n) return emptyBoard();
    const all = pRows(n); if (all == null) return pLoading();
    const pending = v3Docs(n);
    const N = ["3", "5", "10"].includes(v3Opt("ptw")) ? Number(v3Opt("ptw")) : 5;
    const met = v3Opt("ptm", "pts") === "min" ? "min" : "pts", dir = v3Opt("ptd", "up") === "down" ? "down" : "up";
    const rows = all.map((r) => {
      const p = v3Player(r); if (!p) return null;
      const g = (p.recent || []).filter((x) => x && x[2] > 0 && x[5] != null).slice().sort((a, b) => (a[0] < b[0] ? 1 : -1));
      const s = (p.seasons || []).find((x) => x.season === (p.recent_season || "2026-27")) || null;
      if (!s || !s.gp || s.gp < 3 || g.length < Math.min(N, 3)) return null;
      const L = g.slice(0, N), lp = v3Avg(L.map((x) => x[5])), lmin = v3Avg(L.map((x) => x[2]));
      return { r, g10: g.slice(0, 10).reverse(), lp, lmin, s, dP: lp - s.pts, dM: lmin - s.min };
    }).filter((x) => x && (x.s.pts >= 4 || x.lp >= 4));
    const key = met === "pts" ? "dP" : "dM";
    const list = rows.filter((x) => (dir === "up" ? x[key] > 0.05 : x[key] < -0.05)).sort((a, b) => (dir === "up" ? b[key] - a[key] : a[key] - b[key]));
    const spark = (gs) => {
      const mx = Math.max(10, ...gs.map((x) => x[5])), w = 7;
      return `<svg class="spark" viewBox="0 0 ${gs.length * w} 24" width="${gs.length * w}" height="24" aria-hidden="true">${gs.map((x, i) => { const h = (x[5] / mx) * 22;
        return `<g><title>${esc(fmtDate(x[0]))} ${esc(x[1])}: ${x[5]} pts in ${x[2]} min</title><rect x="${i * w + 1}" y="0" width="${w - 2}" height="24" class="sa" opacity=".35"/><rect x="${i * w + 1}" y="${24 - h}" width="${w - 2}" height="${Math.max(h, 0.5)}" class="sm"/></g>`; }).join("")}</svg>`;
    };
    const two = (a, b) => `${f1(a)} <span class="dim">${f1(b)}</span>`;

      <p class="cap">Tonight's scorers whose last ${N} games are ${dir === "up" ? "above" : "below"} their season average, ranked by the change in ${met === "pts" ? "points" : "minutes"} per game. Each cell shows the last ${N} games first and the season in gray. A minutes change usually means a role change and tends to stick better than a points change. This season's games only, so early on the window is a big part of the season.${v3Loading(pending)}</p>
      ${v3Table(`vp-tr-${dir}-${N}-${met}`, head, body, "scorers", pending ? "Loading game logs…" : `Nobody's ${met === "pts" ? "points" : "minutes"} are ${dir === "up" ? "up" : "down"} over the last ${N}.`)}</section>`;
  }

  // --- Volume ---
  function pVolumeHTML() {
    const n = currentNight(); if (!n) return emptyBoard();
    const all = pRows(n); if (all == null) return pLoading();
    const pending = v3Docs(n);
    const mode = v3Opt("pvol", "out") === "q" ? "q" : "out";
    const orig = {}; (ptsRows(n) || []).forEach((r) => (orig[String(r.player_id)] = r));
    const Q = qList(n);
    const nm = (team, id) => { const td = state.teamDocs[team], p = td && td.players && td.players[id]; const inj = ((n.injuries || {})[team] || []).find((x) => String(x.player_id) === id); const q = Q.find((x) => x.pid === id); return (p && p.name) || (inj && inj.player) || (q && q.name) || "Teammate"; };
    const rows = all.map((r) => {

      const k = o.inj_pts || 1, km = o.inj_min || 1, p0 = o.proj_pts / k, min0 = o.min / km;
      const outs = currentOuts(n, r.team).filter((x) => x !== pid), outsRot = ctx ? outs.filter((x) => ctx.min[x] != null) : outs;

      let qP = null;
