      const flags = (r.flags || "").split(",").map((x) => x.trim()).filter(Boolean).map((f) => `<span class="flag">${esc(f)}</span>`).join("");
      const actualCell = graded ? (a && a.ast != null ? `<td class="gs hit" style="background:${heat(edgeT(a.ast - r.proj_ast, 4))};color:var(--cell-ink)">${a.ast}</td>` : `<td class="gs mut">DNP</td>`) : "";
      return `<tr>
        <td class="rk">${r.rank ?? ""}</td>
        <td class="pl"><button type="button" class="link" data-player="${r.player_id}">${esc(r.player)}</button>${flags}<small><button type="button" class="tlink" data-team="${esc(r.team)}">${esc(r.team)}</button> ${r.home ? "vs" : "@"} <button type="button" class="tlink" data-team="${esc(r.opp)}">${esc(r.opp)}</button></small></td>
        <td>${gradeChip(r.grade, r.gate)}</td>
        <td class="gs share" style="--w:${Math.round((r.proj_ast / maxA) * 100)}">${f1(r.proj_ast)}</td>
        <td class="mut">${f1(r.base_ast)}</td>
        <td class="h" style="background:${heat(edgeT(r.boost, 0.07))}">${sgn(r.boost)}</td>
        <td class="gs h" style="background:${heat(edgeT(r.zone_edge, 0.08))}">${sgn(r.zone_edge)}</td>
        ${ark ? rankCell(ark.pot[r.opp], "Potential assists allowed") + rankCell(ark.conv[r.opp], "Conversion allowed") : `<td class="mut">–</td><td class="mut">–</td>`}
        <td class="gs mut">${f1(r.pot_pg)}</td>
        <td class="mut">${f1(r.min)}</td>
        ${actualCell}
        <td class="why">${esc(r.drivers || "Neutral matchup")}</td></tr>`;
    }).join("");
    let summary = "";
    if (graded) {
      const xs = all.map((r) => ({ r, a: n.results[String(r.player_id)] })).filter((x) => x.a && x.a.ast != null);
      const sum = (arr, f) => arr.reduce((t, x) => t + f(x), 0);
      const good = xs.filter((x) => ["A+", "A"].includes(x.r.grade)), bad = xs.filter((x) => ["D", "F"].includes(x.r.grade));
      const tile = (big, small) => `<div class="tile"><b>${big}</b><small>${small}</small></div>`;
      if (xs.length) summary = `<section class="card"><header><h3>How the night graded</h3></header><div class="tiles">
        ${tile(`${sum(xs, (x) => x.a.ast)} <span style="font-size:18px;color:var(--ink-3)">/ ${f1(sum(xs, (x) => x.r.proj_ast))}</span>`, "Assists vs projected, players who played")}
        ${good.length ? tile(sgnPts2(sum(good, (x) => x.a.ast - x.r.base_ast) / good.length), `A and A+ matchups vs their normal (${good.length})`) : ""}
        ${bad.length ? tile(sgnPts2(sum(bad, (x) => x.a.ast - x.r.base_ast) / bad.length), `D and F matchups vs their normal (${bad.length})`) : ""}</div></section>`;
    }
    return `${summary}<section class="card">
      <header><h3>${esc(allG() ? "Every passer" : selLabel())}</h3>
        <span class="seg" role="group" aria-label="Which players">
          <button type="button" data-show="all" aria-pressed="${state.show === "all"}">All</button>
          <button type="button" data-show="best" aria-pressed="${state.show === "best"}">B or better</button>
          <button type="button" data-show="proven" aria-pressed="${state.show === "proven"}" title="Only players with established volume and sample">Proven volume</button>
        </span></header>
      ${injLine(n)}<p class="cap">Ranked by projected assists. <b>Zones</b> matches where his assists go (lobs at the rim, kick-outs to the corner...) against the assisted baskets this defense gives up there; with pace, it sets the <b>Matchup</b> and grade. <b>Chances</b> and <b>Conversion</b> rank the opponent in potential assists allowed and how often those go in (1st = most generous) as context. Click a player for his assisting zones.${n.note ? " " + esc(n.note) : ""}</p>
      <div class="scroll"><table><thead>${head}</thead><tbody>${body || `<tr><td class="l" colspan="14" style="padding:14px 16px">No players match this filter.</td></tr>`}</tbody></table></div></section>`;
  }

  function astResultsHTML() {
    const graded = state.nights.filter((n) => n.status === "graded" && n.results && n.ast_index && Object.keys(n.ast_index).length);
    if (!graded.length) return resultsHTML();
    const by = {}; ["A+", "A", "B", "C", "D", "F", "–"].forEach((g) => (by[g] = []));
    const nightRows = graded.map((n) => {
      let made = 0, proj = 0, cnt = 0;
      Object.entries(n.ast_index).forEach(([pid, v]) => {
        const a = n.results[pid]; if (!a || a.ast == null) return;
        by[v[1]] && by[v[1]].push({ p: v[0], base: v[4], a: a.ast }); made += a.ast; proj += v[0]; cnt++;
      });
      return `<tr><td class="pl"><button type="button" class="sortb" data-open="${esc(n.id)}" style="color:var(--accent)">${esc(fmtDate(n.id))}</button></td><td>${(n.games || []).length}</td><td>${cnt}</td><td class="gs">${f1(proj)}</td><td>${made}</td><td class="mut">${sgn(proj ? made / proj - 1 : NaN)}</td></tr>`;
    }).join("");
    const avg = (arr, f) => (arr.length ? arr.reduce((t, x) => t + f(x), 0) / arr.length : NaN);
    const gradeRows = Object.entries(by).map(([g, arr]) => {
      const diff = avg(arr, (x) => x.a - x.base);
      return `<tr><td class="pl">${gradeChip(g)}</td><td>${arr.length}</td><td class="mut">${f2(avg(arr, (x) => x.base))}</td><td>${f2(avg(arr, (x) => x.p))}</td><td class="gs">${f2(avg(arr, (x) => x.a))}</td>
        <td class="h" style="background:${arr.length ? heat(edgeT(diff, 1)) : "transparent"}">${arr.length ? sgnPts2(diff) : "–"}</td></tr>`;
    }).join("");
    const total = Object.values(by).reduce((t, a) => t + a.length, 0);
    return `<section class="card"><header><h3>Assists by matchup grade</h3><span class="eyebrow">${total} player-games · ${graded.length} nights</span></header>
      <p class="cap"><b>Beat normal</b> is actual assists minus the player's normal projection. A working model shows it rising from F to A+ over a few hundred player-games.</p>
      <div class="scroll"><table><thead><tr><th class="pl">Grade</th><th>Players</th><th>Normal</th><th>Projected</th><th class="gs">Actual</th><th>Beat normal</th></tr></thead><tbody>${gradeRows}</tbody></table></div></section>
      <section class="card"><header><h3>Night by night</h3></header><div class="scroll"><table><thead><tr><th class="pl">Night</th><th>Games</th><th>Graded</th><th class="gs">Projected</th><th>Actual</th><th>Diff</th></tr></thead><tbody>${nightRows}</tbody></table></div></section>`;
  }

  function astRanks() {
    const d = state.defense; if (!d || !d.ast_teams) return null;
    if (state._ark && state._ark.src === d.ast_teams) return state._ark;
    const T = d.ast_teams, rk = { src: T, pot: {}, conv: {}, z: {} };
    const rankBy = (vals) => { const ids = Object.keys(vals).sort((a, b) => vals[b] - vals[a]); const o = {}; ids.forEach((id, i) => (o[id] = i + 1)); return o; };
    const pot = {}, conv = {}; T.forEach((t) => { pot[t.team] = t.pot_100; conv[t.team] = t.conv; });
    rk.pot = rankBy(pot); rk.conv = rankBy(conv);
    AZK.forEach((z) => { const v = {}; T.forEach((t) => { if (t.zones && t.zones[z] != null) v[t.team] = t.zones[z]; }); rk.z[z] = rankBy(v); });
    state._ark = rk; return rk;
  }

  function astDefenseHTML() {
    const d = state.defense;
    if (!d || !d.ast_teams) return astMissing();
    const rk = astRanks(), m = (state.meta && state.meta.assists) || {}, rel = m.zone_rel || {};
    const teams = d.ast_teams.slice();
    const k = state.adsort.key, dir = state.adsort.dir === "asc" ? 1 : -1;
    teams.sort((a, b) => (k === "team_name" ? dir * a.team_name.localeCompare(b.team_name) : dir * ((a[k] ?? 0) - (b[k] ?? 0))));
    const th = (key, label, cls = "", title = "") => {
      const sa = state.adsort.key === key ? ` aria-sort="${state.adsort.dir === "asc" ? "ascending" : "descending"}"` : "";
      return `<th class="${cls}"${sa}${title ? ` title="${esc(title)}"` : ""}><button type="button" class="sortb" data-adsort="${key}">${label}</button></th>`;
    };
    const lowRel = (z) => rel[z] != null && rel[z] < 0.3;
    const body = teams.map((t) => `<tr><td class="rk">${t.rank}</td><td class="pl"><button type="button" class="link" data-team="${esc(t.team)}">${esc(t.team_name)}</button><small>${esc(t.team)}</small></td><td>${gradeChip(t.grade)}</td>
      <td class="h gs" style="background:${heat(edgeT(t.boost, 0.07))}">${sgn(t.boost)}</td>
      ${rankCell(rk.pot[t.team], `${t.pot_100} potential assists allowed per 100`).replace('<td class="h"', '<td class="h gs"')}${rankCell(rk.conv[t.team], `${pct(t.conv)} of potential assists become assists`)}
      ${AZK.map((z, i) => t.zones && t.zones[z] != null ? (lowRel(z) ? `<td class="mut${i === 0 ? " gs" : ""}" title="${t.zones[z]} per 100 (mostly chance)">${ord(rk.z[z][t.team])}</td>` : rankCell(rk.z[z][t.team], `${t.zones[z]} assisted makes allowed per 100`).replace('<td class="h"', `<td class="h${i === 0 ? " gs" : ""}"`)) : `<td class="mut">–</td>`).join("")}
      <td class="mut gs">${f1(t.pace)}</td><td class="mut">${f1(t.ast_100)}</td></tr>`).join("");
    return `<section class="card"><header><h3>Assist defense, all 30 teams</h3><span class="eyebrow">${esc(d.basis || "")}</span></header>
      <p class="cap">Matchup is how each defense moves a typical passer's assists. Ranks: <b>1st is the most generous</b>, green helps passers. Chances = potential assists allowed per 100 possessions; Conversion = share of those that become assists; zone columns = assisted baskets allowed per 100 in that zone. Hover a cell for the raw number.</p>
      <div class="scroll"><table><thead><tr><th class="mut" style="padding-left:16px;text-align:left">#</th>${th("team_name", "Defense", "pl")}<th>Grade</th>${th("boost", "Matchup", "gs")}${th("pot_100", "Chances", "gs")}${th("conv", "Conversion")}${AZK.map((z, i) => `<th class="${i === 0 ? "gs" : ""}">${esc(AZL[z].replace("Above-the-break", "Top"))}</th>`).join("")}${th("pace", "Pace", "gs")}${th("ast_100", "AST/100")}</tr></thead><tbody>${body}</tbody></table></div></section>`;
  }

  function renderPanelAst(P) {
    const n = state.nights.find((x) => x.id === P.nightId);
    const r = n ? (state.ast[n.id] || []).find((x) => String(x.player_id) === P.pid) : null;
    if (!n || !r) { closePanel(); return; }
    const td = state.teamDocs[r.team];
    const prof = td && td.players ? td.players[P.pid] : null;
    const ap = prof && prof.ast ? prof.ast : null;
    const ctx = td && td.inj ? td.inj : null;
    const names = {}; if (td && td.players) Object.entries(td.players).forEach(([k, v]) => (names[k] = v.name));
    const nm = (id) => names[id] || "Teammate";
    const dteam = state.defense && state.defense.ast_teams ? state.defense.ast_teams.find((t) => t.team === r.opp) : null;
    const rk = astRanks(), m = (state.meta && state.meta.assists) || {};
    let mr = r.inj_min ?? 1, pr = r.inj_ast ?? 1;
    const changed = P.out.slice().sort().join() !== P.locked.slice().sort().join();
    if (ctx && ctx.rate_ast && (changed || P.out.length)) { [mr, pr] = injuryRatios(ctx, P.pid, P.out, "ast"); }
    const A0 = r.base_ast, A1 = A0 * r.f_pace, A2 = A1 * (1 + r.pot_edge) / 1, A3 = A0 * r.f_pace * (1 + r.pot_edge + r.zone_edge), A4 = A0 * r.f_pace * (1 + r.pot_edge + r.zone_edge + r.conv_edge), A5 = A4 * pr;
    const minsNow = r.base_min * mr, MF = minFactor(P, minsNow), BEFORE = A5, FIN = A5 * MF, adj = changed || MF !== 1;
    const steps = `
      <div class="step"><span>Normal output<small>${f1(r.base_min)} min · ${f1(r.pot_pg * (r.f_min ?? 1))} potential assists × ${pct(r.conv, 0)} conversion${r.f_team && Math.abs(r.f_team - 1) > 0.002 ? ` · ${sgn(r.f_team - 1)} for his new team's pace` : ""}${minTrim(r)}${capNote(r, "assists")}</small></span><b>${f2(A0)}</b></div>
      <div class="step"><span>Pace<small>${esc(r.opp)} plays ${sgn(r.f_pace - 1)} vs league pace</small></span>${d3(A1 - A0)}</div>
      <div class="step"><span>Assisting zones<small>Where his passes go vs the assisted baskets ${esc(r.opp)} allows there</small></span>${d3(A4 - A1)}</div>
      <div class="step"><span>Teammates out<small>${P.out.length ? esc(P.out.map(nm).join(", ")) : "Nobody"}${changed ? " (what-if)" : ""}</small></span>${d3(A5 - A4)}</div>
      ${MF !== 1 ? `<div class="step"><span>Your minutes<small>${f1(minsNow)} → ${f1(minsNow * MF)} min</small></span>${d3(FIN - BEFORE)}</div>` : ""}
      <div class="step tot"><span>${adj ? "What-if projection" : "Tonight's projection"}</span><b>${f2(FIN)}</b></div>`;
    const base = A0 * r.f_pace;
    const lmix = m.zone_mix || {};
    const zrows = (r.z || []).slice().sort((a, b) => b[1] - a[1]).map(([z, share, delta]) => {
      const allowed = dteam && dteam.zones ? dteam.zones[z] : null;
      const low = m.zone_rel && m.zone_rel[z] < 0.3;
      const rr = rk ? rk.z[z][r.opp] : null;
      const sel = selArr(P, "azone").includes(z);
      return `<tr${sel ? ' class="cur"' : ""}><td><button type="button" class="link" data-azone="${z}" aria-expanded="${sel}">${esc(AZL[z])}</button></td><td><b>${pct(share, 0)}</b></td><td class="mut">${pct(lmix[z], 0)}</td><td class="mut">${allowed != null ? f2(allowed) : "–"}</td>${low ? `<td class="mut" title="Mostly chance">${ord(rr)}</td>` : rankCell(rr)}<td class="h" style="background:${heat(edgeT(delta * base, 0.25))}">${sgnPts2(delta * base)}</td></tr>`;
    }).join("");
    let mates = "";
    if (td === undefined) mates = `<p class="pempty">Loading teammates…</p>`;
    else if (!ctx || !ctx.rotation.length || !ctx.rate_ast || !Object.keys(ctx.rate_ast).length) mates = `<p class="pempty">Teammate data isn't available for ${esc(r.team)} yet.</p>`;
    else {
      mates = `<div class="mates">${ctx.rotation.filter((id) => id !== P.pid).map((id) => {
        const single = injuryRatios(ctx, P.pid, [id], "ast");
        const eff = single[1] - 1, games = single[2][0] ? single[2][0][2] : 0;
        const on = P.out.includes(id), lk = P.locked.includes(id);
        return `<label class="mate${lk ? " locked" : ""}"><input type="checkbox" data-mate="${esc(id)}"${on ? " checked" : ""}>
          <span>${esc(nm(id))}<small>${f1(ctx.min[id])} min${games ? ` · ${games} games without him` : ""}</small></span>
          <em class="${eff > 0.005 ? "up" : "flat"}">${eff > 0.005 ? "+" + (A4 * eff).toFixed(2) + " ast" : "—"}</em></label>`;
      }).join("")}</div>
      <div class="prow"><span>${changed ? `What-if: ${f2(FIN)} vs ${f2(r.proj_ast)} on the board. The board itself doesn't change.` : "Check teammates to see how his assists move if they sit."}</span>
      <button type="button" class="btn" data-reset${changed ? "" : " disabled"}>Reset</button></div>`;
    }
    const prof2 = ap ? `<section class="psec"><h3>Passing profile</h3><div class="prof">
        <div><b>${f1(ap.ast_pg)}</b><small>Assists per game</small></div>
        <div><b>${f1(ap.pot_pg)}</b><small>Potential assists</small></div>
        <div><b>${pct(ap.raw_conv ?? ap.conv, 0)}</b><small>Become assists</small></div>
        <div><b>${f1(ap.passes_pg)}</b><small>Passes per game</small></div>
        <div><b>${f1(ap.sec_pg)}</b><small>Hockey assists</small></div></div></section>` : "";
    const dline = dteam ? `<div class="lens">
        <div><b>${ord(rk.pot[r.opp])}</b><small>Potential assists allowed (${f1(dteam.pot_100)} per 100)</small></div>
        <div><b>${ord(rk.conv[r.opp])}</b><small>Conversion allowed (${pct(dteam.conv)})</small></div>
        <div><b>${f1(dteam.pace)}</b><small>Pace</small></div></div>` : "";
    const seasons = prof && prof.seasons ? prof.seasons.map((x) => `<tr><td>${esc(x.season)}</td><td class="l">${esc(x.team)}</td><td>${x.gp}</td><td>${f1(x.min)}</td><td><b>${x.ast != null ? f1(x.ast) : "–"}</b></td></tr>`).join("") : "";
    const recent = prof && prof.recent ? prof.recent.map((g) => `<tr><td>${esc(fmtDate(g[0]))}</td><td class="l">${esc(g[1])}</td><td>${g[2]}</td><td><b>${g[6] ?? "–"}</b></td></tr>`).join("") : "";
    const hist = state.nights.map((x) => ({ x, v: x.ast_index ? x.ast_index[P.pid] : null })).filter((o) => o.v).map(({ x, v }) => {
      const a = x.results ? x.results[P.pid] : null;
      return `<tr><td>${esc(fmtDate(x.id))}${!teamLocked(x, v[2]) ? ` <small style="color:var(--ink-3)">preview</small>` : ""}</td><td class="l">${v[3] ? "vs" : "@"} ${esc(v[2])}</td><td>${gradeChip(v[1])}</td><td>${f1(v[0])}</td><td>${a && a.ast != null ? a.ast : x.status === "graded" ? "DNP" : "–"}</td></tr>`;
    }).join("");
    $("#panel").innerHTML = `
      <div class="phead"><div><h2 id="ptitle">${esc(r.player)}</h2><div class="meta"><button type="button" class="tlink" data-team="${esc(r.team)}">${esc(r.team)}</button> ${r.home ? "vs" : "@"} ${esc(r.opp)} · ${esc(fmtDate(n.id))}${r.tip ? " · " + esc(r.tip) : ""}</div></div>
        <button type="button" class="xbtn" data-close aria-label="Close">×</button></div>
      <div class="pin">
        <div class="big3">
          <div><b>${f1(FIN)}${adj ? `<span class="was">was ${f1(r.proj_ast)}</span>` : ""}</b><small>Projected assists</small></div>
          ${minutesControl(P, minsNow, MF)}
          <div><b style="display:flex;gap:8px;align-items:center">${gradeChip(r.grade, r.gate)}<span style="font-size:20px">${sgn(r.boost)}</span></b><small>Matchup</small></div>
        </div>
        <section class="psec"><h3>Assists, last 10 games</h3>${prof ? lastTenChart(prof, "ast", FIN) : `<p class="pempty">Loading…</p>`}</section>
        <section class="psec"><h3>How tonight's number is built</h3><div class="steps">${steps}</div></section>
        <section class="psec"><h3>Where his assists go vs ${esc(r.opp)}</h3>
          <p class="cap">Share of his assists by the zone of the shot, next to the league's mix, against the assisted baskets ${esc(r.opp)} allows there per 100 possessions. Rank: 1st = most generous. Edge is the net effect in assists tonight.</p>
          ${zrows ? `<div class="scroll ptab"><table><thead><tr><th>Zone</th><th>His assists</th><th>League</th><th>${esc(r.opp)} allows</th><th>Rank</th><th>Edge</th></tr></thead><tbody>${zrows}</tbody></table></div>
          <p class="cap" style="padding-top:2px">Click a zone to compare his teammates; click more to compare several at once.</p>${selArr(P, "azone").length > 1 ? zoneMatesCombo(P, r, td, selArr(P, "azone")) : selArr(P, "azone").length ? zoneMates(P, r, td, lmix) : ""}` : `<p class="pempty">Zone data isn't loaded yet.</p>`}
          ${dline ? `<p class="cap" style="padding:8px 14px 0">Context: how many potential assists ${esc(r.opp)} allows and how often they go in. The zone matchup already reflects both.</p>${dline}` : ""}</section>
        ${historyHTML(n, r, "ast")}${compsHTML(n, r, "ast")}
        ${prof2}
        <section class="psec"><h3>If teammates sit</h3><p class="cap">Missing minutes and touches are redistributed, calibrated to how teams actually adjusted last season.</p>${mates}</section>
        ${seasons ? `<section class="psec"><h3>By season</h3><div class="scroll ptab"><table><thead><tr><th>Season</th><th class="l">Team</th><th>GP</th><th>Min</th><th>AST</th></tr></thead><tbody>${seasons}</tbody></table></div></section>` : ""}
        <section class="psec"><h3>Last 10 games</h3>${recent ? `<div class="scroll ptab"><table><thead><tr><th>Date</th><th class="l">Game</th><th>Min</th><th>AST</th></tr></thead><tbody>${recent}</tbody></table></div>` : `<p class="pempty">No games yet.</p>`}</section>
        <section class="psec"><h3>On this board</h3>${hist ? `<div class="scroll ptab"><table><thead><tr><th>Night</th><th class="l">Opp</th><th>Grade</th><th>Proj</th><th>Actual</th></tr></thead><tbody>${hist}</tbody></table></div>` : `<p class="pempty">First appearance.</p>`}</section>
      </div>`;
  }

  function howAstHTML(m) {
    const a = m.assists || {};
    return `<section class="card"><header><h3>How the assists projection works</h3>${m.model_version ? `<span class="eyebrow">Model v${esc(m.model_version)}</span>` : ""}</header>
      <div class="prose">
        <p class="formula">Projected assists = minutes × potential assists × conversion × pace × (1 + zone edge)</p>
        <h4>His baseline</h4>
        <p>NBA tracking counts potential assists: passes that lead to a shot, made or not. A player's baseline is his potential assists per minute times his conversion rate (pulled toward the league's ${a.conv != null ? pct(a.conv, 0) : "56%"} until he has a big sample). It is steadier than raw assists, especially early in the season.</p>
        <h4>Assisting zones</h4>
        <p>Play-by-play records the passer on every assisted basket and where the shot came from. The model knows each passer's mix (lobs and dump-offs at the rim, paint, mid-range, kick-outs to the corner, threes up top) and matches it against the assisted baskets each defense allows per 100 possessions in each zone, credited by reliability (rim ${a.zone_rel ? a.zone_rel.rim : 0.92}, corner 3 ${a.zone_rel ? a.zone_rel.corner3 : 0.64}, mid-range ${a.zone_rel ? a.zone_rel.mid : 0.57}).</p>
        <h4>What the tests showed</h4>
        <p>On 18,631 games from 2025-26, the zone matchup, built from half the season's games and tested on the other half, clearly predicted assists. It also beat a defense's total assisted baskets allowed, so where a passer's assists go matters, not just how generous the defense is overall. Potential assists allowed and conversion allowed only looked predictive when tested on the same games they came from, and together they measure what the zone lens already captures, so they are shown as context rather than added on top.</p>
        <h4>Teammates out</h4>
        <p>When a teammate is ruled out, his minutes and touches go to the rest of the rotation, calibrated to last season. Teams recovered about 95% of a missing player's assists. Use the Injuries tab to sit players and see every teammate's change.</p>
      </div></section>`;
  }


  // ======================= REBOUNDS =======================
  function rebMissing() {
    return `<section class="card"><header><h3>Rebounds</h3></header><div class="empty"><p>Rebound ratings start with the next board built after this update.</p></div></section>`;
  }
  // the four opponent lenses, as fractions of his total rebounds
  const RB_LENS = [
    { k: "e_miss", h: "Misses", t: "How often the opponent misses (more misses, more defensive boards)" },
    { k: "e_dcomp", h: "Their O-glass", t: "How hard the opponent crashes the offensive glass (less crashing leaves more defensive boards)" },
    { k: "e_ocomp", h: "Their D-glass", t: "How well the opponent secures its defensive boards (weaker leaves more offensive boards)" },
  ];
  function rebRanks() {
    const d = state.defense; if (!d || !d.reb_teams) return null;
    if (state._rrk && state._rrk.src === d.reb_teams) return state._rrk;
    const T = d.reb_teams, rk = { src: T };
    const rankBy = (get, high) => { const v = {}; T.forEach((t) => (v[t.team] = get(t))); const ids = Object.keys(v).sort((a, b) => high ? v[b] - v[a] : v[a] - v[b]); const o = {}; ids.forEach((id, i) => (o[id] = i + 1)); return o; };
    rk.miss = rankBy((t) => t.miss100, true);       // most misses = most generous
    rk.oreb = rankBy((t) => t.oreb_pct, false);     // least offensive rebounding = most generous
    rk.dreb = rankBy((t) => t.dreb_pct, false);     // weakest defensive rebounding = most generous
    rk.forced = rankBy((t) => t.forced100, true);
    rk.pace = rankBy((t) => t.pace, true);
    state._rrk = rk; return rk;
  }
  function rebBoardHTML() {
    const n = currentNight();
    if (!n) return emptyBoard();
    if (!n.reb_index || !Object.keys(n.reb_index).length) return rebMissing();
    const all = state.reb[n.id];
    if (all == null) return `<p class="notice">Loading rebounds…</p>`;
    let rows = wiRows(n, all.slice(), "reb");
    if (!allG()) rows = rows.filter((r) => inSel(r.game));
    if (state.show === "best") rows = rows.filter((r) => ["A+", "A", "B"].includes(r.grade));
    else if (state.show === "proven") rows = rows.filter((r) => !r.gate && r.grade !== "–");
    const k = state.rsort.key, dir = state.rsort.dir === "asc" ? 1 : -1;
    const actual = (r) => (n.results && n.results[String(r.player_id)] ? n.results[String(r.player_id)].reb : null);
    rows.sort((a, b) => {
      if (k === "grade") return ((a.grade === "–") - (b.grade === "–")) || dir * ((GRADE_T[a.grade] ?? 0) - (GRADE_T[b.grade] ?? 0)) || b.proj_reb - a.proj_reb;
      if (k === "player") return dir * String(a.player).localeCompare(String(b.player));
      if (k === "actual") return dir * ((actual(a) ?? -1) - (actual(b) ?? -1));
      return dir * ((a[k] ?? -1) - (b[k] ?? -1));
    });
    const graded = n.status === "graded" && n.results;
    const maxR = Math.max(1, ...all.map((r) => r.proj_reb || 0));
    const th = (key, label, cls = "", title = "") => {
      const sa = state.rsort.key === key ? ` aria-sort="${state.rsort.dir === "asc" ? "ascending" : "descending"}"` : "";
      return `<th class="${cls}"${sa}${title ? ` title="${esc(title)}"` : ""}><button type="button" class="sortb" data-rsort="${key}">${label}</button></th>`;
    };
    const head = `<tr><th class="mut" style="padding-left:16px;text-align:left">#</th>${th("player", "Player", "pl")}${th("grade", "Grade")}
      ${th("proj_reb", "Proj REB", "gs", "Projected rebounds tonight")}${th("base_reb", "Normal", "", "His projection against a league-average opponent at league pace")}${th("boost", "Matchup", "", "How much tonight's opponent and pace move his rebounds")}
      ${RB_LENS.map((c, i) => th(c.k, c.h, i === 0 ? "gs" : "", c.t + ", as a share of his rebounds")).join("")}
      ${th("dreb_pg", "DREB", "gs", "His defensive rebounds per game")}${th("oreb_pg", "OREB", "", "His offensive rebounds per game")}${th("min", "Min")}${graded ? th("actual", "Actual", "gs", "Rebounds") : ""}<th class="l">Why</th></tr>`;
    const body = rows.map((r) => {
      const a = graded ? n.results[String(r.player_id)] : null;
      const flags = (r.flags || "").split(",").map((x) => x.trim()).filter(Boolean).map((f) => `<span class="flag">${esc(f)}</span>`).join("");
      const actualCell = graded ? (a && a.reb != null ? `<td class="gs hit" style="background:${heat(edgeT(a.reb - r.proj_reb, 5))};color:var(--cell-ink)">${a.reb}</td>` : `<td class="gs mut">DNP</td>`) : "";
      return `<tr>
        <td class="rk">${r.rank ?? ""}</td>
        <td class="pl"><button type="button" class="link" data-player="${r.player_id}">${esc(r.player)}</button>${flags}<small><button type="button" class="tlink" data-team="${esc(r.team)}">${esc(r.team)}</button> ${r.home ? "vs" : "@"} <button type="button" class="tlink" data-team="${esc(r.opp)}">${esc(r.opp)}</button></small></td>
        <td>${gradeChip(r.grade, r.gate)}</td>
        <td class="gs share" style="--w:${Math.round((r.proj_reb / maxR) * 100)}">${f1(r.proj_reb)}</td>
        <td class="mut">${f1(r.base_reb)}</td>
        <td class="h" style="background:${heat(edgeT(r.boost, 0.07))}">${sgn(r.boost)}</td>
        ${RB_LENS.map((c, i) => `<td class="h${i === 0 ? " gs" : ""}" style="background:${heat(edgeT(r[c.k] || 0, 0.04))}">${sgn(r[c.k] || 0)}</td>`).join("")}
        <td class="gs mut">${f1(r.dreb_pg)}</td><td class="mut">${f1(r.oreb_pg)}</td>
        <td class="mut">${f1(r.min)}</td>
        ${actualCell}
        <td class="why">${esc(r.drivers || "Neutral matchup")}</td></tr>`;
    }).join("");
    let summary = "";
    if (graded) {
      const xs = all.map((r) => ({ r, a: n.results[String(r.player_id)] })).filter((x) => x.a && x.a.reb != null);
      const sum = (arr, f) => arr.reduce((t, x) => t + f(x), 0);
      const good = xs.filter((x) => ["A+", "A"].includes(x.r.grade)), bad = xs.filter((x) => ["D", "F"].includes(x.r.grade));
      const tile = (big, small) => `<div class="tile"><b>${big}</b><small>${small}</small></div>`;
      if (xs.length) summary = `<section class="card"><header><h3>How the night graded</h3></header><div class="tiles">
        ${tile(`${sum(xs, (x) => x.a.reb)} <span style="font-size:18px;color:var(--ink-3)">/ ${f1(sum(xs, (x) => x.r.proj_reb))}</span>`, "Rebounds vs projected, players who played")}
        ${good.length ? tile(sgnPts2(sum(good, (x) => x.a.reb - x.r.base_reb) / good.length), `A and A+ matchups vs their normal (${good.length})`) : ""}
        ${bad.length ? tile(sgnPts2(sum(bad, (x) => x.a.reb - x.r.base_reb) / bad.length), `D and F matchups vs their normal (${bad.length})`) : ""}</div></section>`;
    }
    return `${summary}<section class="card">
      <header><h3>${esc(allG() ? "Every rebounder" : selLabel())}</h3>
        <span class="seg" role="group" aria-label="Which players">

          <button type="button" data-show="best" aria-pressed="${state.show === "best"}">B or better</button>
          <button type="button" data-show="proven" aria-pressed="${state.show === "proven"}" title="Only players with established volume and sample">Proven volume</button>
        </span></header>
      ${injLine(n)}<p class="cap">Ranked by projected rebounds. <b>Misses</b> and <b>Their O-glass</b> move his defensive boards: how often the opponent misses, and how much of the glass it leaves him. <b>Their D-glass</b> moves his offensive boards. Each is shown as a share of his rebounds; with pace they set the <b>Matchup</b> and grade. Click a player for the breakdown.${n.note ? " " + esc(n.note) : ""}</p>
      <div class="scroll"><table><thead>${head}</thead><tbody>${body || `<tr><td class="l" colspan="14" style="padding:14px 16px">No players match this filter.</td></tr>`}</tbody></table></div></section>`;
  }

  function rebResultsHTML() {
    const graded = state.nights.filter((n) => n.status === "graded" && n.results && n.reb_index && Object.keys(n.reb_index).length);
    if (!graded.length) return `<section class="card"><header><h3>Rebounds by matchup grade</h3></header><div class="empty"><p>Results appear here once a night with rebound ratings is graded.</p></div></section>`;
    const by = {}; ["A+", "A", "B", "C", "D", "F", "–"].forEach((g) => (by[g] = []));
    const nightRows = graded.map((n) => {
      let made = 0, proj = 0, cnt = 0;
      Object.entries(n.reb_index).forEach(([pid, v]) => {
        const a = n.results[pid]; if (!a || a.reb == null) return;
        by[v[1]] && by[v[1]].push({ p: v[0], base: v[4], a: a.reb }); made += a.reb; proj += v[0]; cnt++;
      });
      return `<tr><td class="pl"><button type="button" class="sortb" data-open="${esc(n.id)}" style="color:var(--accent)">${esc(fmtDate(n.id))}</button></td><td>${(n.games || []).length}</td><td>${cnt}</td><td class="gs">${f1(proj)}</td><td>${made}</td><td class="mut">${sgn(proj ? made / proj - 1 : NaN)}</td></tr>`;
    }).join("");
    const avg = (arr, f) => (arr.length ? arr.reduce((t, x) => t + f(x), 0) / arr.length : NaN);
    const gradeRows = Object.entries(by).map(([g, arr]) => {
      const diff = avg(arr, (x) => x.a - x.base);
      return `<tr><td class="pl">${gradeChip(g)}</td><td>${arr.length}</td><td class="mut">${f2(avg(arr, (x) => x.base))}</td><td>${f2(avg(arr, (x) => x.p))}</td><td class="gs">${f2(avg(arr, (x) => x.a))}</td>
        <td class="h" style="background:${arr.length ? heat(edgeT(diff, 1)) : "transparent"}">${arr.length ? sgnPts2(diff) : "–"}</td></tr>`;
    }).join("");
    const total = Object.values(by).reduce((t, a) => t + a.length, 0);
    return `<section class="card"><header><h3>Rebounds by matchup grade</h3><span class="eyebrow">${total} player-games · ${graded.length} nights</span></header>
      <p class="cap"><b>Beat normal</b> is actual rebounds minus the player's normal projection. A working model shows it rising from F to A+ over a few hundred player-games.</p>
      <div class="scroll"><table><thead><tr><th class="pl">Grade</th><th>Players</th><th>Normal</th><th>Projected</th><th class="gs">Actual</th><th>Beat normal</th></tr></thead><tbody>${gradeRows}</tbody></table></div></section>
      <section class="card"><header><h3>Night by night</h3></header><div class="scroll"><table><thead><tr><th class="pl">Night</th><th>Games</th><th>Graded</th><th class="gs">Projected</th><th>Actual</th><th>Diff</th></tr></thead><tbody>${nightRows}</tbody></table></div></section>`;
  }

  // ----- PRA: points + rebounds + assists combos (PRA, PR, PA, RA) -----
  // Built from the posted points, rebounds and assists rows: projection, normal and matchup
  // effect are the parts added up; the grade uses the same percentile scale as every stat.
  const PRA_C = ["pra", "pr", "pa", "ra"];
  const PRA_L = { pra: "PRA", pr: "PR", pa: "PA", ra: "RA" };
  const PRA_P = { pra: ["pts", "reb", "ast"], pr: ["pts", "reb"], pa: ["pts", "ast"], ra: ["reb", "ast"] };
  const PRA_N = { pts: "Points", reb: "Rebounds", ast: "Assists" };
  const PRA_S = { pts: "PTS", reb: "REB", ast: "AST" };
  const PRA_SPAN = { pts: 1.0, reb: 0.4, ast: 0.35 };
  const praV = () => (PRA_C.includes(state.xv) ? state.xv : "pra");
  const praSpan = (c) => { const g = state.meta && state.meta.pra && state.meta.pra.grade_cuts && state.meta.pra.grade_cuts[c]; return g ? g[0][0] : { pra: 1.8, pr: 1.5, pa: 1.4, ra: 0.75 }[c]; };
  const praToggle = (attr = "xv", cur = praV()) => `<span class="seg" role="group" aria-label="Combo">${PRA_C.map((c) => `<button type="button" data-${attr}="${c}" aria-pressed="${cur === c}" title="${esc(PRA_P[c].map((s) => PRA_N[s]).join(" + "))}">${PRA_L[c]}</button>`).join("")}</span>`;
  function praMissing() {
    return `<section class="card"><header><h3>PRA</h3></header><div class="empty"><p>PRA ratings start with the next board built after this update. Games that locked before then stay without them.</p></div></section>`;
  }
  const praCombo = (r, c) => ({ ...r, proj: r["proj_" + c], base: r["base_" + c], edge: r["edge_" + c], boost: r["boost_" + c], grade: r["grade_" + c], gate: r["gate_" + c] });
  function praRows(n, c) {
    const all = state.pra[n.id]; if (all == null) return null;
    return all.filter((r) => r["proj_" + c] != null).map((r) => praCombo(r, c));
  }
  // each part rescaled by its own teammate-out ratio, exactly as on its own board
  function praParts(r, c, ctx, outs) {
    const o = {};
    PRA_P[c].forEach((s) => {
      const p = r["proj_" + s] || 0;
      const has = ctx && ctx[INJ_KEYS[s][0]] && Object.keys(ctx[INJ_KEYS[s][0]]).length;
      o[s] = has ? p * injuryRatios(ctx, String(r.player_id), outs, s)[1] / (r["inj_" + s] || 1) : p;
    });
    return o;
  }
  function wiPra(n, rows, c) {
    const teams = wiTeams(n); if (!teams.length) return rows;
    return rows.flatMap((r) => {
      if (!teams.includes(r.team)) return [r];
      const outs = currentOuts(n, r.team);
      if (outs.includes(String(r.player_id))) return [];
      const td = state.teamDocs[r.team];
      if (td === undefined) { ensureTeamDoc(r.team); return [r]; }
      const ctx = td && td.inj; if (!ctx) return [r];
      const parts = praParts(r, c, ctx, outs), proj = PRA_P[c].reduce((t, s) => t + parts[s], 0), d = proj - r.proj;
      if (Math.abs(d) < 0.05) return [r];
      return [{ ...r, proj, _was: r.proj, flags: [r.flags, `What-if ${d >= 0 ? "+" : "−"}${Math.abs(d).toFixed(1)}`].filter(Boolean).join(",") }];
    });
  }
  const praActual = (n, pid, c) => {
    const a = n.results ? n.results[String(pid)] : null;
    if (!a || PRA_P[c].some((s) => a[s] == null)) return null;
    return PRA_P[c].reduce((t, s) => t + a[s], 0);
  };
  // night index entry for one combo: [proj, grade, normal]
  const praIdx = (v, c) => (!v ? null : c === "pra" ? (v[0] == null ? null : [v[0], v[1], v[4]]) : ((v[5] || {})[c] || null));
  const praWhy = (r, c) => PRA_P[c].map((s) => ({ s, e: r["edge_" + s] || 0, d: String(r["drivers_" + s] || "").split(";")[0].trim() }))
    .sort((a, b) => Math.abs(b.e) - Math.abs(a.e)).slice(0, 2).filter((x) => Math.abs(x.e) >= 0.05)
    .map((x) => `${PRA_S[x.s]} ${sgnPts2(x.e)}${x.d ? ": " + x.d : ""}`).join(" · ");

  function praBoardHTML() {
    const n = currentNight();
    if (!n) return emptyBoard();
    if (!n.pra_index || !Object.keys(n.pra_index).length) return praMissing();
    const c = praV(), L = PRA_L[c], parts = PRA_P[c];
    const all = praRows(n, c);
    if (all == null) return `<p class="notice">Loading PRA…</p>`;
    let rows = wiPra(n, all.slice(), c);
    if (!allG()) rows = rows.filter((r) => inSel(r.game));
    if (state.show === "best") rows = rows.filter((r) => ["A+", "A", "B"].includes(r.grade));
    else if (state.show === "proven") rows = rows.filter((r) => !r.gate && r.grade !== "–");
    const k = state.xsort.key, dir = state.xsort.dir === "asc" ? 1 : -1;
    const actual = (r) => praActual(n, r.player_id, c);
    rows.sort((a, b) => {
      if (k === "grade") return dir * ((GRADE_T[a.grade] ?? 0) - (GRADE_T[b.grade] ?? 0)) || b.edge - a.edge;
      if (k === "player") return dir * String(a.player).localeCompare(String(b.player));
      if (k === "actual") return dir * ((actual(a) ?? -1) - (actual(b) ?? -1));
      return dir * ((a[k] ?? -99) - (b[k] ?? -99));
    });
    const graded = n.status === "graded" && n.results;
    const maxX = Math.max(1, ...all.map((r) => r.proj || 0)), span = praSpan(c);
    const th = (key, label, cls = "", title = "") => {
      const sa = state.xsort.key === key ? ` aria-sort="${state.xsort.dir === "asc" ? "ascending" : "descending"}"` : "";
      return `<th class="${cls}"${sa}${title ? ` title="${esc(title)}"` : ""}><button type="button" class="sortb" data-xsort="${key}">${label}</button></th>`;
    };
    const head = `<tr><th class="mut" style="padding-left:16px;text-align:left">#</th>${th("player", "Player", "pl")}${th("grade", "Grade", "", "Matchup grade for " + L)}
      ${th("proj", "Proj " + L, "gs", `Projected ${parts.map((s) => PRA_N[s].toLowerCase()).join(" + ")} tonight`)}${th("base", "Normal", "", "His projection against a league-average opponent at league pace")}${th("edge", "Matchup", "", `Extra ${L} the matchup adds over his normal output (the grade is set on this)`)}${th("boost", "%", "", "The same effect as a share of his normal")}
      ${parts.map((s, i) => th("proj_" + s, PRA_S[s], i === 0 ? "gs" : "", `Projected ${PRA_N[s].toLowerCase()}; the color is how much the matchup moves them`)).join("")}
      ${th("min", "Min", "gs")}${graded ? th("actual", "Actual", "gs", L + " in the game") : ""}<th class="l">Why</th></tr>`;
    const body = rows.map((r, i) => {
      const a = graded ? actual(r) : null;
      const flags = (r.flags || "").split(",").map((x) => x.trim()).filter(Boolean).map((f) => `<span class="flag">${esc(f)}</span>`).join("");
      const actualCell = graded ? (a != null ? `<td class="gs hit" style="background:${heat(edgeT(a - r.proj, 8))};color:var(--cell-ink)">${a}</td>` : `<td class="gs mut">DNP</td>`) : "";
      const partCells = parts.map((s, j) => `<td class="h${j === 0 ? " gs" : ""}" style="background:${heat(edgeT(r["edge_" + s] || 0, PRA_SPAN[s]))}" title="${esc(`${PRA_N[s]}: normal ${f1(r["base_" + s])}, matchup ${sgnPts2(r["edge_" + s])}, grade ${r["grade_" + s] || "–"}`)}">${f1(r["proj_" + s])}</td>`).join("");
      return `<tr>
        <td class="rk">${i + 1}</td>
        <td class="pl"><button type="button" class="link" data-player="${r.player_id}">${esc(r.player)}</button>${flags}<small><button type="button" class="tlink" data-team="${esc(r.team)}">${esc(r.team)}</button> ${r.home ? "vs" : "@"} <button type="button" class="tlink" data-team="${esc(r.opp)}">${esc(r.opp)}</button></small></td>
        <td>${gradeChip(r.grade, r.gate)}</td>
        <td class="gs share" style="--w:${Math.round((r.proj / maxX) * 100)}">${f1(r.proj)}${r._was != null ? `<small style="display:block;color:var(--ink-3);font-size:11px">was ${f1(r._was)}</small>` : ""}</td>
        <td class="mut">${f1(r.base)}</td>
        <td class="h" style="background:${heat(edgeT(r.edge, span))}">${sgnPts2(r.edge)}</td>
        <td class="mut">${sgn(r.boost)}</td>
        ${partCells}
        <td class="gs mut">${f1(r.min)}</td>
        ${actualCell}
        <td class="why">${esc(praWhy(r, c) || "Neutral matchup")}</td></tr>`;
    }).join("");
    let summary = "";
    if (graded) {
      const xs = all.map((r) => ({ r, a: actual(r) })).filter((x) => x.a != null);
      const sum = (arr, f) => arr.reduce((t, x) => t + f(x), 0);
      const good = xs.filter((x) => ["A+", "A"].includes(x.r.grade)), bad = xs.filter((x) => ["D", "F"].includes(x.r.grade));
      const tile = (big, small) => `<div class="tile"><b>${big}</b><small>${small}</small></div>`;
      if (xs.length) summary = `<section class="card"><header><h3>How the night graded: ${L}</h3></header><div class="tiles">
        ${tile(`${sum(xs, (x) => x.a)} <span style="font-size:18px;color:var(--ink-3)">/ ${f1(sum(xs, (x) => x.r.proj))}</span>`, `${L} vs projected, players who played`)}
        ${good.length ? tile(sgnPts2(sum(good, (x) => x.a - x.r.base) / good.length), `A and A+ matchups vs their normal (${good.length})`) : ""}
        ${bad.length ? tile(sgnPts2(sum(bad, (x) => x.a - x.r.base) / bad.length), `D and F matchups vs their normal (${bad.length})`) : ""}</div></section>`;
    }
    return `${summary}<section class="card">
      <header><h3>${esc(allG() ? "Every player" : selLabel())}</h3>
        <span style="display:flex;gap:8px;flex-wrap:wrap">${praToggle()}
        <span class="seg" role="group" aria-label="Which players">
          <button type="button" data-show="all" aria-pressed="${state.show === "all"}">All</button>
          <button type="button" data-show="best" aria-pressed="${state.show === "best"}">B or better</button>
          <button type="button" data-show="proven" aria-pressed="${state.show === "proven"}" title="Only players with established volume and sample">Proven volume</button>
        </span></span></header>
      ${injLine(n)}<p class="cap">Ranked by projected ${L} (${esc(parts.map((s) => PRA_N[s].toLowerCase()).join(" + "))}). Each part comes straight from its own board, so <b>Matchup</b> is the points, rebounds and assists matchups added up, in ${L}; the grade is set on that. The colored ${parts.map((s) => PRA_S[s]).join(" / ")} cells show which part the matchup helps or hurts (hover for detail). Players need every part projected to get a combo. Click a player for the breakdown.${n.note ? " " + esc(n.note) : ""}</p>
      <div class="scroll"><table><thead>${head}</thead><tbody>${body || `<tr><td class="l" colspan="14" style="padding:14px 16px">No players match this filter.</td></tr>`}</tbody></table></div></section>`;
  }

  function praResultsHTML() {
    const c = praV(), L = PRA_L[c];
    const graded = state.nights.filter((n) => n.status === "graded" && n.results && n.pra_index && Object.keys(n.pra_index).length);
    const head = `<header><h3>${L} by matchup grade</h3>${praToggle()}</header>`;
    if (!graded.length) return `<section class="card">${head}<div class="empty"><p>Results appear here once a night with PRA ratings is graded.</p></div></section>`;
    const by = {}; ["A+", "A", "B", "C", "D", "F"].forEach((g) => (by[g] = []));
    const nightRows = graded.map((n) => {
      let made = 0, proj = 0, cnt = 0;
      Object.entries(n.pra_index).forEach(([pid, v]) => {
        const e = praIdx(v, c), a = praActual(n, pid, c); if (!e || a == null) return;
        by[e[1]] && by[e[1]].push({ p: e[0], base: e[2], a }); made += a; proj += e[0]; cnt++;
      });
      return `<tr><td class="pl"><button type="button" class="sortb" data-open="${esc(n.id)}" style="color:var(--accent)">${esc(fmtDate(n.id))}</button></td><td>${(n.games || []).length}</td><td>${cnt}</td><td class="gs">${f1(proj)}</td><td>${made}</td><td class="mut">${sgn(proj ? made / proj - 1 : NaN)}</td></tr>`;
    }).join("");
    const avg = (arr, f) => (arr.length ? arr.reduce((t, x) => t + f(x), 0) / arr.length : NaN);
    const gradeRows = Object.entries(by).map(([g, arr]) => {
      const diff = avg(arr, (x) => x.a - x.base);
      return `<tr><td class="pl">${gradeChip(g)}</td><td>${arr.length}</td><td class="mut">${f1(avg(arr, (x) => x.base))}</td><td>${f1(avg(arr, (x) => x.p))}</td><td class="gs">${f1(avg(arr, (x) => x.a))}</td>
        <td class="h" style="background:${arr.length ? heat(edgeT(diff, 2.5)) : "transparent"}">${arr.length ? sgnPts2(diff) : "–"}</td></tr>`;
    }).join("");
    const total = Object.values(by).reduce((t, a) => t + a.length, 0);
    return `<section class="card">${head}<p class="cap"><span class="eyebrow">${total} player-games · ${graded.length} night${graded.length === 1 ? "" : "s"}</span> <b>Beat normal</b> is actual ${L} minus the player's normal projection. A working model shows it rising from F to A+ over a few hundred player-games.</p>
      <div class="scroll"><table><thead><tr><th class="pl">Grade</th><th>Players</th><th>Normal</th><th>Projected</th><th class="gs">Actual</th><th>Beat normal</th></tr></thead><tbody>${gradeRows}</tbody></table></div></section>
      <section class="card"><header><h3>Night by night</h3></header><div class="scroll"><table><thead><tr><th class="pl">Night</th><th>Games</th><th>Graded</th><th class="gs">Projected</th><th>Actual</th><th>Diff</th></tr></thead><tbody>${nightRows}</tbody></table></div></section>`;
  }

  function praDefenseHTML() {
    const d = state.defense, c = praV(), L = PRA_L[c], parts = PRA_P[c];
    const src = { pts: d && d.pts_teams, reb: d && d.reb_teams, ast: d && d.ast_teams };
    if (!d || parts.some((s) => !src[s])) return `<section class="card"><header><h3>Defenses: ${L}</h3>${praToggle()}</header><div class="empty"><p>Defense data for every part isn't loaded yet.</p></div></section>`;
    const sh = (state.meta && state.meta.pra && state.meta.pra.shares && state.meta.pra.shares[c]) || null;
    const w = {}; parts.forEach((s) => (w[s] = sh && sh[s] != null ? sh[s] : 1 / parts.length));
    const by = {}; parts.forEach((s) => src[s].forEach((t) => { (by[t.team] = by[t.team] || { team: t.team, team_name: t.team_name, pace: t.pace })["b_" + s] = t.boost; }));
    const teams = Object.values(by).filter((t) => parts.every((s) => t["b_" + s] != null));
    teams.forEach((t) => (t.boost = parts.reduce((x, s) => x + w[s] * t["b_" + s], 0)));
    const rk = {}; ["boost", ...parts.map((s) => "b_" + s)].forEach((k) => { teams.slice().sort((a, b) => b[k] - a[k]).forEach((t, i) => ((rk[k] = rk[k] || {})[t.team] = i + 1)); });
    const k = state.xdsort.key, dir = state.xdsort.dir === "asc" ? 1 : -1;
    teams.sort((a, b) => (k === "team_name" ? dir * String(a.team_name).localeCompare(String(b.team_name)) : dir * ((a[k] ?? 0) - (b[k] ?? 0))));
    const th = (key, label, cls = "", title = "") => `<th class="${cls}"${state.xdsort.key === key ? ` aria-sort="${state.xdsort.dir === "asc" ? "ascending" : "descending"}"` : ""}${title ? ` title="${esc(title)}"` : ""}><button type="button" class="sortb" data-xdsort="${key}">${label}</button></th>`;
    const body = teams.map((t) => `<tr><td class="rk">${rk.boost[t.team]}</td>
      <td class="pl"><button type="button" class="link" data-team="${esc(t.team)}">${esc(t.team_name)}</button><small>${esc(t.team)}</small></td>
      <td class="h gs" style="background:${heat(boostT(t.boost))}">${sgn(t.boost)}</td>
      ${parts.map((s) => `<td class="h" style="background:${heat(boostT(t["b_" + s]))}">${sgn(t["b_" + s])}</td>${rankCell(rk["b_" + s][t.team], `${ord(rk["b_" + s][t.team])} most generous to ${PRA_N[s].toLowerCase()}`)}`).join("")}
      <td class="mut gs">${f1(t.pace)}</td></tr>`).join("");
    return `<section class="card"><header><h3>Defenses: ${L}</h3>${praToggle()}</header>
      <p class="cap">How each opponent moves a typical player's ${L}: its points, rebounds and assists matchups (each from its own Defenses tab), weighted by how much of a typical player's ${L} each part makes up (${parts.map((s) => `${PRA_N[s].toLowerCase()} ${pct(w[s], 0)}`).join(", ")}). Ranks: <b>1st is the most generous</b>. Player grades on the board are set on each player's own mix, so a rebounding-heavy center and a scoring guard can grade differently against the same team.</p>
      <div class="scroll"><table><thead><tr><th class="mut" style="padding-left:16px;text-align:left">#</th>${th("team_name", "Defense", "pl")}${th("boost", "Matchup", "gs", `Weighted ${L} matchup`)}
      ${parts.map((s) => `${th("b_" + s, PRA_N[s], "", PRA_N[s] + " matchup")}<th>Rank</th>`).join("")}${th("pace", "Pace", "gs")}</tr></thead><tbody>${body}</tbody></table></div></section>`;
  }

  function praTopHTML(n, keep) {

    let rows = wiPra(n, (all || []).slice(), c).filter((r) => !r.gate && keep.includes(r.grade));
    if (!allG()) rows = rows.filter((r) => inSel(r.game));

  function renderPanelPra(P) {

    const ctx = td && td.inj ? td.inj : null;

    const changed = P.out.slice().sort().join() !== P.locked.slice().sort().join();
    const now = ctx && (changed || P.out.length) ? praParts(r, c, ctx, P.out) : Object.fromEntries(parts.map((s) => [s, r["proj_" + s]]));
    const FIN = parts.reduce((t, s) => t + now[s], 0), adj = Math.abs(FIN - r.proj) >= 0.05;

    const partRows = parts.map((s) => `<tr><td class="l"><button type="button" class="link" data-player="${esc(P.pid)}" data-pstat="${s}" data-pkeep="1" title="Open his ${PRA_N[s].toLowerCase()} card">${PRA_N[s]}</button></td>

    const totRow = `<tr class="tot"><td class="l"><b>${L}</b></td><td class="mut">${f1(r.base)}</td><td class="h" style="background:${heat(edgeT(r.edge, praSpan(c)))}"><b>${sgnPts2(r.edge)}</b></td><td>${gradeChip(r.grade, r.gate)}</td><td><b>${f1(FIN)}</b></td></tr>`;

    else {
      const pre = {}; parts.forEach((s) => (pre[s] = (r["proj_" + s] || 0) / (r["inj_" + s] || 1)));
      mates = `<div class="mates">${ctx.rotation.filter((id) => id !== P.pid).map((id) => {
        let eff = 0, games = 0;
        parts.forEach((s) => { if (!(ctx[INJ_KEYS[s][0]] && Object.keys(ctx[INJ_KEYS[s][0]]).length)) return; const one = injuryRatios(ctx, P.pid, [id], s); eff += pre[s] * (one[1] - 1); if (one[2][0]) games = Math.max(games, one[2][0][2]); });
        const on = P.out.includes(id), lk = P.locked.includes(id);
        return `<label class="mate${lk ? " locked" : ""}"><input type="checkbox" data-mate="${esc(id)}"${on ? " checked" : ""}>
          <span>${esc(nm(id))}<small>${f1(ctx.min[id])} min${games ? ` · ${games} games without him` : ""}</small></span>
          <em class="${eff > 0.05 ? "up" : "flat"}">${eff > 0.05 ? "+" + eff.toFixed(1) + " " + L : "—"}</em></label>`;
      }).join("")}</div>
      <div class="prow"><span>${changed ? `What-if: ${f1(FIN)} vs ${f1(r.proj)} on the board. The board itself doesn't change.` : `Check teammates to see how his ${L} moves if they sit.`}</span>

      const vals = g.map(val).filter((v) => v != null);
      vs = !g.length ? `<p class="pempty">No games against ${esc(r.opp)} on record (2025-26 onward, 10+ minutes).</p>`
        : `<p class="cmpsum"><b>${vals.length ? (vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(1) : "–"}</b> ${L} a game in ${g.length} game${g.length === 1 ? "" : "s"} against ${esc(r.opp)} (normal tonight: ${f1(r.base)}).</p>
        <div class="scroll ptab"><table><thead><tr><th>Date</th><th class="l">For</th><th>Min</th><th>PTS</th><th>REB</th><th>AST</th><th>${L}</th></tr></thead><tbody>${g.map((x) => `<tr><td data-v="${dV(x[0])}">${esc(dShort(x[0]))}</td><td class="l">${esc(x[1])}</td><td>${x[2]}</td><td>${x[5]}</td><td>${x[8] ?? "–"}</td><td>${x[6]}</td><td class="hl"><b>${val(x) ?? "–"}</b></td></tr>`).join("")}</tbody></table></div>`;

      const a = praActual(x, P.pid, c);

        <button type="button" class="xbtn" data-close aria-label="Close">×</button></div>

        <section class="psec"><h3>How tonight's number is built</h3>
          <p class="cap">Each part comes from its own board; ${L} adds them up. The grade is set on the combined matchup, so two small edges can add up to a strong ${L} grade. Click a part for its full card.</p>
          <div class="scroll ptab"><table><thead><tr><th class="l">Part</th><th>Normal</th><th>Matchup</th><th>Grade</th><th>${adj ? "What-if" : "Projected"}</th></tr></thead><tbody>${partRows}${totRow}</tbody></table></div>
          ${why ? `<ul class="cap" style="margin:8px 0 0;padding-left:18px">${why}</ul>` : ""}</section>
        <section class="psec"><h3>His games vs ${esc(r.opp)}</h3>${vs}</section>
        <section class="psec"><h3>If teammates sit</h3><p class="cap">Each part moves by its own calibrated redistribution, the same as on the points, rebounds and assists boards.</p>${mates}</section>
        <section class="psec"><h3>On this board (${L})</h3>${hist ? `<div class="scroll ptab"><table><thead><tr><th>Night</th><th class="l">Opp</th><th>Grade</th><th>Proj</th><th>Actual</th></tr></thead><tbody>${hist}</tbody></table></div>` : `<p class="pempty">First appearance.</p>`}</section>
      </div>`;
  }

  function howPraHTML(m) {
    const x = m.pra || {}, cuts = x.grade_cuts || {}, vol = x.vol || {};
    const cutRow = (c) => { const g = cuts[c] || []; return `<tr><td class="l"><b>${PRA_L[c]}</b></td>${["A+", "A", "B", "C", "D"].map((k) => { const e = g.find((y) => y[1] === k); return `<td>${e ? sgnPts2(e[0]) : "–"}</td>`; }).join("")}<td class="mut">${vol[c] != null ? vol[c] : "–"}</td></tr>`; };
    return `<section class="card"><header><h3>How PRA works</h3>${m.model_version ? `<span class="eyebrow">Model v${esc(m.model_version)}</span>` : ""}</header>
      <div class="prose">
        <p class="formula">Projected PRA = projected points + projected rebounds + projected assists</p>
        <p>PRA, PR (points + rebounds), PA (points + assists) and RA (rebounds + assists) are built straight from the points, rebounds and assists boards. Nothing is re-projected: each part keeps its own minutes, injuries, pace and matchup, so a combo always matches its parts. A player needs every part projected to get a combo (a center with under one assist a game gets PR but not PRA or RA).</p>
        <h4>Grades</h4>
        <p>Same scale as every other stat: the grade measures the matchup's effect in the combo's own units, which is the points, rebounds and assists effects added up. Cutoffs come from every proven player against every defense last season (2025-26 profiles, current rosters): A+ is the best 5%, A the next 7%, B the next 18%, C the middle 40%, D the next 18%, F the bottom 12%. Built the same way, those percentiles reproduce the points, rebounds and assists cutoffs within about 2%.</p>
        <div class="scroll"><table><thead><tr><th class="l">Combo</th><th>A+</th><th>A</th><th>B</th><th>C</th><th>D</th><th>Proven volume</th></tr></thead><tbody>${PRA_C.map(cutRow).join("")}</tbody></table></div>
        <p>Each cutoff is the minimum matchup effect for that grade; below the D cutoff is F. <b>Proven</b> means no sample or minutes flag on any part, and combined normal output of at least the parts' thresholds added up (points 11, rebounds 4.2, assists 2.5).</p>
        <h4>Locking and grading</h4>
        <p>Combos lock with their game at tip-off, like everything else, and grade against the box score's points, rebounds and assists. Games that locked before PRA was added stay without it.</p>
        <h4>Defenses tab</h4>
        <p>Team rankings weight each team's points, rebounds and assists matchups by how much of a typical player's combo each part makes up (league totals). It's a guide to which teams give up the most; the board's grades use each player's own mix.</p>
      </div></section>`;
  }

      ${rankCell(rk.oreb[t.team], `Grabs ${pct(t.oreb_pct)} of its own misses`)}

      <td class="mut" title="Misses its defense forces per 100 (no predictive value in testing)">${ord(rk.forced[t.team])}</td>
      <td class="mut gs">${f1(t.pace)}</td><td class="mut">${f1(t.miss100)}</td><td class="mut">${pct(t.oreb_pct, 1)}</td><td class="mut">${pct(t.dreb_pct, 1)}</td></tr>`).join("");
    return `<section class="card"><header><h3>Rebounding matchups, all 30 teams</h3><span class="eyebrow">${esc(d.basis || "")}</span></header>
      <p class="cap">Matchup is how each opponent moves a typical rebounder's boards. Ranks: <b>1st is the most generous</b>, green helps rebounders. <b>Misses</b>: shots the team misses per 100 possessions (more misses, more defensive boards for you). <b>Their O-glass</b>: how hard it crashes its own misses (1st = crashes least). <b>Their D-glass</b>: how well it secures yours (1st = weakest). Forced misses is greyed out: it didn't predict rebounds in testing.</p>
      <div class="scroll"><table><thead><tr><th class="mut" style="padding-left:16px;text-align:left">#</th>${th("team_name", "Team", "pl")}<th>Grade</th>${th("boost", "Matchup", "gs")}<th class="gs">Misses</th><th>Their O-glass</th><th>Their D-glass</th><th>Forced misses</th>${th("pace", "Pace", "gs")}${th("miss100", "Miss/100")}${th("oreb_pct", "OREB%")}${th("dreb_pct", "DREB%")}</tr></thead><tbody>${body}</tbody></table></div></section>`;
  }

  const MA_Z = ["rim", "paint", "mid", "corner3", "atb3"];

  // ----- several defense stats at once -----
  const ZSHORT = { rim: "Rim", paint: "Paint", mid: "Mid", corner3: "Corner 3", atb3: "Above-break 3", ft: "FT" };
  function comboSpec(key) {
    const [kind, sub] = key.split(":");
    const zEdge = (r, z, baseKey) => { if (!r || !r.z) return null; const x = r.z.find((q) => q[0] === z); return x ? x[2] * r[baseKey] * r.f_pace : null; };
    const ptEdge = (r, k) => { if (!r || !r.pt) return null; const x = r.pt.find((q) => q[0] === k); return x ? x[2] * r.base_pts * r.f_pace : null; };
    const a1 = (r) => r.base_pa * r.talent_pct * r.f_pace;
    switch (kind) {
      case "opp3a": return { label: "3PA/g", fam: "3pa", m: (p) => p.fg3a_pg, eu: "3pm", e: (p, r3) => r3 ? a1(r3) * (r3.f_vol - 1) : null };

      case "z": return { label: `${ZSHORT[sub]} pts/g`, fam: "zone", famLabel: "Selected zones pts/g", m: (p) => p.pts && p.pts.zone_pts_pg ? p.pts.zone_pts_pg[sub] ?? 0 : null, eu: "pts", e: (p, r3, rp) => zEdge(rp, sub, "base_pts") };
      case "pt": return { label: `${PTL[sub]} pts/g`, fam: "pt", famLabel: "Selected play types pts/g", m: (p) => p.pts && p.pts.pt_pts_pg ? p.pts.pt_pts_pg[sub] ?? 0 : null, eu: "pts", e: (p, r3, rp) => ptEdge(rp, sub) };
      case "az": return { label: `${ZSHORT[sub]} ast/g`, fam: "az", famLabel: "Selected zones ast/g", m: (p) => p.ast && p.ast.zone_pg ? p.ast.zone_pg[sub] : null, eu: "ast", e: (p, r3, rp, ra) => zEdge(ra, sub, "base_ast") };

  function oppContext(team) {

    const td = state.teamDocs[opp];
    if (td === undefined) return { msg: `Loading ${opp}…` };
    const pl = (td && td.players) || {};
    const by = (arr) => { const o = {}; (arr || []).filter((r) => r.team === opp).forEach((r) => (o[String(r.player_id)] = r)); return o; };
    const R3 = by(n.rows), RP = by(state.pts[n.id]), RA = by(state.ast[n.id]), RR = by(state.reb[n.id]);

  function comboHTML(team, keys) {
    const wrap = (inner) => `<div class="psub" style="border-top:1px solid var(--line);padding-top:8px">${inner}</div>`;
    const c = oppContext(team);
    if (c.msg) return wrap(`<p class="pempty">${esc(c.msg)}</p>`);
    // the same stat can sit on two rows (FG% and attempts for one zone): use each key once
    const specs = [...new Set(keys)].map((k) => ({ k, ...comboSpec(k) }));
    const fams = {}; specs.forEach((sp) => { (fams[sp.fam] = fams[sp.fam] || []).push(sp); });
    const famTotals = Object.entries(fams).filter(([, a]) => a.length > 1 && a[0].famLabel).map(([f, a]) => ({ f, label: a[0].famLabel, specs: a }));
    const units = ["pts", "3pm", "ast", "reb"].filter((u) => specs.some((sp) => sp.eu === u));
    const UL = { pts: "Pts edge", "3pm": "3PM edge", ast: "Ast edge", reb: "Reb edge" }, SPAN = { pts: 0.8, "3pm": 0.15, ast: 0.3, reb: 0.4 };
    const list = c.ids.map((id) => {

      const tots = famTotals.map((ft) => { const v = ft.specs.map((sp) => sp.m(...args)); return v.every((x) => x == null) ? null : v.reduce((t, x) => t + (x || 0), 0); });
      const edges = units.map((u) => { const es = specs.filter((sp) => sp.eu === u).map((sp) => sp.e(...args)).filter((e) => e != null); return es.length ? es.reduce((a, b) => a + b, 0) : null; });

      + x.vals.map((v, j) => `<td>${fmtV(v, specs[j])}</td>`).join("")
      + x.edges.map((e, j) => edgeTd(e, units[j])).join("") + `</tr>`).join("");

      + famTotals.map((ft) => `<th title="Sum of the selected ${esc(ft.label.split(" ")[1])}">${esc(ft.label)}</th>`).join("")
      + specs.map((sp) => `<th>${esc(sp.label)}</th>`).join("")

    if (units.length) notes.push(`edges add up tonight's effect of each selected stat against ${esc(team)}`);
    if (Object.keys(fams).length > 1 && specs.some((sp) => sp.fam === "zone") && specs.some((sp) => sp.fam === "pt")) notes.push("zones and play types overlap (a rim finish can also be a cut), so they're never added together");
    return wrap(`<div class="prow" style="padding:0 0 6px"><span><b>Comparing ${specs.length}: ${esc(c.opp)} players tonight.</b> ${esc(names)}</span><button type="button" class="btn" data-dclear>Clear</button></div>
      <p class="cap">${notes.length ? notes.join("; ").replace(/^./, (m) => m.toUpperCase()) + "." : ""} Click a stat again to drop it.</p>
      <div class="scroll ptab"><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`);
