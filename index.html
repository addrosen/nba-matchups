  // ----- defense stat -> tonight's opponents who lean on it most -----
  function exploitHTML(team, key) {
    const n = currentNight();
    const g = n ? (n.games || []).find((x) => x.away === team || x.home === team) : null;
    const wrap = (inner) => `<div class="psub" style="border-top:1px solid var(--line);padding-top:8px">${inner}</div>`;
    if (!g) return wrap(`<p class="pempty">${esc(team)} isn't on the selected night's slate, so there's no opponent to show.</p>`);
    const opp = g.home === team ? g.away : g.home;
    ensureTeamDoc(opp);
    const td = state.teamDocs[opp];
    if (td === undefined) return wrap(`<p class="pempty">Loading ${esc(opp)}…</p>`);
    const pl = (td && td.players) || {};
    const by = (arr) => { const o = {}; (arr || []).filter((r) => r.team === opp).forEach((r) => (o[String(r.player_id)] = r)); return o; };
    const R3 = by(n.rows), RP = by(state.pts[n.id]), RA = by(state.ast[n.id]), RRB = by(state.reb[n.id]);
    let ids = [...new Set([...Object.keys(R3), ...Object.keys(RP), ...Object.keys(RA), ...Object.keys(RRB)])];
    if (!ids.length) ids = Object.keys(pl).filter((id) => pl[id].min >= 12);
    const [kind, sub] = key.split(":");
    const zEdge = (r, z, baseKey) => { if (!r || !r.z) return null; const x = r.z.find((q) => q[0] === z); return x ? x[2] * r[baseKey] * r.f_pace : null; };
    const ptEdge = (r, k) => { if (!r || !r.pt) return null; const x = r.pt.find((q) => q[0] === k); return x ? x[2] * r.base_pts * r.f_pace : null; };
    const e3 = (r, part) => { if (!r) return null; const a1 = r.base_pa * r.talent_pct * r.f_pace;
      return part === "vol" ? a1 * (r.f_vol - 1) : r.base_pa * r.f_pace * r.f_vol * r.d_open; };
    const edgeTd = (e, span, dg = 2) => e == null ? `<td class="mut">–</td>` : `<td class="h" style="background:${heat(edgeT(e, span))}">${Math.abs(e) < 0.005 ? "0.00" : (e > 0 ? "+" : "−") + Math.abs(e).toFixed(dg)}</td>`;
    let title, cap, head, mk;
    if (kind === "opp3a") {
      title = "Three-point volume"; cap = `Ranked by threes per game. Edge: extra made threes tonight from how many threes ${esc(team)} allows.`;
      head = ["3PA/g", "Proj 3PA", "Edge (3PM)"];
      mk = (p, r3) => p.fg3a_pg == null ? null : { v: p.fg3a_pg, cells: `<td><b>${f1(p.fg3a_pg)}</b></td><td>${r3 ? f1(r3.proj_3pa) : "–"}</td>${edgeTd(e3(r3, "vol"), 0.15)}` };
    } else if (kind === "wide") {
      title = "Wide-open threes"; cap = `Ranked by wide-open threes per game (no defender within 6 feet). Edge: extra made threes tonight from how open ${esc(team)} leaves shooters.`;
      head = ["Wide-open share", "Wide-open 3PA/g", "Edge (3PM)"];
      mk = (p, r3) => !p.mix || p.fg3a_pg == null ? null : { v: p.fg3a_pg * p.mix.wide_open, cells: `<td>${pct(p.mix.wide_open, 0)}</td><td><b>${f1(p.fg3a_pg * p.mix.wide_open)}</b></td>${edgeTd(e3(r3, "open"), 0.1)}` };
    } else if (kind === "corner") {
      title = "Corner threes"; cap = "Ranked by corner threes per game.";
      head = ["Corner share", "Corner 3PA/g", "3PA/g"];
      mk = (p) => p.fg3a_pg == null ? null : { v: p.fg3a_pg * (p.corner_share || 0), cells: `<td>${pct(p.corner_share, 0)}</td><td><b>${f1(p.fg3a_pg * (p.corner_share || 0))}</b></td><td class="mut">${f1(p.fg3a_pg)}</td>` };
    } else if (kind === "area") {
      title = `${SAL[sub]} threes`; cap = `Ranked by threes per game from the ${SAL[sub].toLowerCase()} (last season's shot locations).`;
      head = ["Share of his 3s", "3PA/g there", "3P% there"];
      mk = (p) => { const s3 = p.shots3; if (!s3 || !s3.games || s3.games < 10) return null; const tot = SA.reduce((t, a) => t + s3.areas[a][0], 0); if (!tot) return null;
        const [att, made] = s3.areas[sub]; return { v: att / s3.games, cells: `<td>${pct(att / tot, 0)}</td><td><b>${f1(att / s3.games)}</b></td><td>${att ? `${pct(made / att, 0)} <span class="dim">(${att})</span>` : "–"}</td>` }; };
    } else if (kind === "z") {
      title = ZL[sub]; cap = `Ranked by points per game from ${sub === "ft" ? "free throws" : "this zone"}. Edge: points tonight from this zone against ${esc(team)}.`;
      head = ["Share of his pts", "Pts/g there", sub === "ft" ? "FT%" : "FG% there", "Edge (pts)"];
      mk = (p, r3, rp) => { const q = p.pts; if (!q || !q.zone_pts_pg) return null; const zz = q.zones && q.zones[sub];
        const eff = sub === "ft" ? pct(q.ft_pct, 0) : zz ? pct(zz.raw ?? zz.pct, 0) : "–";
        return { v: q.zone_pts_pg[sub] ?? 0, cells: `<td>${pct(q.zone_share[sub], 0)}</td><td><b>${f1(q.zone_pts_pg[sub])}</b></td><td>${eff}</td>${edgeTd(zEdge(rp, sub, "base_pts"), 0.6)}` }; };
    } else if (kind === "pt") {
      title = PTL[sub]; cap = `Ranked by points per game on ${esc(PTL[sub].toLowerCase())} plays. Edge: points tonight from how ${esc(team)} defends it.`;
      head = ["Share of his pts", "Pts/g", "His PPP", "Edge (pts)"];
      mk = (p, r3, rp) => { const q = p.pts; if (!q || !q.pt_pts_pg) return null; const t = q.playtypes && q.playtypes[sub];
        return { v: q.pt_pts_pg[sub] ?? 0, cells: `<td>${pct(q.pt_share[sub], 0)}</td><td><b>${f1(q.pt_pts_pg[sub])}</b></td><td>${t && t.ppp != null ? `${t.ppp.toFixed(2)} <span class="dim">(${t.poss})</span>` : "–"}</td>${edgeTd(ptEdge(rp, sub), 0.6)}` }; };
    } else if (kind === "rb") {
      const RBT = { miss: ["Defensive rebounding vs its misses", "Ranked by defensive rebounds per game. Edge: rebounds tonight from how often " + esc(team) + " misses.", "e_miss", "DREB/g", (p) => p.reb && p.reb.dreb_pg],
        oreb: ["Defensive rebounding vs its crashing", "Ranked by defensive rebounds per game. Edge: rebounds tonight from how hard " + esc(team) + " crashes its own misses.", "e_dcomp", "DREB/g", (p) => p.reb && p.reb.dreb_pg],
        dreb: ["Offensive rebounding", "Ranked by offensive rebounds per game. Edge: rebounds tonight from how well " + esc(team) + " secures its defensive glass.", "e_ocomp", "OREB/g", (p) => p.reb && p.reb.oreb_pg] }[sub];
      title = RBT[0]; cap = RBT[1];
      head = [RBT[3], "REB/g", "Edge (reb)"];
      const RR = {}; ((n && state.reb[n.id]) || []).filter((x) => x.team === opp).forEach((x) => (RR[String(x.player_id)] = x));
      mk = (p, r3, rp, ra, id) => { const v = RBT[4](p); if (v == null) return null; const rr = RR[id];
        return { v, cells: `<td><b>${f1(v)}</b></td><td class="mut">${f1(p.reb.reb_pg)}</td>${edgeTd(rr ? (rr[RBT[2]] || 0) * rr.base_reb * rr.f_pace : null, 0.4)}` }; };
    } else if (kind === "pot") {
      title = "Potential assists"; cap = "Ranked by potential assists per game (passes that lead to a shot). Shown as context: in testing, these didn't predict tonight's assists beyond the zone matchup.";
      head = ["Potential ast/g", "Conversion", "AST/g"];
      mk = (p) => { const a = p.ast; if (!a || a.pot_pg == null) return null; return { v: a.pot_pg, cells: `<td><b>${f1(a.pot_pg)}</b></td><td>${pct(a.conv, 0)}</td><td class="mut">${f1(a.ast_pg)}</td>` }; };
    } else if (kind === "az") {
      title = `Assists to the ${AZL[sub].toLowerCase()}`; cap = `Ranked by assists per game to this zone. Edge: assists tonight from what ${esc(team)} allows there.`;
      head = ["Share of his ast", "Per game", "AST/g", "Edge (ast)"];
      mk = (p, r3, rp, ra) => { const a = p.ast; if (!a || !a.zone_pg || a.zone_pg[sub] == null) return null;
        return { v: a.zone_pg[sub], cells: `<td>${pct(a.zones_raw[sub], 0)}</td><td><b>${f2(a.zone_pg[sub])}</b></td><td class="mut">${f1(a.ast_pg)}</td>${edgeTd(zEdge(ra, sub, "base_ast"), 0.25)}` }; };
    } else {
      // pace / defensive rating: everyone benefits; rank by tonight's projected points
      title = kind === "pace" ? "Pace" : "Overall defense"; cap = kind === "pace" ? `Pace lifts everyone, so players are ranked by projected points. Pace effect: points added tonight by ${esc(team)}'s pace.` : `Ranked by projected points, with each player's overall points matchup against ${esc(team)}.`;
      head = kind === "pace" ? ["Proj pts", "Pace effect"] : ["Proj pts", "Matchup"];
      mk = (p, r3, rp) => !rp ? null : { v: rp.proj_pts, cells: `<td><b>${f1(rp.proj_pts)}</b></td>${kind === "pace" ? edgeTd(rp.base_pts * (rp.f_pace - 1), 0.6) : `<td>${gradeChip(rp.grade, rp.gate)} <span class="dim">${sgn(rp.boost)}</span></td>`}` };
    }
    const list = ids.map((id) => { const p = pl[id]; if (!p) return null; const x = mk(p, R3[id], RP[id], RA[id], id); return x ? { id, name: p.name, ...x } : null; })
      .filter(Boolean).sort((a, b) => b.v - a.v);
    if (!list.length) return wrap(`<p class="pempty">No ${esc(opp)} data for this one yet.</p>`);
    const rows = list.map((x, i) => `<tr><td class="rk">${i + 1}</td><td class="pl"><button type="button" class="link" data-player="${esc(x.id)}">${esc(x.name)}</button></td>${x.cells}</tr>`).join("");
    return wrap(`<p class="cap"><b>${esc(title)}: ${esc(opp)} players tonight.</b> ${cap}</p>
      <div class="scroll ptab"><table><thead><tr><th class="mut" style="text-align:left">#</th><th class="pl">Player</th>${head.map((h) => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`);
  }

  // ----- Injuries tab -----
  function allTeams() {
    const d = state.defense || {};
    return (d.teams || []).map((t) => ({ team: t.team, name: t.team_name })).sort((a, b) => a.name.localeCompare(b.name));
  }
  // ----- Teams tab: who takes the shots, makes the passes, gets the touches, game by game -----
  // Data: data/usage/<TEAM>.js (nba_usage.py). Everything below is computed here from the
  // per-game rows, so any combination of "sat" / "played" teammates works.
  const TM_STATS = [
    ["fga", "FGA", "Shots", 1, "Field goal attempts"], ["fg3a", "3PA", "3PA", 1, "Three-point attempts"],
    ["fta", "FTA", "FTA", 1, "Free throw attempts"], ["usg", "USG%", "Usage %", 1, "Share of team plays while on the floor that end in his shot, free-throw trip or turnover"],
    ["passes", "Passes", "Passes", 1, "Passes made"], ["pot_ast", "Pot. AST", "Potential AST", 1, "Passes to a teammate who shoots right away (made or missed)"],
    ["ast", "AST", "Assists", 1, "Assists"], ["touches", "Touches", "Touches", 1, "Times he had the ball"],
    ["top", "Poss. min", "Time of poss.", 1, "Minutes with the ball in his hands"],
    ["pts", "PTS", "Points", 1, "Points"], ["min", "MIN", "Minutes", 1, "Minutes"],
  ];
  const TM_NOSHARE = new Set(["usg", "min"]);
  const TM_REG_MIN = 20, TM_MATE_MIN = 12;   // "regular" and "teammate worth listing", minutes per game
  const tmStat = (k) => TM_STATS.find((s) => s[0] === k) || TM_STATS[0];
  function ensureUsageDoc(team) {
    state.usageDocs = state.usageDocs || {};
    if (team in state.usageDocs || !state.db) return;
    state.usageDocs[team] = undefined;
    state.db.doc("usage/" + team).get().then((s) => { state.usageDocs[team] = s.exists ? s.data() : null; },
      () => { state.usageDocs[team] = null; }).then(() => { if (state.tab === "teams") render(); });
  }
  function tmInit() {
    if (state.tm) return state.tm;
    let team = null;
    try { team = localStorage.getItem("tm-team"); } catch (e) {}
    if (!team) { const n = currentNight(), g = n && n.games && n.games[0]; team = g ? g.away : (allTeams()[0] || {}).team; }
    return (state.tm = { team, stat: "fga", f: {}, all: false });
  }
  function tmUtil(d) {
    const ix = {}; d.fields.forEach((f, i) => (ix[f] = i));
    const val = (g, pid, k) => { const r = g.p[pid]; return r ? r[ix[k]] : undefined; };
    const teamSum = (g, k) => { let s = 0, any = false; for (const pid in g.p) { const v = g.p[pid][ix[k]]; if (v != null) { s += v; any = true; } } return any ? s : null; };
    // per-game average over the games he played (usage % is minutes-weighted), and share of team
    function avg(games, pid, k) {
      let s = 0, n = 0, w = 0, mine = 0, team = 0, gp = 0;
      for (const g of games) {
        const v = val(g, pid, k);
        if (v === undefined) continue;
        gp++;
        if (v == null) continue;
        if (k === "usg") { const m = val(g, pid, "min"); s += v * m; w += m; } else { s += v; n++; }
        if (!TM_NOSHARE.has(k)) { const t = teamSum(g, k); if (t) { mine += v; team += t; } }
      }
      const a = k === "usg" ? (w ? s / w : null) : (n ? s / n : null);
      return { v: a, gp, share: team ? mine / team : null };
    }
    return { val, avg, teamSum };
  }
  function tmMatches(d, f) {
    const want = Object.entries(f);
    return d.games.filter((g) => want.every(([pid, st]) => (st === "out" ? g.sat.includes(pid) : !!g.p[pid])));
  }
  const tmFmt = (v, k) => (v == null ? "–" : k === "usg" ? v.toFixed(1) : v.toFixed(1));
  const tmShort = (nm) => { const p = (nm || "").split(" "); return p.length > 1 ? p.slice(1).join(" ") : nm; };
  const tmDate = (s) => { const [, m, dd] = s.split("-"); return `${+m}/${+dd}`; };

  // Header band colors per team: [band (white text sits on it), stripe]
  const TM_COLORS = {
    ATL: ["#C8102E", "#FDB927"], BKN: ["#000000", "#777D84"], BOS: ["#007A33", "#BA9653"], CHA: ["#1D1160", "#00788C"],
    CHI: ["#CE1141", "#000000"], CLE: ["#860038", "#FDBB30"], DAL: ["#00538C", "#B8C4CA"], DEN: ["#0E2240", "#FEC524"],
    DET: ["#C8102E", "#1D42BA"], GSW: ["#1D428A", "#FFC72C"], HOU: ["#CE1141", "#C4CED4"], IND: ["#002D62", "#FDBB30"],
    LAC: ["#1D428A", "#C8102E"], LAL: ["#552583", "#FDB927"], MEM: ["#12173F", "#5D76A9"], MIA: ["#98002E", "#F9A01B"],
    MIL: ["#00471B", "#EEE1C6"], MIN: ["#0C2340", "#78BE20"], NOP: ["#0C2340", "#C8102E"], NYK: ["#006BB6", "#F58426"],
    OKC: ["#007AC1", "#EF3B24"], ORL: ["#0077C0", "#C4CED4"], PHI: ["#006BB6", "#ED174C"], PHX: ["#1D1160", "#E56020"],
    POR: ["#000000", "#E03A3E"], SAC: ["#5A2D81", "#63727A"], SAS: ["#000000", "#C4CED4"], TOR: ["#CE1141", "#000000"],
    UTA: ["#3E2680", "#79A3DC"], WAS: ["#002B5C", "#E31837"],
  };
  const TM_SHARE_OF = { fga: "shots", fg3a: "three-point attempts", fta: "free throw attempts",
    usg: "plays (shots, free-throw trips and turnovers)", passes: "passes", pot_ast: "potential assists", ast: "assists",
    touches: "touches", top: "time with the ball", pts: "points", min: "minutes" };
  // each player's share of the team's total across these games (usage % -> share of plays)
  function tmShares(d, games, k) {
    const ix = {}; d.fields.forEach((f, i) => (ix[f] = i));
    const tot = {}; let all = 0;
    for (const g of games) for (const pid in g.p) {
      const r = g.p[pid];
      const v = k === "usg" ? r[ix.fga] + 0.44 * r[ix.fta] + r[ix.tov] : r[ix[k]];
      if (v == null) continue;
      tot[pid] = (tot[pid] || 0) + v; all += v;
    }
    if (!(all > 0)) return [];
    return Object.entries(tot).map(([pid, v]) => ({ pid, name: d.players[pid].name, s: v / all }))
      .filter((x) => x.s > 0).sort((a, b) => b.s - a.s);
  }
  function tmHeroHTML(T, d, teams) {
    const [band, stripe] = TM_COLORS[T.team] || ["#33413A", "#A9B3AC"];
    const name = (teams.find((t) => t.team === T.team) || {}).name || T.team;
    const opts = teams.map((t) => `<option value="${esc(t.team)}"${t.team === T.team ? " selected" : ""}>${esc(t.name)}</option>`).join("");
    const pills = TM_STATS.map(([k, , l, , tip]) => `<button type="button" data-tmstat="${k}" aria-pressed="${k === T.stat}" title="${esc(tip)}">${l}</button>`).join("");
    let meta = "", bar = "";
    if (d && d.games.length) {
      const n = d.games.length, w = d.games.filter((g) => g.wl === "W").length, last = d.games[n - 1];
      const games = tmMatches(d, T.f), f = Object.entries(T.f);
      meta = `${w}–${n - w} in ${n} game${n === 1 ? "" : "s"}. Last played ${tmDate(last.date)} ${last.home ? "vs" : "at"} ${esc(last.opp)}.`;
      if (f.length) meta += ` Showing the ${games.length} game${games.length === 1 ? "" : "s"} where ${f.map(([pid, s]) => `${esc(tmShort(d.players[pid].name))} ${s === "out" ? "sat" : "played"}`).join(" and ")}.`;
      const sh = games.length ? tmShares(d, games, T.stat) : [];
      const what = TM_SHARE_OF[T.stat];
      if (sh.length) {
        const A = [0.95, 0.78, 0.62, 0.5, 0.4, 0.32, 0.26];
        const top = sh.slice(0, 7), rest = sh.slice(7).reduce((a, x) => a + x.s, 0);
        const segs = top.map((x, i) => ({ lab: tmShort(x.name), full: x.name, s: x.s, a: A[i] }))
          .concat(rest >= 0.005 ? [{ lab: "Everyone else", full: "Everyone else", s: rest, a: 0.14 }] : []);
        const pct = (s) => Math.round(s * 100);
        const span = games.length === n ? `all ${n} game${n === 1 ? "" : "s"}` : `the ${games.length} game${games.length === 1 ? "" : "s"} shown`;
        bar = `<div class="tmshare"><p class="tmshare-t">Who gets the team's ${esc(what)}, ${span}</p>
          <div class="tmbar" role="img" aria-label="${esc(segs.map((x) => `${x.full} ${pct(x.s)}%`).join(", "))}">${segs.map((x) =>
            `<span style="flex:${x.s.toFixed(4)} 1 0;--a:${x.a}"${x.a >= 0.5 ? ' class="lt"' : ""} title="${esc(x.full)} ${pct(x.s)}%">${x.s >= 0.12 ? pct(x.s) + "%" : ""}</span>`).join("")}</div>
          <ul class="tmleg">${segs.map((x) => `<li style="--a:${x.a}"><i></i>${esc(x.lab)}<b>${pct(x.s)}%</b></li>`).join("")}</ul></div>`;
      } else if (games.length) {
        bar = `<p class="tmshare-t">No ${esc(what)} data for ${games.length === n ? "this team" : "these games"} yet.</p>`;
      }
    }
    return `<section class="tmhero" style="--tc:${band};--ts:${stripe}"><span class="tmwm" aria-hidden="true">${esc(T.team)}</span>
      <div class="tmtop"><h2>${esc(name)}</h2><select id="tmteam" aria-label="Team">${opts}</select></div>
      ${meta ? `<p class="tmmeta">${meta}</p>` : ""}
      <div class="tmpills" role="group" aria-label="Stat">${pills}</div>
      ${bar}</section>`;
  }

  function teamsHTML() {
    const teams = allTeams();
    if (!teams.length) return `<p class="notice">Loading teams…</p>`;
    const T = tmInit();
    ensureUsageDoc(T.team);
    const d = state.usageDocs && state.usageDocs[T.team];
    const hero = tmHeroHTML(T, d, teams);
    if (d === undefined) return hero + `<p class="notice">Loading ${esc(T.team)}…</p>`;
    if (!d || !d.games.length) return hero + `<p class="notice">No games for ${esc(T.team)} yet. The team card is built on each daily run.</p>`;
    return hero + tmFilterHTML(d, T) + tmSummaryHTML(d, T) + tmGridHTML(d, T) + tmSitsHTML(d, T);
  }

  function tmPlayers(d, games) {
    // everyone who played in these games, most minutes first
    const U = tmUtil(d);
    return Object.keys(d.players).map((pid) => ({ pid, name: d.players[pid].name, m: U.avg(games, pid, "min") }))
      .filter((x) => x.m.gp > 0).sort((a, b) => b.m.v - a.m.v);
  }

  function tmFilterHTML(d, T) {
    const all = tmPlayers(d, d.games);
    const never = Object.keys(d.players).filter((pid) => d.players[pid].cur && !all.some((x) => x.pid === pid));
    const sat = (pid) => d.games.filter((g) => g.sat.includes(pid)).length;
    const chips = all.map((x) => {
      const st = T.f[x.pid] || "any", n = sat(x.pid);
      const lab = st === "out" ? "Sat: " : st === "in" ? "Played: " : "";
      return `<button type="button" class="tmchip" data-tmf="${esc(x.pid)}" data-st="${st}" aria-label="${esc(x.name)}: ${st === "any" ? "any game" : st === "out" ? "only games he sat" : "only games he played"}">${lab}${esc(x.name)}<small>${x.m.v.toFixed(0)} mpg · sat ${n}</small></button>`;
    }).join("");
    const games = tmMatches(d, T.f), active = Object.keys(T.f).length;
    return `<section class="card"><header><h3>Who's out</h3><span class="dim">${games.length} of ${d.games.length} games match</span></header>
      <p class="cap">Tap a name once for games he <b>sat</b>, again for games he <b>played</b>, again to clear. Sat means on the roster but didn't play: injury, rest or coach's call. Sorted by minutes per game; every number below shows how many games it's built on.</p>
      <div class="tmchips">${chips}</div>
      ${never.length ? `<p class="cap tmnever">Hasn't played this season: ${never.map((p) => esc(d.players[p].name)).join(", ")}</p>` : ""}
      ${active ? `<div class="tools"><button type="button" class="btn" data-tmreset>Clear filters</button></div>` : ""}</section>`;
  }

  function tmSummaryHTML(d, T) {
    const U = tmUtil(d), games = tmMatches(d, T.f), active = Object.keys(T.f).length;

    const rows = tmPlayers(d, games).map((x) => {
      const cells = {}; TM_STATS.forEach(([k]) => (cells[k] = U.avg(games, x.pid, k)));
      return { ...x, c: cells, base: active ? U.avg(d.games, x.pid, T.stat) : null };
    }).sort((a, b) => (b.c[T.stat].v ?? -1) - (a.c[T.stat].v ?? -1));
    const sel = T.stat;

    const isTop = (k, v) => v != null && colMax[k] > 0 && v === colMax[k];

        let dl = "";

        }
        return a.v == null ? `<td class="gs tmsel mut">–${sh}${dl}</td>` : `<td class="gs tmsel tmh${isTop(k, a.v) ? " top" : ""}"${heat(k, a.v)}>${tmFmt(a.v, k)}${sh}${dl}</td>`;

      return `<tr><td class="rk">${i + 1}</td><td class="pl">${esc(x.name)}<small>${x.c.min.gp} gp</small></td>${tds}</tr>`;

    if (bad) parts.push(`${bad} game${bad === 1 ? "" : "s"} left out because NBA.com's numbers looked wrong (${games.filter((g) => g.bad).map((g) => `${tmDate(g.date)} ${g.home ? "vs" : "@"} ${esc(g.opp)}`).join(", ")})`);

    return `<section class="card"><header><h3>Per game${active ? " in matching games" : ""}</h3><span class="dim">${games.length} game${games.length === 1 ? "" : "s"}</span></header>
      <p class="cap">Averages over the games each player played. Every column is shaded against its leader, who is in bold. The ranked column also shows his share of the team's total in the games he played${active ? ", and the change from all his games" : ""}. Tap a column to rank by it.</p>${note}
      <div class="scroll"><table><thead><tr><th class="l"></th><th class="pl">Player</th>${th}</tr></thead><tbody>${body}</tbody></table></div></section>`;
  }

  function tmGridHTML(d, T) {
    const U = tmUtil(d), [k, l, name] = tmStat(T.stat);

    const shown = T.all ? games : games.slice(0, 12);

  function tmSitsHTML(d, T) {

        const a = U.avg(out, x.pid, k), b = U.avg(inn, x.pid, k);

        <div class="scroll"><table><thead><tr><th class="pl">Teammate</th><th>With him</th><th>Without</th><th>Change</th><th title="games without / games with">Games</th></tr></thead><tbody>${lines}</tbody></table></div></div>`;
    }).join("");
    return `<section class="card"><header><h3>Biggest changes when a regular sits: ${esc(name)}</h3></header>
      <p class="cap">For each player averaging ${TM_REG_MIN}+ minutes who has missed a game: the teammates (${TM_MATE_MIN}+ minutes a game) whose ${esc(name.toLowerCase())} per game went up most without him. Uses all of this season's games (ignores the filters above).</p>
      ${blocks || `<p class="cap" style="padding-bottom:14px">No regular has missed a game yet this season.</p>`}</section>`;
  }

  function injuriesHTML() {

  // ----- Injury boosts: who gains most from tonight's injuries -----
  const BSTATS = [["pts", "PTS", "proj_pts", "inj_pts", 1], ["3pm", "3PM", "proj_3pm", "inj_pa", 2], ["ast", "AST", "proj_ast", "inj_ast", 1], ["reb", "REB", "proj_reb", "inj_reb", 1]];
  function outNames(n, team) {
    const td = state.teamDocs[team];
    return currentOuts(n, team).map((id) => {
      const p = td && td.players && td.players[id], x = ((n.injuries || {})[team] || []).find((y) => String(y.player_id) === id);
      const nm = (p && p.name) || (x && x.player) || id;
      return nm.split(" ").slice(1).join(" ") || nm;

  }
  function injuryGains(n) {
    const by = {};
    const src = { "3pm": n.rows, pts: state.pts[n.id], ast: state.ast[n.id], reb: state.reb[n.id] };
    for (const [k, , pk, lk] of BSTATS) {
      (wiRows(n, src[k], k) || []).forEach((x) => {
        if (!inSel(x.game)) return;
        const id = String(x.player_id);
        const o = by[id] = by[id] || { id, player: x.player, team: x.team, opp: x.opp, home: x.home, g: {}, v: {}, stat: k };
        const was = x._was != null ? x._was : x[pk];
        o.v[k] = x[pk]; o.g[k] = x[pk] - was / (x[lk] || 1);
        if (o.v.min == null && x.min != null && x.base_min != null) { o.v.min = x.min; o.g.min = x.min - x.base_min; }

    return Object.values(by).filter((o) => Math.abs(o.g.pts || 0) >= 0.2 || Math.abs(o.g.min || 0) >= 0.5 || Math.abs(o.g["3pm"] || 0) >= 0.04 || Math.abs(o.g.ast || 0) >= 0.1 || Math.abs(o.g.reb || 0) >= 0.15);
  }
  function boostsHTML() {

      <div class="tools"><span class="seg" role="group" aria-label="Sort injury boosts">${seg}</span></div>

      ${all.length > 12 ? `<div class="prow"><span>${state.bAll ? `All ${all.length}` : `Top 12 of ${all.length}`}</span><button type="button" class="btn" data-ball="${state.bAll ? "0" : "1"}">${state.bAll ? "Show top 12" : "Show all"}</button></div>` : ""}`

  }

  // ----- Questionable tab -----
  function reportStatus(n, team, pid) { return reportOf(n, team, pid); }
  function qList(n) {
    if (!n) return [];
    const mine = (EDITS[n.id] || {}).q || {}, seen = {}, out = [];
    const calls = (EDITS[n.id] || {}).calls || {};
    Object.entries(n.injuries || {}).forEach(([team, arr]) => arr.forEach((x) => {
      const st = x.call ? (x.report || null) : String(x.status).toLowerCase();
      if (st === "questionable" || st === "doubtful" || x.call || calls[x.player_id]) { seen[x.player_id] = 1; out.push({ pid: String(x.player_id), team, name: x.player, report: st, mine: !!mine[x.player_id] }); }
    }));
    Object.entries(mine).forEach(([pid, v]) => { if (!seen[pid]) { seen[pid] = 1; out.push({ pid, team: v.team, name: v.name, report: null, mine: true }); } });
    Object.entries(calls).forEach(([pid, c]) => { if (!seen[pid]) out.push({ pid, team: c.team, name: c.name, report: null, mine: false }); });
    return out;
  }
  function qBtn(n, team, pid, name) {
    if (!n) return "";
    const rep = reportStatus(n, team, pid);
    if (rep === "questionable") return `<span class="flag">Questionable</span>`;
    if (rep === "doubtful") return "";
    const mine = !!((EDITS[n.id] || {}).q || {})[pid];
    return `<button type="button" class="qbtn" data-qflag="${esc(pid)}" data-qteam="${esc(team)}" data-qname="${esc(name)}" aria-pressed="${mine}" title="${mine ? "On the Questionable tab. Tap to remove." : "Add to the Questionable tab"}">${mine ? "Questionable" : "Flag Q"}</button>`;
  }
  // Plays / Out / back to the report's default for one player
  function decide(n, team, pid, val, unflag) {
    const lk = officialOuts(n, team), cur = currentOuts(n, team);
    const sit = val === "out" || (!val && lk.includes(pid));
    const outs = sit ? [...new Set([...cur, pid])] : cur.filter((x) => x !== pid);
    const same = sameSet(outs, lk);
    editNight(n.id, (d) => {
      d.outs = d.outs || {}; if (same) delete d.outs[team]; else d.outs[team] = outs;
      d.dec = d.dec || {}; if (val) d.dec[pid] = val; else delete d.dec[pid];
      if (unflag && d.q) delete d.q[pid];
      return d;
    });
    if (state.inj && state.inj.team === team) state.inj = injState(team);
    if (state.panel && state.panel.team === team) state.panel.out = currentOuts(n, team);
  }
  function confirmCall(n, team, pid, name, call) {
    editNight(n.id, (d) => {
      d.calls = d.calls || {};
      if (call) d.calls[pid] = { call, team, name, at: new Date().toISOString() }; else delete d.calls[pid];
      if (d.dec) delete d.dec[pid];
      if (d.outs && d.outs[team]) {                    // keep any test on this team consistent
        const t = new Set(d.outs[team].map(String));
        const sit = call ? call === "out" : reportSits(reportOf(n, team, pid));
        if (sit) t.add(pid); else t.delete(pid);
        d.outs[team] = [...t];
      }
      return d;
    });
    const ed = EDITS[n.id];
    if (ed && ed.outs && ed.outs[team] && sameSet(ed.outs[team], officialOuts(n, team))) editNight(n.id, (d) => { if (d.outs) delete d.outs[team]; return d; });
    if (state.inj && state.inj.team === team) state.inj = injState(team);
    if (state.panel && state.panel.team === team) state.panel.out = currentOuts(n, team);
  }
  function askConfirm(o, onOk) {

  function confirmFlow(n, team, pid, name, call) {

          body: `This becomes official for ${esc(game)}: the board, its locked ratings and grading treat him as ${call === "out" ? "out, and his teammates' projections go up" : "playing"}. The page updates now and the posted board within a few minutes. You can undo it until tip${esc(tip)}.`,
          plain: `Confirm ${name} ${call === "out" ? "is out" : "plays"}? This becomes official for ${game}: board, locked ratings and grading.` }
      : { title: `Undo the confirmation for ${esc(name)}?`, ok: "Undo confirmation",
          body: `The board goes back to the injury report${rep ? ` (${esc(rep)}, so he ${def})` : ` (he ${def})`} at its next update.`,
          plain: `Undo the confirmation for ${name}?` };

  function sitImpact(n, team, pid) {

  }
  function questionableHTML() {
    const n = currentNight();
    if (!n) return emptyBoard();

    const head = `<section class="card"><header><h3>Questionable</h3><span class="syncnote">${syncNoteHTML()}</span></header>
      <p class="cap">Everyone listed questionable or doubtful on tonight's injury report, plus anyone you flag with <b>Flag Q</b> on the <button type="button" class="tlink" data-tab="injuries">Injuries</button> tab. Until you confirm, questionable players are assumed to play and doubtful ones to sit.</p>

  // ----- click-to-sort for every table that doesn't have its own sorting -----

  const tsort = {};
  const MON = { Jul: 0, Aug: 1, Sep: 2, Oct: 3, Nov: 4, Dec: 5, Jan: 6, Feb: 7, Mar: 8, Apr: 9, May: 10, Jun: 11 };
  const GRADE_ORD = { "A+": 0, A: 1, "A-": 1.5, "B+": 1.8, B: 2, "B-": 2.5, C: 3, D: 4, F: 5 };
  function tableKey(tb) {
    const box = tb.closest("section, .card, .psub");
    const h = box && (box.querySelector("h3, h2"));
    const sec = tb.closest("section"); const h3 = sec && sec.querySelector("h3");
    return `${h3 ? h3.textContent : h ? h.textContent : ""}|${[...tb.tHead.rows[0].cells].map((c) => c.textContent.trim()).join("/")}`;
  }
  function cellVal(td) {
    if (!td) return { v: null };
    if (td.dataset.v != null) { const n = Number(td.dataset.v); return isNaN(n) ? { v: td.dataset.v, kind: "str" } : { v: n, kind: td.dataset.kind || "num" }; }
    const t = td.textContent.replace(/\s+/g, " ").trim();
    if (!t || /^(–|—|-|DNP|n\/a)$/i.test(t)) return { v: null };
    let m;
    if ((m = t.match(/^(\d+)(st|nd|rd|th)$/))) return { v: +m[1], kind: "rank" };
    if (t in GRADE_ORD) return { v: GRADE_ORD[t], kind: "rank" };
    if ((m = t.match(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\w*\.? (\d{1,2})\b/)) && t.length < 16) return { v: MON[m[1]] * 40 + +m[2], kind: "date" };
    if ((m = t.replace(/−/g, "-").replace(/^\+/, "").match(/^-?\d[\d,]*(\.\d+)?|^-?\.\d+/))) return { v: parseFloat(m[0].replace(/,/g, "")), kind: "num" };
    return { v: t.toLowerCase(), kind: "str" };
  }
  function sortTable(tb, col, dir) {
    const body = tb.tBodies[0]; if (!body) return;
    const groups = []; [...body.rows].forEach((tr) => { if (tr.classList.contains("xrow") && groups.length) groups[groups.length - 1].push(tr); else groups.push([tr]); });
    const keyed = groups.map((g, i) => ({ g, i, c: cellVal(g[0].cells[col]) }));
    keyed.sort((a, b) => {
      if (a.c.v == null && b.c.v == null) return a.i - b.i;
      if (a.c.v == null) return 1; if (b.c.v == null) return -1;

      return (dir === "asc" ? x : -x) || a.i - b.i;

    keyed.forEach((k) => k.g.forEach((tr) => body.appendChild(tr)));
    [...tb.tHead.rows[0].cells].forEach((th, i) => { if (i === col) th.setAttribute("aria-sort", dir === "asc" ? "ascending" : "descending"); else th.removeAttribute("aria-sort"); });
  }

      const n = currentNight(), pid = t.dataset.qflag, team = t.dataset.qteam, name = t.dataset.qname;
      if (n) {
        if (((EDITS[n.id] || {}).q || {})[pid]) decide(n, team, pid, null, true);
        else editNight(n.id, (d) => { d.q = d.q || {}; d.q[pid] = { team, name }; return d; });
        render();
        const b = document.querySelector(`#view button[data-qflag="${CSS.escape(pid)}"]`); if (b) b.focus();
      }
      return;
    }
    if (t.dataset.qconfirm && t.dataset.qpid) { const n = currentNight(); if (n) confirmFlow(n, t.dataset.qteam, t.dataset.qpid, t.dataset.qname || "", t.dataset.qconfirm); return; }
    if (t.hasAttribute("data-qunconfirm") && t.dataset.qpid) { const n = currentNight(); if (n) confirmFlow(n, t.dataset.qteam, t.dataset.qpid, t.dataset.qname || "", null); return; }
    if (t.dataset.qdec != null && t.dataset.qpid) {
      const n = currentNight(); if (!n) return;
      decide(n, t.dataset.qteam, t.dataset.qpid, t.dataset.qdec || null);
      render(); if (state.panel) renderPanel();
      const b = document.querySelector(`#view button[data-qdec="${t.dataset.qdec || "plays"}"][data-qpid="${CSS.escape(t.dataset.qpid)}"]`); if (b) b.focus();
      return;
    }
    if (t.hasAttribute("data-qunflag")) { const n = currentNight(); if (n) { decide(n, t.dataset.qteam, t.dataset.qpid, null, true); render(); } return; }
    if (t.dataset.stat) {
      state.stat = t.dataset.stat;
      try { localStorage.setItem("3pt-stat", state.stat); } catch (err) {}
      render(); return;
    }
    if (t.dataset.psort) {
      const k = t.dataset.psort;
      state.psort = state.psort.key === k ? { key: k, dir: state.psort.dir === "desc" ? "asc" : "desc" } : { key: k, dir: k === "player" ? "asc" : "desc" };
      render(); return;
    }
    if (t.dataset.asort) {
      const k = t.dataset.asort;
      state.asort = state.asort.key === k ? { key: k, dir: state.asort.dir === "desc" ? "asc" : "desc" } : { key: k, dir: k === "player" ? "asc" : "desc" };
      render(); return;
    }
    if (t.dataset.rsort) {
      const k = t.dataset.rsort;
      state.rsort = state.rsort.key === k ? { key: k, dir: state.rsort.dir === "desc" ? "asc" : "desc" } : { key: k, dir: k === "player" ? "asc" : "desc" };
      render(); return;
    }
    if (t.dataset.rdsort) {
      const k = t.dataset.rdsort;
      state.rdsort = state.rdsort.key === k ? { key: k, dir: state.rdsort.dir === "desc" ? "asc" : "desc" } : { key: k, dir: k === "team_name" ? "asc" : "desc" };
      render(); return;
    }
    if (t.dataset.adsort) {
      const k = t.dataset.adsort;
      state.adsort = state.adsort.key === k ? { key: k, dir: state.adsort.dir === "desc" ? "asc" : "desc" } : { key: k, dir: k === "team_name" ? "asc" : "desc" };
      render(); return;
    }
    if (t.dataset.ddsort) {
      const k = t.dataset.ddsort;
      state.ddsort = state.ddsort.key === k ? { key: k, dir: state.ddsort.dir === "desc" ? "asc" : "desc" } : { key: k, dir: k === "team" ? "asc" : "desc" };
      render(); return;
    }
    if (t.dataset.pdsort) {
      const k = t.dataset.pdsort;
      state.pdsort = state.pdsort.key === k ? { key: k, dir: state.pdsort.dir === "desc" ? "asc" : "desc" } : { key: k, dir: k === "team_name" ? "asc" : "desc" };
      render(); return;
    }
    if (t.hasAttribute("data-close")) { closePanel(); return; }
    if (t.hasAttribute("data-reset")) { if (state.panel) { state.panel.out = state.panel.locked.slice(); setOuts(state.nights.find((x) => x.id === state.panel.nightId), state.panel.team, state.panel.out); if (state.inj && state.inj.team === state.panel.team) state.inj = injState(state.inj.team); render(); renderPanel(); } return; }
    if (t.dataset.tab) {
      state.tab = t.dataset.tab;
      try { localStorage.setItem("3pt-tab", state.tab); } catch (err) {}
      render(); return;
    }
    if (t.dataset.game) {
      const g = t.dataset.game;
      if (g === "ALL") state.sel = [];
      else state.sel = state.sel.includes(g) ? state.sel.filter((x) => x !== g) : [...state.sel, g];
      render(); return;
    }
    if (t.dataset.show) { state.show = t.dataset.show; render(); return; }
    if (t.dataset.sort) {
      const k = t.dataset.sort;
      state.sort = state.sort.key === k ? { key: k, dir: state.sort.dir === "desc" ? "asc" : "desc" } : { key: k, dir: k === "player" ? "asc" : "desc" };
      render(); return;
    }
    if (t.dataset.dsort) {
      const k = t.dataset.dsort;
      state.dsort = state.dsort.key === k ? { key: k, dir: state.dsort.dir === "desc" ? "asc" : "desc" } : { key: k, dir: k === "team_name" ? "asc" : "desc" };
      render(); return;
    }
    if (t.dataset.open) { state.nightId = t.dataset.open; state.sel = []; state.tab = "board"; render(); return; }
  });
  document.addEventListener("change", (e) => {
    if (e.target.id === "tmteam") {
      const T = tmInit(); T.team = e.target.value; T.f = {}; T.all = false;
      try { localStorage.setItem("tm-team", T.team); } catch (err) {}
      render(); const sel = $("#tmteam"); if (sel) sel.focus(); return;
    }
    if (e.target.id === "minadj" && state.panel) {
      const v = parseFloat(e.target.value);
      if (!isNaN(v) && v >= 0 && v <= 53) minSet(state.panel, Math.round(v * 2) / 2);
      renderPanel(); const again = $("#minadj"); if (again) again.focus(); return;
    }
    if (e.target.id === "injteam") { state.inj = injState(e.target.value); render(); const sel = $("#injteam"); if (sel) sel.focus(); return; }
    const tid = e.target.dataset && e.target.dataset.tout;
    if (tid && state.inj && state.tab === "injuries") {
      const P = state.inj;
      P.out = e.target.checked ? [...new Set([...P.out, tid])] : P.out.filter((x) => x !== tid);
      if (P.nightId) setOuts(state.nights.find((x) => x.id === P.nightId), P.team, P.out);
      render();
      const again = document.querySelector(`#view input[data-tout="${CSS.escape(tid)}"]`); if (again) again.focus();
      return;
    }
    const m = e.target.dataset && e.target.dataset.mate;
    if (!m || !state.panel) return;
    const o = state.panel.out;
    if (e.target.checked) { if (!o.includes(m)) o.push(m); } else state.panel.out = o.filter((x) => x !== m);
    setOuts(state.nights.find((x) => x.id === state.panel.nightId), state.panel.team, state.panel.out);
    if (state.inj && state.inj.team === state.panel.team) state.inj = injState(state.inj.team);
    render(); renderPanel();
    const again = document.querySelector(`#panel input[data-mate="${CSS.escape(m)}"]`); if (again) again.focus();
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && state.panel) closePanel(); });
  // pick up changes made on another device
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") loadEdits(state.nightId, true); });
  setInterval(() => { if (document.visibilityState === "visible" && !sync.pending && ["injuries", "quest", "board"].includes(state.tab)) loadEdits(state.nightId, true); }, 60000);
  function showTip(el) {
    const wrap = el.closest(".l10"); if (!wrap) return;
    const tip = wrap.querySelector(".tip"), svg = wrap.querySelector("svg");
    const [a, b] = String(el.dataset.tip).split("|");
    tip.textContent = ""; const strong = document.createElement("b"); strong.textContent = b; tip.append(strong, document.createElement("br"), document.createTextNode(a));
    const vbw = Number((svg.getAttribute("viewBox") || "0 0 520 0").split(/\s+/)[2]) || 520;
    const sc = svg.getBoundingClientRect().width / vbw, off = svg.getBoundingClientRect().left - wrap.getBoundingClientRect().left;
    tip.style.left = off + Number(el.dataset.x) * sc + "px"; tip.style.top = Number(el.dataset.y) * sc - 6 + "px"; tip.hidden = false;
  }
  function hideTip(el) { const w = el.closest(".l10"); if (w) w.querySelector(".tip").hidden = true; }
  document.addEventListener("pointerover", (e) => { if (e.target.classList && e.target.classList.contains("hit")) showTip(e.target); });
  document.addEventListener("pointerout", (e) => { if (e.target.classList && e.target.classList.contains("hit")) hideTip(e.target); });
  document.addEventListener("focusin", (e) => { if (e.target.classList && e.target.classList.contains("hit")) showTip(e.target); });
  document.addEventListener("focusout", (e) => { if (e.target.classList && e.target.classList.contains("hit")) hideTip(e.target); });
  $("#night").addEventListener("change", (e) => { state.nightId = e.target.value; state.sel = []; if (state.inj) state.inj = injState(state.inj.team); render(); });

  render();
  start();
})();
</script>
