      return { r, p0, min0, dP: r.proj_pts - p0, outs: outsRot, qs, qP };
    });
    const names = (team, ids) => ids.map((id) => esc(nm(team, id))).join(", ");
    const list = mode === "out" ? rows.filter((x) => x.dP >= 0.2).sort((a, b) => b.dP - a.dP) : rows.filter((x) => x.qP != null && x.qP >= 0.2).sort((a, b) => b.qP - a.qP);
    const maxD = Math.max(0.01, ...list.map((x) => (mode === "out" ? x.dP : x.qP)));
    const arrow = (a, b) => `<span class="dim">${f1(a)}</span> → <b>${f1(b)}</b>`;
    const head = mode === "out"
      ? `<th class="mut" style="text-align:left">#</th><th class="pl">Scorer</th><th class="l" title="Teammates ruled out tonight (and any you've sat as a test)">Teammates out</th><th class="gs" title="Extra points tonight from teammates being out">+Pts</th><th title="Projected points with everyone available → tonight">Pts</th><th title="Projected minutes with everyone available → tonight">Min</th><th title="More points on top of tonight's if every questionable teammate sits">If Q sit</th>`
      : `<th class="mut" style="text-align:left">#</th><th class="pl">Scorer</th><th class="l" title="Questionable or doubtful teammates not yet ruled out">Questionable</th><th class="gs" title="Extra points if they all sit">+Pts</th><th title="Projected points tonight → if they sit">Pts</th>`;
    const body = list.map((x, i) => {
      const r = x.r, qOk = x.qP != null && x.qP >= 0.1;
      if (mode === "out") return `<tr><td class="rk">${i + 1}</td>${v3Who(r)}<td class="l why">${x.outs.length ? names(r.team, x.outs) : "–"}</td><td class="share" style="--w:${Math.round((x.dP / maxD) * 100)}"><b>+${f1(x.dP)}</b></td><td>${arrow(x.p0, r.proj_pts)}</td><td>${arrow(x.min0, r.min)}</td><td${qOk ? ` title="If ${esc(x.qs.map((id) => nm(r.team, id)).join(", "))} sit${x.qs.length === 1 ? "s" : ""}"` : ""}>${qOk ? `+${f1(x.qP)}` : `<span class="mut">–</span>`}</td></tr>`;
      return `<tr><td class="rk">${i + 1}</td>${v3Who(r)}<td class="l why">${names(r.team, x.qs)}</td><td class="share" style="--w:${Math.round((x.qP / maxD) * 100)}"><b>+${f1(x.qP)}</b></td><td>${arrow(r.proj_pts, r.proj_pts + x.qP)}</td></tr>`;

    const MODES = [["out", "Teammates out"], ["q", "If questionable sit"]];
    return `<section class="card"><header><h3>${mode === "out" ? "Scoring bumps tonight" : "If questionable teammates sit"}${allG() ? "" : ": " + esc(selLabel())}</h3>${v3Seg("pvol", MODES, mode, "Which teammates")}</header>
      <p class="cap">${mode === "out"

        : "How many more points each scorer would get if every questionable or doubtful teammate not yet ruled out sits, on top of tonight's projection. Test or confirm a player on the <button type=\"button\" class=\"tlink\" data-tab=\"quest\">Questionable</button> tab to make it count."}${v3Loading(pending)}</p>
      ${v3Table("vp-vol-" + mode, head, body, "scorers", pending ? "Loading teammate data…" : mode === "out" ? `Nobody's points move with teammates out ${allG() ? "tonight" : inThese()}.` : `No questionable teammates would move anyone's points ${allG() ? "tonight" : inThese()}.`)}</section>`;
  }

  function act(n, r) { return n.results ? n.results[String(r.player_id)] : null; }

  function gradedSummary(n) {
    const rows = (n.rows || []).map((r) => ({ r, a: act(n, r) })).filter((x) => x.a);
    if (!rows.length) return "";
    const sum = (arr, f) => arr.reduce((s, x) => s + f(x), 0);
    const top = rows.slice().sort((x, y) => y.r.proj_3pm - x.r.proj_3pm).slice(0, 10);

        ${tile(`${f2(sum(top, (x) => x.a.fg3m) / top.length)}`, `Made per player by the top 10 projected (projected ${f2(sum(top, (x) => x.r.proj_3pm) / top.length)})`)}
        ${good.length ? tile(sgnN(sum(good, (x) => x.a.fg3m - x.r.base_3pm) / good.length), `A and A+ matchups vs their normal output (${good.length} players)`) : ""}
      </div></section>`;
  }

  // ----- Top grades: the best matchups among proven-volume players, all four stats -----
  const TOP_STATS = [
    { s: "3pm", name: "Made threes", unit: "threes", rows: (n) => wiRows(n, (n.rows || []).slice(), "3pm") || [], proj: "proj_3pm", base: "base_3pm", fmt: f2, vol: (r) => `${f1(r.proj_3pa)} 3PA` },
    { s: "pts", name: "Points", unit: "points", rows: (n) => wiRows(n, (state.pts[n.id] || []).slice(), "pts") || [], proj: "proj_pts", base: "base_pts", fmt: f1, vol: (r) => `${f1(r.min)} min` },
    { s: "ast", name: "Assists", unit: "assists", rows: (n) => wiRows(n, (state.ast[n.id] || []).slice(), "ast") || [], proj: "proj_ast", base: "base_ast", fmt: f2, vol: (r) => `${f1(r.min)} min` },
    { s: "reb", name: "Rebounds", unit: "rebounds", rows: (n) => wiRows(n, (state.reb[n.id] || []).slice(), "reb") || [], proj: "proj_reb", base: "base_reb", fmt: f2, vol: (r) => `${f1(r.min)} min` },
  ];
  function topHTML() {
    const n = currentNight();
    if (!n) return emptyBoard();
    const keep = state.topAll ? ["A+", "A", "B"] : ["A+", "A"];
    const edgeOf = (r, T) => (r.edge != null ? r.edge : (r[T.base] || 0) * (r.boost || 0));
    const sections = TOP_STATS.map((T) => {
      let rows = T.rows(n).filter((r) => !r.gate && keep.includes(r.grade));
      if (!allG()) rows = rows.filter((r) => inSel(r.game));
      rows.sort((a, b) => (GRADE_T[b.grade] ?? 0) - (GRADE_T[a.grade] ?? 0) || edgeOf(b, T) - edgeOf(a, T));
      const body = rows.map((r) => `<tr>
        <td class="pl"><button type="button" class="link" data-player="${r.player_id}" data-pstat="${T.s}">${esc(r.player)}</button><small><button type="button" class="tlink" data-team="${esc(r.team)}">${esc(r.team)}</button> ${r.home ? "vs" : "@"} <button type="button" class="tlink" data-team="${esc(r.opp)}">${esc(r.opp)}</button>${gameLocked(n, (n.games || []).find((g) => g.game === r.game)) ? "" : ` · <span class="dim">preview</span>`}</small></td>
        <td>${gradeChip(r.grade, r.gate)}</td>
        <td class="h" style="background:${heat(boostT(r.boost))}">${edgeOf(r, T) >= 0 ? "+" : "−"}${T.fmt(Math.abs(edgeOf(r, T)))}</td>

      return `<section class="card"><header><h3>${T.name}</h3><span class="eyebrow">${rows.length} player${rows.length === 1 ? "" : "s"}</span></header>
        <div class="scroll"><table><thead><tr><th class="pl">Player</th><th>Grade</th><th title="Extra ${T.unit} the matchup adds over his normal output">Matchup</th><th class="gs">Projected</th><th>Normal</th><th>Volume</th></tr></thead>
        <tbody>${body || `<tr><td class="l" colspan="6" style="padding:14px 16px">No proven ${T.unit === "threes" ? "shooters" : "players"} graded ${keep.join(" or ")} ${allG() ? "tonight" : inThese()}.</td></tr>`}</tbody></table></div></section>`;
    }).join("") + praTopHTML(n, keep);
    return `<section class="card"><header><h3>Top grades${allG() ? "" : ": " + esc(selLabel())}</h3>
        <span class="seg" role="group" aria-label="Which grades">

          <button type="button" data-topall="1" aria-pressed="${!!state.topAll}">B or better</button>
        </span></header>
      <p class="cap">The best matchups tonight among players with proven volume and sample, for every stat. <b>Matchup</b> is how much the matchup adds in the stat's own units (made threes, points, assists, rebounds, or the PRA combo you pick) over his normal output. These are the posted board's numbers; what-ifs don't change them. Click a player for his card.</p></section>${sections}`;
  }
  // ----- Funnels: top-5 defenses by category and the opposing players who fit -----
  const FUN_RES = { fg3m: "3PM", pts: "PTS", oreb: "OREB", reb: "REB", ast: "AST" };
  const TEAM_C = { ATL: "#C8102E", BOS: "#007A33", BKN: "#2A2A2A", CHA: "#1D1160", CHI: "#CE1141", CLE: "#860038", DAL: "#00538C", DEN: "#0E2240", DET: "#C8102E", GSW: "#1D428A", HOU: "#CE1141", IND: "#002D62", LAC: "#C8102E", LAL: "#552583", MEM: "#5D76A9", MIA: "#98002E", MIL: "#00471B", MIN: "#0C2340", NOP: "#0C2340", NYK: "#006BB6", OKC: "#007AC1", ORL: "#0077C0", PHI: "#006BB6", PHX: "#1D1160", POR: "#E03A3E", SAC: "#5A2D81", SAS: "#3A3D40", TOR: "#CE1141", UTA: "#002B5C", WAS: "#002B5C" };
  const FUN_GROUP = { cs_fgm: ["jump", "Jump shots"], cs_freq: ["jump", "Jump shots"], pu_fgm: ["jump", "Jump shots"], pu_freq: ["jump", "Jump shots"],
    c3_fga: ["zone", "3PT zones"], atb_fga: ["zone", "3PT zones"], ra_fgm: ["rim", "At the rim"], oreb: ["boards", "Boards"], reb: ["boards", "Boards"],
    ast: ["ast", "Playmaking"], spot_ppg: ["pt", "Play types"], prbh_ppg: ["pt", "Play types"], roll_ppg: ["pt", "Play types"], trans_ppg: ["pt", "Play types"] };
  const tpill = (t, sm) => `<button type="button" class="tpill${sm ? " sm" : ""}" data-team="${esc(t)}" style="--tc:${TEAM_C[t] || "#555"}">${esc(t)}</button>`;
  // Funnel lists show their top 10; an arrow under the table expands to the rest.
  const FUN_TOP = 10;
  const funOpen = (k) => !!(state.fexp && state.fexp[k]);
  const funSlice = (k, arr) => (funOpen(k) ? arr : arr.slice(0, FUN_TOP));
  const moreBtn = (k, total, noun) => total > FUN_TOP
    ? `<button type="button" class="more" data-fexp="${k}" aria-expanded="${funOpen(k)}">${funOpen(k) ? `Show top ${FUN_TOP}` : `Show all ${total} ${noun}`}<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6l4.5 4.5L12.5 6"/></svg></button>` : "";
  function funnelsHTML() {
    const n = currentNight();
    if (!n) return emptyBoard();
    const F = n.funnels;
    if (!F) return `<section class="card"><header><h3>Funnels</h3></header><div class="empty"><p>Funnels start with the next board build. Games locked before then don't have them.</p></div></section>`;
    const cats = {}; (F.categories || []).forEach((c) => (cats[c.id] = c));
    const NUMQ = new Set(F.num_qual || []);
    const inGame = (e) => inSel(e.game);
    const isPct = (c) => c.id.endsWith("_freq");
    const val = (c, v) => (isPct(c) ? pct(v, 1) : f1(v));
    const qv = (c, v) => (NUMQ.has(c.freq) ? f1(v) : pct(v, 0));
    const qthr = (c) => (NUMQ.has(c.freq) ? `${Number(c.thr).toFixed(1)}+` : `${pct(c.thr, 0)}+`);
    const qlab = (c) => (F.freq_label || {})[c.freq] || "Qualifier";
    const grp = (c) => FUN_GROUP[c.id] || ["jump", ""];
    const gtag = (e) => (e.games != null && e.games < 10 ? ` <span class="dim">(${e.games} game${e.games === 1 ? "" : "s"})</span>` : "");
    const graded = !!n.results;
    const gameOf = (e) => (n.games || []).find((g) => g.game === e.game);
    const prevTag = (e) => (gameLocked(n, gameOf(e)) ? "" : ` <span class="dim">· preview</span>`);
    const pname = (p, c) => {
      const want = ["cs", "pu", "c3", "atb"].includes(c.freq) ? "3pm" : c.freq === "ast_pg" ? "ast" : ["oreb_pg", "rebch_pg"].includes(c.freq) ? "reb" : "pts";
      const has = { "3pm": (n.rows || []).some((r) => r.player_id === p.player_id), pts: !!(n.pts_index && n.pts_index[p.player_id]), ast: !!(n.ast_index && n.ast_index[p.player_id]), reb: !!(n.reb_index && n.reb_index[p.player_id]) };
      const st = has[want] ? want : ["pts", "3pm", "ast", "reb"].find((k) => has[k]);
      return st ? `<button type="button" class="link" data-player="${p.player_id}" data-pstat="${st}">${esc(p.player)}</button>` : esc(p.player);
    };
    const resCell = (p, c) => {
      if (!graded) return "";
      const a = n.results[p.player_id], k = c.res;
      if (!a) return `<td class="mut">DNP</td>`;
      const v = a[k], up = p.avg != null && v > p.avg;
      return `<td><b class="${up ? "up" : ""}">${v}</b> <span class="dim">avg ${f1(p.avg)}</span></td>`;
    };
    // Teammates out tonight move a player's numbers (posted board only, not what-ifs):
    // shot shares by with/without splits, per-game numbers by the board's injury math.
    const injWas = (p, c) => {
      const i = p.inj;
      if (!i || i.freq0 == null || Math.abs(p.freq - i.freq0) < (NUMQ.has(c.freq) ? 0.05 : 0.0005)) return "";
      return ` <span class="dim" title="His normal number, before tonight's outs">(${qv(c, i.freq0)})</span>`;
    };
    const injNote = (p, c) => {
      const i = p.inj;
      if (!i || !(i.outs || []).length) return "";
      const moved = i.freq0 != null && Math.abs(p.freq - i.freq0) >= (NUMQ.has(c.freq) ? 0.05 : 0.0005);
      const sp = (i.split || []).map((x) => `${lastNm(x[0])} ${x[1]} g`).join(", ");
      const how = i.how === "split" ? (sp ? `games without: ${sp}` : "no games without them yet")
        : i.how === "ratio" ? "board's injury math" : "play types don't move";
      return `<small title="${esc(how)}">${(i.outs || []).map((x) => esc(lastNm(x))).join(", ")} out${moved ? "" : " · no change"}${i.how === "split" && sp ? ` · ${esc(sp)}` : ""}</small>`;
    };
    const playersTable = (e, c) => {
      if (!c.freq) return `<p class="cap">Defense only: no player threshold for this category.</p>`;

      if (!ps.length) return `<p class="cap">No ${esc(e.off)} player clears ${qthr(c)} ${esc(qlab(c))} with ${F.min_minutes || 15}+ minutes.</p>`;

      const body = funSlice(pk, ps).map((p) => `<tr><td class="pl">${pname(p, c)}${p.q ? `<span class="flag">Questionable</span>` : ""}${p.blend ? `<small>incl. 2025-26 (${p.gp} game${p.gp === 1 ? "" : "s"} this season)</small>` : p.l10 && p.l10 < 10 && !c.freq.startsWith("pt_") ? `<small>last ${p.l10} games (all he's played)</small>` : !p.l10 && !c.freq.startsWith("pt_") ? `<small>season (${p.gp} game${p.gp === 1 ? "" : "s"})</small>` : ""}${injNote(p, c)}</td>
        <td class="gs"><b>${qv(c, p.freq)}</b>${injWas(p, c)}</td><td>${f1(p.vol)}</td><td class="mut">${f1(p.min)}${p.min_l10 != null ? ` · ${f1(p.min_l10)}` : ""}${p.inj && p.inj.min_tonight != null && Math.abs(p.inj.min_tonight - p.min) >= 1 ? ` <span title="Projected tonight with teammates out">→ ${f1(p.inj.min_tonight)}</span>` : ""}</td>${resCell(p, c)}</tr>`).join("");
      return `<div class="scroll"><table><thead><tr><th class="pl">${esc(e.off)} player</th><th class="gs" title="Needs ${qthr(c)}">${esc(qlab(c))} <span class="dim">(${qthr(c)})</span></th><th>${esc((F.vol_label || {})[c.freq] || "Vol")}/g</th><th title="Season · last 10 games">Min</th>${graded ? `<th>${FUN_RES[c.res]}</th>` : ""}</tr></thead><tbody>${body}</tbody></table></div>${moreBtn(pk, ps.length, "players")}`;
    };
    // one card per category
    const quiet = [], waiting = [], shown = [], cardOf = {};
    (F.categories || []).forEach((c) => { cardOf[c.id] = (() => {
      if ((F.missing || []).includes(c.id)) { waiting.push(c.label); return ""; }
      // best-ranked defense first (locked games' entries are stored ahead of open ones)
      const es = (F.entries || []).filter((e) => e.cat === c.id && inGame(e)).sort((x, y) => x.rank - y.rank || String(x.def).localeCompare(String(y.def)));
      if (!es.length) { quiet.push(c.label); return ""; }
      const top = es[0].top || [];
      const [gk, gl] = grp(c);
      shown.push({ id: c.id, label: c.label, gk });
      const blocks = es.map((e) => `<div class="fdef" style="--tc:${TEAM_C[e.def] || "#555"}">
          <div class="fdef-h">${tpill(e.def)}<span class="frank">${ord(e.rank)}</span>
            <span class="mut">${val(c, e.value)} ${isPct(c) ? "of shots" : "per game"}${gtag(e)}${e.pace != null ? ` · pace ${f1(e.pace)}` : ""}</span>
            <span class="mut" style="margin-left:auto">vs</span>${tpill(e.off, 1)}${prevTag(e)}</div>
          ${playersTable(e, c)}</div>`).join("");
      return `<section class="card fcat" data-fgrp="${gk}" data-fcat="${esc(c.id)}" style="--gc:var(--g-${gk})"><header><h3><span class="fgrp">${esc(gl)}</span>${esc(c.label)}</h3><span class="eyebrow">${c.window === "l10" ? "Last 10 games" : "Full season"}</span></header>
        <p class="cap">Top ${F.top_n || 5}: ${top.map((x) => `${esc(x[0])} ${val(c, x[2])}`).join(" · ")}. Players: ${qthr(c)} ${esc(qlab(c).toLowerCase())}, ${F.min_minutes || 15}+ min (season, last 10, or projected tonight).</p>${blocks}</section>`;
    })(); });
    // related categories side by side (stacked on narrow screens)
    const PAIRS = [["cs_fgm", "cs_freq"], ["pu_fgm", "pu_freq"], ["oreb", "reb"], ["prbh_ppg", "roll_ppg"]];

  function combosDefenseHTML() {

      <div class="scroll"><table><thead><tr><th class="mut" style="padding-left:16px;text-align:left">#</th><th class="pl">Defense</th>${th("FGA", "3PA", "Attempts allowed per game")}${th("FGM", "3PM", "Makes allowed per game")}${th("AST", "Assisted 3PM", "Assisted makes allowed per game")}${th("PCT", "Ast %", "Share of makes assisted")}${th("CUR", "This season", "This season only: 3PM · assisted 3PM per game")}</tr></thead><tbody>${rows}</tbody></table></div></section>`;

  function combosResultsHTML() {
    const z = state.cz || "both";
    const nights = state.nights.filter((n) => n.status === "graded" && n.combos_results && (n.cmb_games || []).length);
    const head = `<section class="card"><header><h3>Combos results</h3>${czToggle()}</header>
      <p class="cap">How the projections held up, from play-by-play: projected vs actual assisted ${CZS[z]} for the top 10 passers and top 10 pairs each night, and how often a top-10 pair connected at least once.</p></section>`;
    if (!nights.length) return head + `<section class="card"><div class="empty"><p>Results show up once a night with combos has been graded and its play-by-play is in.</p></div></section>`;

      const C = cmbFor(n);

      const tp = (C.passers || []).filter((p) => (R.passers || {})[p.player_id]).sort((a, b) => czv(b.proj, z) - czv(a.proj, z)).slice(0, 10);
      const tq = (C.pairs || []).filter((x) => (R.pairs || {})[`${x.passer_id}-${x.shooter_id}`]).sort((a, b) => czv(b.proj, z) - czv(a.proj, z)).slice(0, 10);
      const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
      const pp = sum(tp, (p) => czv(p.proj, z)), pa = sum(tp, (p) => cza(R.passers[p.player_id], z));
      const qp = sum(tq, (x) => czv(x.proj, z)), qa = sum(tq, (x) => cza(R.pairs[`${x.passer_id}-${x.shooter_id}`], z));
      const hit = tq.filter((x) => cza(R.pairs[`${x.passer_id}-${x.shooter_id}`], z) > 0).length;
      return `<tr><td class="pl">${esc(fmtDate(n.id))}</td><td>${tp.length}</td><td>${f1(pp)}</td><td><b>${pa}</b></td><td>${tq.length}</td><td>${f1(qp)}</td><td><b>${qa}</b></td><td>${tq.length ? pct(hit / tq.length, 0) : "–"}</td></tr>`;

  function howCombosHTML() {
    return `<section class="card"><header><h3>How 3PT Combos work</h3></header>
      <div class="cap" style="padding:0 16px 14px;line-height:1.55">
      <p><b>Zones.</b> Every made basket in the play-by-play is placed by its court location. A corner 3 is a three at least 22 feet to the side and within about 9 feet of the hoop's depth (the straight part of the arc); every other three is above the break. These are the same zones the assists board uses.</p>
      <p><b>Threes allowed.</b> For each defense: 3-point attempts, makes and assisted makes allowed per game, by zone. This season is blended with last, with this season weighted by games / (games + 25), the same as the assists board's team side. Ranked 1–30, 1st allows the most.</p>
      <p><b>Passers.</b> Projected 3PT assists in a zone = his assists projection before the matchup (projected minutes × assist rate × pace × injuries) × his share of assists that go to that zone (blended toward the league mix by 40 assists' worth) × a zone factor. The zone factor compares the defense's assisted makes allowed in that zone per 100 possessions with the league average, scaled by how reliable that stat is across teams (about 0.7 for corner 3s, 0.8 above the break).</p>
      <p><b>Combos.</b> Each passer's projected 3PT assists in a zone are split among the teammates on tonight's 3PM board, by how often he has assisted each of them on threes from that zone (this season, plus last season at 80% while they were teammates). Each share is blended toward the shooter's share of the available shooters' made threes from that zone, by 8 assists' worth, so new teammates still get a fair split. Players out or doubtful aren't on the 3PM board, so their share goes to everyone else.</p>
      <p><b>Locking and results.</b> Each game's combos lock at tip with the rest of the board. After grading, actual assisted 3s by passer and by pair come from that night's play-by-play.</p></div></section>`;

    all.forEach((x) => by[x.r.grade] && by[x.r.grade].push(x));

        <td class="h" style="background:${arr.length ? heat(0.5 + Math.max(-1, Math.min(1, diff / 0.4)) * 0.5) : "transparent"}">${arr.length ? sgnN(diff) : "–"}</td></tr>`;

    const nightRows = graded.map((n) => {
      const xs = (n.rows || []).map((r) => ({ r, a: act(n, r) })).filter((x) => x.a);
      const top = xs.slice().sort((x, y) => y.r.proj_3pm - x.r.proj_3pm).slice(0, 10);

        <td class="gs">${f1(proj)}</td><td>${f1(made)}</td><td class="mut">${sgn(proj ? made / proj - 1 : NaN)}</td>
        <td class="gs">${f2(avg(top, (x) => x.r.proj_3pm))}</td><td>${f2(avg(top, (x) => x.a.fg3m))}</td></tr>`;
    }).join("");
    return `<section class="card"><header><h3>By matchup grade</h3><span class="eyebrow">${all.length} player-games · ${graded.length} nights</span></header>
      <p class="cap"><b>Beat normal</b> is actual makes minus the player's normal projection. A working model shows it rising from F to A+. Expect noise until there are a few hundred player-games.</p>
      <div class="scroll"><table><thead><tr><th class="pl">Grade</th><th>Players</th><th>Normal</th><th>Projected</th><th class="gs">Actual</th><th>Beat normal</th></tr></thead><tbody>${gradeRows}</tbody></table></div></section>
      <section class="card"><header><h3>Night by night</h3></header>
      <div class="scroll"><table><thead><tr><th class="pl">Night</th><th>Games</th><th>Graded</th><th class="gs">Projected 3PM</th><th>Actual 3PM</th><th>Diff</th><th class="gs">Top 10 proj</th><th>Top 10 actual</th></tr></thead><tbody>${nightRows}</tbody></table></div></section>`;

  // ----- Defenses tab -----
  const DCOLS = [
    { k: "boost", h: "Matchup", t: "How this defense moves a typical shooter's made threes", fmt: (v) => sgn(v), dirGood: 1 },
    { k: "opp3a_100", h: "3PA allowed", t: "Threes opponents attempt per 100 possessions", fmt: f1, dirGood: 1 },
    { k: "wide_open_share", h: "Wide open", t: "Share of threes allowed with no defender within 6 feet", fmt: (v) => pct(v), dirGood: 1 },
    { k: "corner_100", h: "Corner 3PA", t: "Corner threes allowed per 100 possessions", fmt: f1, dirGood: 1 },
    { k: "pace", h: "Pace", t: "Possessions per 48 minutes", fmt: f1, dirGood: 1 },
    { k: "opp_3p_pct", h: "Opp 3P%", t: "Opponents' three-point percentage (mostly luck; shown for reference)", fmt: (v) => pct(v), dirGood: 0 },
    { k: "def_rating", h: "Def rtg", t: "Points allowed per 100 possessions", fmt: f1, dirGood: 0 },

  function defenseHTML() {
    const d = state.defense;
    if (!d || !d.teams) return `<section class="card"><header><h3>Defenses</h3></header><div class="empty"><p>Defense profiles load after the first data pull.</p></div></section>`;

    };

      const cells = DCOLS.map((c, i) => {
        const [lo, hi] = ranges[c.k];
        const tt = hi > lo ? (t[c.k] - lo) / (hi - lo) : 0.5;

        const style = colored ? ` style="background:${heat(c.k === "boost" ? boostT(t.boost) : tt)}"` : "";

      <p class="cap">How each defense treats a typical shooter: one who takes about two-thirds of his threes off the catch, with an average corner share. Green cells help shooters. Opponent 3P% is greyed out because it is mostly luck and the model doesn't use it; the wide-open share captures what a defense actually controls.</p>
      <div class="scroll"><table><thead><tr><th class="mut" style="padding-left:16px;text-align:left">#</th>${th("team_name", "Defense", "pl")}<th>Grade</th>${DCOLS.map((c, i) => th(c.k, c.h, i === 0 ? "gs" : "", c.t)).join("")}</tr></thead><tbody>${body}</tbody></table></div>
      ${m.data_as_of ? `<p class="cap" style="padding:10px 16px 12px">Data pulled ${esc(m.data_as_of)}. ${esc(m.blend_note || "")}</p>` : ""}</section>`;

  // ----- Archetypes: the kind of player each defense is built to lose to, and who fits -----
  // One document per night (arch/<date>), loaded on demand like combos.
  function archFor(n) {
    if (!n || !(n.arch_games || []).length) return null;
    state.arch = state.arch || {};
    if (!(n.id in state.arch)) {
      state.arch[n.id] = undefined;
      state.db.doc(`arch/${n.id}`).get().then((s) => { state.arch[n.id] = s.exists ? s.data() : null; render(); },
        () => { state.arch[n.id] = null; render(); });
    }
    return state.arch[n.id];
  }
  const archLbl = (A, id) => ((A.archetypes || []).find((a) => a.id === id) || {}).label || id;
  const archRec = (A, id) => ((A.archetypes || []).find((a) => a.id === id) || {}).recipe || [];
  const isPT = (f) => f.startsWith("pt_");
  // a defense's number for one ingredient: FREQ% allowed · FGM allowed per game (league ranks)
  const archDefFreq = (f, v) => (f === "drive" ? `${f1(v)} per 100 poss` : `${pct(v, 0)} of ${isPT(f) ? "poss" : "FGA"}`);
  const archShare = (f, v) => (v == null ? "–" : ["drive", "ast36", "oreb36"].includes(f) ? `${f1(v)}/36` : pct(v, 0));
  // vulnerability (z across 30 defenses) -> 0..1 for the heat scale
  const archT = (z) => 0.5 + Math.max(-1, Math.min(1, z / 2)) * 0.5;
  const archChip = (A, id, z, extra) => `<span class="achip" style="background:${heat(archT(z ?? 0))}">${esc(archLbl(A, id))}${extra || ""}</span>`;
  function archDrivers(A, t, id, k) {
    return archRec(A, id).filter(([f, w]) => w > 0 && t.f[f]).sort((a, b) => b[1] * t.f[b[0]][4] - a[1] * t.f[a[0]][4]).slice(0, k || 4)
      .map(([f]) => { const x = t.f[f]; return `<span class="adrv"><b>${esc(A.features[f] || f)}</b> ${archDefFreq(f, x[0])} <span class="dim">(${ord(x[2])})</span> · ${f1(x[1])} FGM/g <span class="dim">(${ord(x[3])})</span></span>`; }).join("");
  }
  function archHTML() {
    const n = currentNight();
    if (!n) return emptyBoard();
    const A = archFor(n);
    const intro = `<p class="cap">Each defense is scored on what it gives up, by FREQ% (how often opponents get that shot or play) and FGM per game, across the shot types, shot zones and play types that make up eight player archetypes. The archetypes a defense ranks most vulnerable to are the ones it's <b>built to lose to</b>; below each, tonight's opposing players ranked by how well they fit. This season's games only.</p>`;
    const head = (body) => `<section class="card"><header><h3>Archetypes${allG() ? "" : ": " + esc(selLabel())}</h3></header>${intro}${body || ""}</section>`;
    if (A === undefined) return head(`<div class="empty"><p>Loading archetypes…</p></div>`);
    if (!A) return head(`<div class="empty"><p>Archetypes start with the next board build. Games locked before then don't have them.</p></div>`);
    const graded = !!n.results;
    const gameOf = (x) => (n.games || []).find((g) => g.game === x.game);
    const prevTag = (x) => (gameLocked(n, gameOf(x)) ? "" : ` <span class="dim">· preview</span>`);

    const projPts = (pid) => { const v = (n.pts_index || {})[pid]; return v ? `${f1(v[0])} <span class="dim">${esc(v[1] || "")}</span>` : `<span class="dim">–</span>`; };
    const res = (p) => {
      if (!graded) return "";

    if (!games.length) return head(`<div class="empty"><p>No archetypes ${allG() ? "tonight" : inThese()} (games locked before archetypes existed don't have them).</p></div>`);

    // best fits across the slate

        <td class="l">${archChip(A, b.arch, da[0])}</td><td class="bar gs" style="--w:${Math.round(b.score)}"><b>${Math.round(b.score)}</b></td>
        <td>${p.fit[b.arch] ?? "–"}</td><td>${tpill(b.def, 1)} <span class="dim">${ord(da[1])}</span></td><td>${projPts(p.player_id)}</td>${res(p)}</tr>`;

    const bestCard = `<section class="card"><header><h3>Best fits tonight</h3><span class="eyebrow">${best.length} players</span></header>

      ${best.length ? `<div class="scroll"><table><thead><tr><th class="mut" style="padding-left:16px;text-align:left">#</th><th class="pl">Player</th><th class="l">Archetype</th><th class="gs" title="Fit x defense vulnerability, 0-100">Match</th><th title="Percentile among rotation players">Fit</th><th title="Defense's rank vs this archetype">Defense</th><th>PTS</th>${graded ? "<th>Result</th>" : ""}</tr></thead><tbody>${bestRows}</tbody></table></div>${moreBtn("arch:best", best.length, "players")}` : `<div class="empty"><p>No one projected for ${A.min_minutes || 18}+ minutes ${allG() ? "tonight" : inThese()}.</p></div>`}</section>`;
    // by defense, most exploitable first
    const topZ = (g) => ((A.teams[g.def] || { a: {} }).a[g.order[0]] || [0])[0];
    state.archSel = state.archSel || {};
    const blocks = games.slice().sort((a, b) => topZ(b) - topZ(a)).map((g) => {
      const t = A.teams[g.def];
      if (!t) return "";
      const sel = g.order.includes(state.archSel[g.def]) ? state.archSel[g.def] : g.order[0];
      const outs = outOf(g.off);
      const byId = Object.fromEntries(g.players.map((p) => [p.player_id, p]));
      const ps = (g.by[sel] || []).map((id) => byId[id]).filter((p) => p && !outs.includes(String(p.player_id)));
      const rec = archRec(A, sel).filter(([, w]) => w > 0).map(([f]) => f).filter((f) => f in (A.features || {}));
      const style = (p) => rec.slice(0, 4).map((f) => `<span class="dim">${esc(A.features[f])}</span> ${archShare(f, p.sh[f])}`).join(" · ");
      const btns = g.order.map((id, i) => { const a = t.a[id]; return `<button type="button" class="abtn${id === sel ? " on" : ""}" data-arch="${esc(g.def)}|${id}" aria-pressed="${id === sel}" style="--ah:${heat(archT(a[0]))}">${i < 2 ? "★ " : ""}${esc(archLbl(A, id))} <span class="dim">${ord(a[1])}</span></button>`; }).join("");
      const pk = `arch:${g.def}:${sel}`;
      const rows = funSlice(pk, ps).map((p) => `<tr><td class="pl">${pbtn(p.player_id, p.player)}${p.q ? `<span class="flag">Questionable</span>` : ""}<small>${f1(p.min)} min · ${f1(p.ppg)} ppg · ${f1(p.fga)} FGA</small></td>
        <td class="bar gs" style="--w:${p.fit[sel] ?? 0}"><b>${p.fit[sel] ?? "–"}</b></td>
        <td class="l">${p.primary === sel ? `<span class="dim">Same</span>` : esc(archLbl(A, p.primary))}</td>

      <div class="prose">
        <p class="formula">Projected 3PM = minutes × attempt rate × defense volume × pace × adjusted 3P%</p>
        <h4>Attempts</h4>
        <ul>
          <li><b>Minutes and attempt rate</b> are the player's own: threes per minute, at his projected minutes. Minutes come mostly from this season's games, recent games counting most, with last season worth about one game. Games where a teammate regular sat are adjusted for the minutes that freed up, so when that teammate is back his teammates' minutes come down, and when he's out tonight the injury step adds them back. A healthy player who hasn't appeared this season drifts toward zero. On this season's games so far this cut the average minutes miss from 6.2 to 4.9.</li>
          <li><b>Team minutes budget.</b> A game has about 241 player-minutes per team, but a deep roster's normal minutes add up to far more (260 to 385 this preseason). The excess is trimmed almost entirely from the bench: a 15-minute player gives up about eight times as many minutes as a 30-minute starter. This applies to every stat. On opening night, without it, projected minutes ran about 4 per player too high.</li>
          <li><b>Team scoring cap (points and assists).</b> A roster's normal points and assists can add up to more than one team produces, because new teammates bring usage from old roles and rookies take shots of their own. When that happens, every player's points (or assists) come down by the same share until the team total matches what the team is expected to score: its per-game output this season, blended early on with a prior halfway between last season's number and the league average. This season's results take over as games pile up. On the first four nights it cut the points overprojection about in half.</li>
          <li><b>Defense volume</b> uses how many threes the opponent allows per 100 possessions, split into corner and above-the-break, weighted by where this shooter takes his threes. 80% of a defense's lean is credited, the share last season's games supported.</li>
          <li><b>Pace</b> scales attempts by how fast the opponent plays relative to the league.</li>
        </ul>
        <h4>Percentage</h4>
        <ul>
          <li><b>Starting 3P%</b> is the player's percentage pulled toward league average (36%) by 250 attempts, since three-point shooting is noisy in small samples.</li>
          <li><b>Openness:</b> NBA tracking splits every three by the closest defender's distance. League-wide, wide-open threes (6+ feet) go in about 38% of the time, open ones (4–6 feet) 34%, and contested ones 32%. A defense that allows more wide-open looks shifts the shooter's mix toward them. The shift is scaled by his catch-and-shoot share: spot-up shooters gain most from a leaky defense, while pull-up shooters create their own looks.</li>
          <li><b>Corners:</b> corner threes go in about 39% of the time versus 35% above the break, so a defense that gives up corners nudges percentage up as well.</li>
        </ul>
        <h4>Teammates out</h4>
        <p>When a teammate is ruled out before the lock, his minutes go to the rest of the rotation, weighted toward players with room to play more, with 15% of them set aside for teammates who share his position (G, F or C), and the team takes back about 70% of the threes it would have lost. Last season, when a center sat, the other center's minutes and rebounds rose about twice as much as the rest of the rotation's; at guard and forward position barely mattered. That estimate is then calibrated to what actually happened across 2,507 teammate pairs last season, which sets who picks up the slack. The team total is pinned to what teams actually recovered when a rotation player sat: nearly all of his minutes and three-point attempts, and about 95% of his points and assists.</p>
        <p>Each pair's own with/without split is blended in too, but lightly (50 games apart counts as half), because last season showed those splits are mostly game-to-game noise beyond the calibrated estimate. The matchup grade ignores injuries, so it still measures the defense alone. Click any player to try what-if scenarios; they never change the board.</p>
        <h4>Grades</h4>
        <p>The grade measures how much tonight's matchup moves a player, in the stat itself: extra made threes (or points, assists, rebounds) over his normal output, not a percentage. A soft defense lifts a 7-attempt shooter by far more makes than a 2-attempt one, so only real volume earns a high grade.</p>
        <p>Every projected player gets a grade. Players with a proven role are marked as such: at least 20 games last season and enough projected minutes and volume (threes: 4 attempts, 22 minutes, 150 tracked attempts; points: 11 a game; assists: 2.5; rebounds: 4.2 with 20 minutes). Grades for everyone else are faded, since a small role or sample makes them less reliable; hover for the reason. The <b>Proven volume</b> filter and the <b>Top grades</b> tab show only proven players.</p>
        <p>Cutoffs come from every graded player against every defense last season: A+ is the best 5% of matchups, A the next 7%, B the next 18%, C the middle 40%, D the next 18%, and F the bottom 12%. For threes, an A+ is worth about 0.19 extra makes or more; for points about 1.2, assists 0.43, rebounds 0.48. Nights before Oct 21 were graded on the older percentage scale.</p>
        <h4>C&amp;S / Pull-up, Areas, Pace &amp; 3PA, Defenders, Hit rates, Volume</h4>
        <p>The 3PM tab's other views are lenses on the same board, not separate projections. <b>Areas</b> ranks each defense by threes allowed per game from the corners, wings and top, and ranks shooters by Spot fit: his threes per game from each spot times how much more or less his defense allows there than the league. <b>C&amp;S / Pull-up</b> ranks defenses by catch-and-shoot or pull-up threes allowed and lists the shooters on the other side who take them. <b>Pace &amp; 3PA</b> shows how many threes each defense allows and what the pace and defense-volume adjustments add to each shooter. <b>Defenders</b> uses NBA.com's who-guarded-whom tracking to show each shooter's likely defender and how many threes that defender gives up. <b>Hit rates</b> shows how often each shooter has cleared a 3PM line this season, in his last 10 and 5, and against tonight's opponent, next to the model's chance. <b>Volume</b> shows the extra attempts each shooter gets from teammates out tonight, or would get if questionable teammates sit, using the injury math below. All of them use this season's games and follow your what-ifs.</p>
        <h4>Early season</h4>
        <p>Every rate comes from 2026-27 games only; 2025-26 stats aren't used. Early in the season that means small samples, so a player needs half as many games as the busiest player in the league (at least 3, up to 10) to make the board.</p>
        <h4>Locking and grading</h4>
        <p>Each game locks on its own, shortly before its tip-off, and its ratings never change afterward. Until then it's a preview that picks up injury and lineup news, so a late scratch in a 9:30 game still counts even if the 7:00 games are already locked. News after a game locks doesn't alter it, so the Results sheet is a fair test. Players ruled out before the lock are left off the board and their teammates' projections are adjusted; questionable players are flagged and assumed to play.</p>
        <h4>What it doesn't know</h4>
        <ul>
          <li>Rookies and players with fewer than 10 NBA games, until they build a sample.</li>
          <li>Individual defensive assignments, and game script such as blowouts that cut starters' minutes.</li>
        </ul>
      </div></section>`;

    const tot = { min: [0, 0], p3: [0, 0], pts: [0, 0], ast: [0, 0], reb: [0, 0] };
    const rows = ctx.rotation.map((pid) => {
      const p = pl[pid] || {}, name = p.name || pid, isOut = P.out.includes(pid), wasOut = P.locked.includes(pid);
      const normal = {
        min: ctx.min[pid],
        p3: ctx.min[pid] * ctx.rate[pid] * (p.talent_pct || 0.36),
        pts: ctx.rate_pts ? ctx.min[pid] * ctx.rate_pts[pid] : NaN,
        ast: hasAst ? ctx.min[pid] * ctx.rate_ast[pid] : NaN,
        reb: hasReb ? ctx.min[pid] * ctx.rate_reb[pid] : NaN,
      };
      const lk = { pa: ratio(pid, P.locked, "pa"), pts: ratio(pid, P.locked, "pts"), ast: hasAst ? ratio(pid, P.locked, "ast") : [1, 1], reb: hasReb ? ratio(pid, P.locked, "reb") : [1, 1] };
      const nw = { pa: ratio(pid, P.out, "pa"), pts: ratio(pid, P.out, "pts"), ast: hasAst ? ratio(pid, P.out, "ast") : [1, 1], reb: hasReb ? ratio(pid, P.out, "reb") : [1, 1] };
      // starting point: tonight's locked board where he's on it, else his normal output under the locked injuries
      const base = {
        min: r3[pid] ? r3[pid].min : rP[pid] ? rP[pid].min : normal.min * lk.pts[0],
        p3: r3[pid] ? r3[pid].proj_3pm : normal.p3 * lk.pa[1],
        pts: rP[pid] ? rP[pid].proj_pts : normal.pts * lk.pts[1],
        ast: rA[pid] ? rA[pid].proj_ast : normal.ast * lk.ast[1],
        reb: rR[pid] ? rR[pid].proj_reb : normal.reb * lk.reb[1],
      };
      if (wasOut) { base.min = 0; base.p3 = 0; base.pts = 0; base.ast = 0; base.reb = 0; }
      const back = wasOut && !isOut;
      const now = isOut ? { min: 0, p3: 0, pts: 0, ast: 0, reb: 0 } : back
        ? { min: normal.min * nw.pts[0], p3: normal.p3 * nw.pa[1], pts: normal.pts * nw.pts[1], ast: normal.ast * nw.ast[1], reb: normal.reb * nw.reb[1] }
        : { min: base.min * nw.pts[0] / lk.pts[0], p3: base.p3 * nw.pa[1] / lk.pa[1], pts: base.pts * nw.pts[1] / lk.pts[1], ast: base.ast * nw.ast[1] / lk.ast[1], reb: base.reb * nw.reb[1] / lk.reb[1] };
      Object.keys(tot).forEach((k) => { if (!isNaN(base[k])) tot[k][0] += base[k]; if (!isNaN(now[k])) tot[k][1] += now[k]; });
      return `<tr class="${isOut ? "isout" : ""}"><td class="ck"><input type="checkbox" data-tout="${esc(pid)}"${isOut ? " checked" : ""} aria-label="${esc(name)} out"></td>
        <td class="pl">${r3[pid] || rP[pid] || rA[pid] || rR[pid] ? `<button type="button" class="link" data-player="${esc(pid)}" data-from-team="1">${esc(name)}</button>` : esc(name)}${wasOut ? `<span class="flag">Out tonight</span>` : ""}${qBtn(n, P.team, pid, name)}</td>
        ${isOut ? `<td class="mut" colspan="5">Out</td>` : cell(base.min, now.min, 1, true) + cell(base.p3, now.p3, 2, true) + cell(base.pts, now.pts, 1, true) + (hasAst ? cell(base.ast, now.ast, 1, true) : `<td class="mut">–</td>`) + (hasReb ? cell(base.reb, now.reb, 1, true) : `<td class="mut">–</td>`)}</tr>`;
    }).join("");
    const net = (k, dg) => { const v = tot[k][1] - tot[k][0]; return Math.abs(v) < (dg ? 0.05 : 0.5) ? `<td class="mut">0</td>` : `<td class="${v > 0 ? "up" : "dn"}">${v > 0 ? "+" : "−"}${Math.abs(v).toFixed(dg)}</td>`; };
    const totRow = changed ? `<tr class="tot"><td></td><td class="pl">Team net change<small style="font-weight:400;color:var(--ink-3)">Teams recover nearly all lost minutes and threes, about 97% of rebounds and 95% of points and assists</small></td>${net("min", 0)}${net("p3", 1)}${net("pts", 1)}${hasAst ? net("ast", 1) : `<td class="mut">–</td>`}${hasReb ? net("reb", 1) : `<td class="mut">–</td>`}</tr>` : "";
    return `<section class="card"><header><h3>${esc(td.team_name || P.team)}: who's out?</h3><span class="eyebrow">${sub}</span></header>
        <p class="cap">Check players to sit them. <b>Flag Q</b> adds a player to the Questionable tab so you can set him in or out later without coming back to this team. Everyone else's minutes, threes, points, assists, and rebounds update using the same calibrated redistribution the board uses. ${g ? "Numbers start from tonight's locked board" + (P.locked.length ? ", which already has the checked players out" : "") + "." : "Numbers are each player's normal per-game output."} The board itself never changes.</p>
        <div class="scroll ptab ttab"><table><thead><tr><th class="ck">Out</th><th class="pl">Player</th><th>Min</th><th>3PM</th><th>PTS</th><th>AST</th><th>REB</th></tr></thead><tbody>${rows}${totRow}</tbody></table></div>
        <div class="prow"><span>${changed ? `What-if: ${P.out.length} out.` : "Changes show next to each number."}</span><button type="button" class="btn" data-injreset${changed ? "" : " disabled"}>Reset</button></div>
      </section>`;
  }
  function closePanel() {
    state.panel = null;
    $("#scrim").hidden = true; $("#panel").hidden = true; $("#panel").innerHTML = "";
    document.body.style.overflow = "";
    if (lastTrigger && document.contains(lastTrigger)) lastTrigger.focus();
  }
  const d3 = (x) => (Math.abs(x) < 0.005 ? `<b class="flat">0.00</b>` : `<b class="${x > 0 ? "up" : "dn"}">${x > 0 ? "+" : "−"}${Math.abs(x).toFixed(2)}</b>`);
  // Questionable teammates: how much this player's number would move if each one sits, on top
  // of whoever is already out. Listed questionable on the report or flagged by you, and not
  // confirmed either way. Shown under the projection; it never changes the projection itself.
  function qSitSteps(P, team, ctx, stat, fin, minsNow, dg) {
    const n = state.nights.find((x) => x.id === P.nightId);
    const rk = INJ_KEYS[stat][0];
    if (!n || !ctx || !ctx[rk] || !Object.keys(ctx[rk]).length || teamLocked(n, team)) return "";
    const td = state.teamDocs[team], pl = (td && td.players) || {}, inj = (n.injuries || {})[team] || [];
    const mine = (EDITS[n.id] || {}).q || {}, why = {};
    inj.forEach((x) => { if (reportOf(n, team, x.player_id) === "questionable") why[String(x.player_id)] = "Questionable"; });
    Object.entries(mine).forEach(([pid, v]) => { if (v && v.team === team && !why[pid]) why[String(pid)] = "Flagged by you"; });
    const qs = Object.keys(why).filter((q) => q !== P.pid && !P.out.includes(q) && !callOf(n, q) && ctx.min[q] != null);
    if (!qs.length) return "";
    const [m1, p1] = injuryRatios(ctx, P.pid, P.out, stat), thr = dg === 2 ? 0.005 : 0.05;
    const rows = qs.map((q) => {
      const [m2, p2] = injuryRatios(ctx, P.pid, [...P.out, q], stat);
      const d = fin * (p2 / p1 - 1), dm = minsNow * (m2 / m1 - 1);
      const name = (pl[q] || {}).name || (inj.find((x) => String(x.player_id) === q) || {}).player || "Teammate";
      const val = Math.abs(d) < thr ? `<b class="flat">0</b>` : `<b class="${d > 0 ? "up" : "dn"}">${d > 0 ? "+" : "−"}${Math.abs(d).toFixed(dg)}</b>`;
      return `<div class="step qsit"><span>If ${esc(name)} sits<small>${why[q]}${Math.abs(dm) >= 0.1 ? ` · ${dm > 0 ? "+" : "−"}${Math.abs(dm).toFixed(1)} min for him` : ""}</small></span>${val}</div>`;
    });
    return `<div class="step qhead"><span>Questionable teammates</span></div>${rows.join("")}`;
  }
  function renderPanel() {
    const P = state.panel; if (!P) return;
    if (P.kind === "team") { $("#panel").innerHTML = teamDefenseHTML(P.team); return; }
    if (P.stat === "pts") { renderPanelPts(P); return; }
    if (P.stat === "ast") { renderPanelAst(P); return; }
    if (P.stat === "reb") { renderPanelReb(P); return; }
    if (P.stat === "pra") { renderPanelPra(P); return; }
    const n = state.nights.find((x) => x.id === P.nightId);
    const r = rowFor(P.nightId, P.pid);
    if (!n || !r) { closePanel(); return; }
    const td = state.teamDocs[r.team];
    const prof = td && td.players ? td.players[P.pid] : null;
    const ctx = td && td.inj ? td.inj : null;
    const names = {}; if (td && td.players) Object.entries(td.players).forEach(([k, v]) => (names[k] = v.name));
    const nm = (id) => names[id] || "Teammate";

    // projection steps (same order as the model)
    const pct0 = r.talent_pct, pa0 = r.base_pa;
    const A0 = pa0 * pct0;
    const A1 = A0 * r.f_pace;
    const hasD3 = !!(r.diet3 && r.f_diet != null && state.meta && state.meta.diet && (state.meta.diet.w3_vol || state.meta.diet.w3_pct));
    const fv0 = hasD3 ? r.f_vol - (r.f_diet - 1) : r.f_vol;
    const A2 = A1 * fv0;
    const A3 = pa0 * r.f_pace * fv0 * (pct0 + r.d_open);
    const A4p = pa0 * r.f_pace * fv0 * (pct0 + r.d_open + r.d_zone);
    const A4 = pa0 * r.f_pace * r.f_vol * (pct0 + r.d_open + r.d_zone + (hasD3 ? r.d_diet : 0));
    let mr = r.inj_min ?? 1, pr = r.inj_pa ?? 1, notes = [];
    const changed = P.out.slice().sort().join() !== P.locked.slice().sort().join();
    if (ctx && (changed || P.out.length)) { [mr, pr, notes] = injuryRatios(ctx, P.pid, P.out, "pa"); }
    const A5 = A4 * pr;
    const minsNow = (r.base_min ?? r.min) * mr;
    const MF = minFactor(P, minsNow), BEFORE = A5, FIN = A5 * MF, adj = changed || MF !== 1;
    const pa = pa0 * pr * r.f_vol * r.f_pace * MF;
    const lockedPm = r.proj_3pm;
    const loc = r.home ? "vs" : "@";

    const steps = `
      <div class="step"><span>Normal output<small>${f1(r.base_min ?? r.min)} min · ${f1(pa0)} 3PA · ${pct(pct0)} model 3P%${r.f_team && Math.abs(r.f_team - 1) > 0.002 ? ` · ${sgn(r.f_team - 1)} for his new team's pace` : ""}${minTrim(r)}</small></span><b>${f2(A0)}</b></div>
      <div class="step"><span>Pace<small>${esc(r.opp)} plays ${sgn(r.f_pace - 1)} vs league pace</small></span>${d3(A1 - A0)}</div>
      <div class="step"><span>Threes the defense allows<small>Corner and above-the-break volume, weighted to his shot spots</small></span>${d3(A2 - A1)}</div>
      <div class="step"><span>How open the looks are<small>Scaled by his ${pct(r.cs_share, 0)} catch-and-shoot share</small></span>${d3(A3 - A2)}</div>
      <div class="step"><span>Corner threes<small>${pct(r.corner_share, 0)} of his threes come from the corners</small></span>${d3(A4p - A3)}</div>
      ${!hasD3 && r.diet3 ? `<div class="step"><span>Catch-and-shoot vs pull-up<small>${pct(r.diet3.cs3, 0)} of his threes are catch-and-shoot · ${esc(r.opp)} allows ${sgn(r.diet3.rc - 1)} catch-and-shoot and ${sgn(r.diet3.ru - 1)} pull-up threes vs league. Context only: already captured by the volume step.</small></span><span class="dim">—</span></div>` : ""}
      ${hasD3 ? `<div class="step"><span>Catch-and-shoot vs pull-up<small>${pct(r.diet3.cs3, 0)} of his threes are catch-and-shoot · ${esc(r.opp)} allows ${sgn(r.diet3.rc - 1)} catch-and-shoot and ${sgn(r.diet3.ru - 1)} pull-up threes vs league</small></span>${d3(A4 - A4p)}</div>` : ""}
      <div class="step"><span>Teammates out<small>${P.out.length ? esc(P.out.map(nm).join(", ")) : "Nobody"}${changed ? " (what-if)" : ""}</small></span>${d3(A5 - A4)}</div>
      ${MF !== 1 ? `<div class="step"><span>Your minutes<small>${f1(minsNow)} → ${f1(minsNow * MF)} min</small></span>${d3(FIN - BEFORE)}</div>` : ""}
      <div class="step tot"><span>${adj ? "What-if projection" : "Tonight's projection"}</span><b>${f2(FIN)}</b></div>
      ${qSitSteps(P, r.team, ctx, "pa", FIN, minsNow, 2)}`;

    // teammate toggles
    let mates = "";
    if (td === undefined) mates = `<p class="pempty">Loading teammates…</p>`;
    else if (!ctx || !ctx.rotation.length) mates = `<p class="pempty">Teammate data isn't available for ${esc(r.team)} yet.</p>`;
    else {
      const rows = ctx.rotation.filter((id) => id !== P.pid).map((id) => {
        const single = injuryRatios(ctx, P.pid, [id], "pa");
        const eff = single[1] - 1, games = single[2][0] ? single[2][0][2] : 0;
        const on = P.out.includes(id), lk = P.locked.includes(id);
        return `<label class="mate${lk ? " locked" : ""}"><input type="checkbox" data-mate="${esc(id)}"${on ? " checked" : ""}>
          <span>${esc(nm(id))}<small>${f1(ctx.min[id])} min${games ? ` · ${games} games without him` : ""}</small></span>
          <em class="${eff > 0.005 ? "up" : "flat"}">${eff > 0.005 ? "+" + (eff * 100).toFixed(0) + "% 3PA" : "—"}</em></label>`;
      }).join("");
      mates = `<div class="mates">${rows}</div>
        <div class="prow"><span>${changed ? `What-if: ${f2(FIN)} vs ${f2(lockedPm)} on the board. The board itself doesn't change.` : "Check teammates to see how his projection moves if they sit."}</span>
        <button type="button" class="btn" data-reset${changed ? "" : " disabled"}>Reset</button></div>`;
    }
    const splitsNote = ctx && Object.keys(ctx.pairs || {}).length
      ? "Missing minutes and shots are redistributed, calibrated to how teams actually adjusted last season, with a light blend of how he played in games each teammate missed."
      : "Missing minutes and shots are redistributed, calibrated to how teams actually adjusted last season.";

    // profile
    let profHTML = "";
    if (prof && !prof.no_data) {
      const lm = td.league_mix || {};
      const bar = (m) => `<div class="mixbar"><i class="c" style="width:${(m.contested * 100).toFixed(1)}%"></i><i class="o" style="width:${(m.open * 100).toFixed(1)}%"></i><i class="w" style="width:${(m.wide_open * 100).toFixed(1)}%"></i></div>`;
      profHTML = `<section class="psec"><h3>Shooting profile</h3>
        <div class="prof">
          <div><b>${f1(prof.fg3a_pg)}</b><small>3PA per game</small></div>
          <div><b>${pct(prof.raw_pct)}</b><small>Actual 3P% (${prof.att} att.)</small></div>
          <div><b>${pct(prof.talent_pct)}</b><small>Model 3P%</small></div>
          <div><b>${pct(prof.cs_share, 0)}</b><small>Catch-and-shoot</small></div>
          <div><b>${pct(prof.corner_share, 0)}</b><small>From the corners</small></div>
        </div>
        <div class="mixes">
          <div class="mixrow"><span>${esc(r.player.split(" ").slice(-1)[0])}</span>${bar(prof.mix)}</div>
          ${lm.open ? `<div class="mixrow"><span>League</span>${bar(lm)}</div>` : ""}
          <div class="mixkey"><span style="--c:var(--lo)">Contested ${pct(prof.mix.contested, 0)}</span><span style="--c:var(--mid)">Open ${pct(prof.mix.open, 0)}</span><span style="--c:var(--hi)">Wide open ${pct(prof.mix.wide_open, 0)}</span></div>
        </div></section>`;
      const seasons = (prof.seasons || []).map((x) => `<tr><td>${esc(x.season)}</td><td class="l">${esc(x.team)}</td><td>${x.gp}</td><td>${f1(x.min)}</td><td>${f1(x.fg3m)}</td><td>${f1(x.fg3a)}</td><td>${pct(x.pct)}</td></tr>`).join("");
      profHTML += `<section class="psec"><h3>By season</h3><div class="scroll ptab"><table><thead><tr><th>Season</th><th class="l">Team</th><th>GP</th><th>Min</th><th>3PM</th><th>3PA</th><th>3P%</th></tr></thead><tbody>${seasons}</tbody></table></div></section>`;
      const recent = (prof.recent || []).map((g) => `<tr><td>${esc(fmtDate(g[0]))}</td><td class="l">${esc(g[1])}</td><td>${g[2]}</td><td><b>${g[3]}</b> / ${g[4]}</td></tr>`).join("");
      profHTML += `<section class="psec"><h3>Last 10 games</h3>${recent ? `<div class="scroll ptab"><table><thead><tr><th>Date</th><th class="l">Game</th><th>Min</th><th>3PM / 3PA</th></tr></thead><tbody>${recent}</tbody></table></div>` : `<p class="pempty">No games yet.</p>`}</section>`;
    } else if (td === undefined) {
      profHTML = `<section class="psec"><h3>Shooting profile</h3><p class="pempty">Loading…</p></section>`;
    }

    // board history
    const hist = state.nights.map((x) => ({ x, rr: (x.rows || []).find((y) => String(y.player_id) === P.pid) })).filter((o) => o.rr);
    const histRows = hist.map(({ x, rr }) => {
      const a = x.results ? x.results[P.pid] : null;
      return `<tr><td>${esc(fmtDate(x.id))}${!teamLocked(x, rr.opp) ? " <small style=\"color:var(--ink-3)\">preview</small>" : ""}</td><td class="l">${rr.home ? "vs" : "@"} ${esc(rr.opp)}</td><td>${gradeChip(rr.grade)}</td><td>${f2(rr.proj_3pm)}</td><td>${a ? `${a.fg3m} / ${a.fg3a}` : x.status === "graded" ? "DNP" : "–"}</td></tr>`;
    }).join("");

    $("#panel").innerHTML = `
      <div class="phead"><div><h2 id="ptitle">${esc(r.player)}</h2><div class="meta"><button type="button" class="tlink" data-team="${esc(r.team)}">${esc(r.team)}</button> ${loc} ${esc(r.opp)} · ${esc(fmtDate(n.id))}${r.tip ? " · " + esc(r.tip) : ""}</div></div>
        <button type="button" class="xbtn" data-close aria-label="Close">×</button></div>
      <div class="pin">
        <div class="big3">
          <div><b>${f2(FIN)}${adj ? `<span class="was">was ${f2(lockedPm)}</span>` : ""}</b><small>Projected 3PM · ${f1(pa)} 3PA</small></div>
          ${minutesControl(P, minsNow, MF)}
          <div><b style="display:flex;gap:8px;align-items:center">${gradeChip(r.grade, r.gate)}<span style="font-size:20px">${sgn(r.boost)}</span></b><small>Matchup</small></div>
        </div>
        <section class="psec"><h3>Made threes, last 10 games</h3>${prof ? lastTenChart(prof, "3pm", FIN) : `<p class="pempty">Loading…</p>`}</section>
        <section class="psec"><h3>Where he shoots threes</h3>${prof ? shotMapHTML(P, r, prof, td) : `<p class="pempty">Loading…</p>`}</section>
        <section class="psec"><h3>How tonight's number is built</h3><div class="steps">${steps}</div></section>
        ${historyHTML(n, r, "3pm")}${compsHTML(n, r, "3pm")}
        <section class="psec"><h3>If teammates sit</h3><p class="cap">${splitsNote}</p>${mates}</section>
        ${profHTML}
        <section class="psec"><h3>On this board</h3>${histRows ? `<div class="scroll ptab"><table><thead><tr><th>Night</th><th class="l">Opp</th><th>Grade</th><th>Proj</th><th>Actual</th></tr></thead><tbody>${histRows}</tbody></table></div>` : `<p class="pempty">First appearance.</p>`}</section>
      </div>`;
  }


  // ======================= POINTS =======================
  const ZL = { rim: "At the rim", paint: "Paint (non-rim)", mid: "Mid-range", corner3: "Corner 3", atb3: "Above-the-break 3", ft: "Free throws" };
  const PTL = { Isolation: "Isolation", PRBallHandler: "P&R ball handler", PRRollman: "P&R roll man", Postup: "Post-up", Spotup: "Spot-up", Handoff: "Handoff", Cut: "Cut", OffScreen: "Off screen", Transition: "Transition", OffRebound: "Putbacks" };
  const ZKEYS = ["rim", "paint", "mid", "corner3", "atb3"];
  const PTKEYS = Object.keys(PTL);
  const edgeT = (b, span) => 0.5 + Math.max(-1, Math.min(1, b / span)) * 0.5;
  const sgnPts2 = (x) => (x == null || isNaN(x) ? "–" : Math.abs(x) < 0.005 ? "0.00" : (x > 0 ? "+" : "−") + Math.abs(x).toFixed(2));
  const sgnPts = (x) => (x == null || isNaN(x) ? "–" : Math.abs(x) < 0.05 ? "0.0" : (x > 0 ? "+" : "−") + Math.abs(x).toFixed(1));

  function ptsRows(n) { return n ? state.pts[n.id] : null; }
  // The full why: every piece of tonight's matchup in points, with the numbers behind it

  const whyPts = (x) => `${x >= 0 ? "+" : "−"}${Math.abs(x).toFixed(1)}`;
  const whyList = (r) => `<ul class="whylist">${(r.why || []).map(([, l, v, t]) => `<li><span>${esc(l)}</span><b class="${v > 0 ? "up" : v < 0 ? "dn" : "flat"}">${whyPts(v)}</b><span>${esc(t)}</span></li>`).join("")}</ul>`;
  const whyBlock = (r) => `${r.why_sum ? `<p class="whysum">${esc(r.why_sum)}</p>` : ""}${(r.why || []).length ? whyList(r) : ""}<p class="cap" style="padding:8px 0 0">Points are what each piece adds to (or takes off) tonight's projection, on top of his normal ${f1(r.base_pts)}. Volume is how often he should get those looks against this defense; efficiency is how well he should convert them.</p>`;
  const whyCell = (r) => {
    if (!(r.why || []).length) return `<td class="why">${esc(r.drivers || "Neutral matchup")}</td>`;
    const open = !!(state.pwhy && state.pwhy[r.player_id]);
    const top = r.why.slice(0, 3).map(([, l, v]) => `${esc(l)} <b class="${v > 0 ? "up" : "dn"}">${whyPts(v)}</b>`).join(" · ");
    return `<td class="why"><button type="button" class="whyb" data-pwhy="${r.player_id}" aria-expanded="${open}">${top} <span class="whymore">${open ? "less ▴" : "why ▾"}</span></button></td>`;
  };

  function ptsBoardHTML() {
    const n = currentNight();
    if (!n) return emptyBoard();
    const all = ptsRows(n);
    if (all == null) return `<p class="notice">Loading points…</p>`;
    let rows = wiRows(n, all.slice(), "pts");
    if (!allG()) rows = rows.filter((r) => inSel(r.game));
    if (state.show === "best") rows = rows.filter((r) => ["A+", "A", "B"].includes(r.grade));
    else if (state.show === "proven") rows = rows.filter((r) => !r.gate && r.grade !== "–");
    const k = state.psort.key, dir = state.psort.dir === "asc" ? 1 : -1;

    ZKEYS.forEach((z) => {

  // ----- points panel -----
  function renderPanelPts(P) {

    const r = rows.find((x) => String(x.player_id) === P.pid);

    const dteam = state.defense && state.defense.pts_teams ? state.defense.pts_teams.find((t) => t.team === r.opp) : null;
    const rk = ptsRanks();

    const A0 = r.base_pts, A1 = A0 * r.f_pace, A2 = A0 * r.f_pace * (1 + r.z_edge), A3p = A0 * r.f_pace * (1 + r.z_edge + r.pt_edge), A3 = A0 * r.f_pace * (1 + r.z_edge + r.pt_edge + (hasDt ? r.dt_edge : 0)), A4 = A3 * pr;

    // teammates

    const seasons = prof && prof.seasons ? prof.seasons.map((x) => `<tr><td>${esc(x.season)}</td><td class="l">${esc(x.team)}</td><td>${x.gp}</td><td>${f1(x.min)}</td><td><b>${f1(x.pts)}</b></td></tr>`).join("") : "";

          ${ptRows ? `<p class="cap">His share of points by play type and his points per possession (possessions), against what ${esc(r.opp)} allows: points per possession and how often opponents run that play. Def rank folds both into one number the way the model weighs them (1st = most generous; hover for the parts). Edge is the net effect in points tonight.</p>

  function dietMatesHTML(P, td) {
    const keys = selArr(P, "dtsel");
    if (!keys.length) return "";
    if (td === undefined) return `<p class="pempty">Loading teammates…</p>`;
    const pl = (td && td.players) || {}, ctx = td && td.inj;
    const ids = Object.keys(pl).filter((id) => pl[id].pts && pl[id].pts.diet && (id === P.pid || (ctx && ctx.rotation.includes(id))));
    if (ids.length < 2) return `<p class="pempty">Teammates' shot types aren't in the data yet; they appear after the next board build.</p>`;
    const sum = (id) => { const d = pl[id].pts.diet; let a = 0, m = 0, sh = 0; keys.forEach((k) => { const x = d[k] || {}; a += x.fga_pg || 0; m += (x.fga_pg || 0) * (x.pct || 0); sh += x.share || 0; }); return { a, pct: a > 0 ? m / a : null, sh }; };
    const rows = ids.map((id) => ({ id, ...sum(id) })).sort((x, y) => y.a - x.a);
    const maxA = Math.max(...rows.map((x) => x.a)) || 1, teamA = rows.reduce((t, x) => t + x.a, 0) || 1;
    const lbl = keys.map((k) => DTL[k]).join(" + ");
    const body = rows.map((x, i) => `<tr${x.id === P.pid ? ' class="cur"' : ""}><td class="mut" style="text-align:left">${i + 1}</td><td class="pl">${esc(pl[x.id].name)}${P.out.includes(x.id) ? `<span class="flag">Out</span>` : ""}</td>
      <td class="bar" style="--w:${Math.round(x.a / maxA * 100)}">${f1(x.a)}</td><td><b>${pct(x.sh, 0)}</b></td><td>${pct(x.a / teamA, 0)}</td><td>${x.pct != null ? pct(x.pct, 0) : "–"}</td><td class="mut">${f1(pl[x.id].min)}</td></tr>`).join("");
    return `<p class="cap"><b>${esc(lbl)}</b> across the rotation, most attempts first: attempts per game, the share of each player's own shots they make up, his share of the team's, and FG%.</p>
      <div class="scroll ptab"><table><thead><tr><th class="mut" style="text-align:left">#</th><th class="pl">Player</th><th>FGA/g</th><th>Of his FGA</th><th>Of team's</th><th>FG%</th><th>Min</th></tr></thead><tbody>${body}</tbody></table></div>

  function howPtsHTML(m) {
    const p = m.points || {}, rel = p.zone_rel || {}, pt = p.playtypes || {};
    const ptList = Object.keys(PTL).map((k) => pt[k] ? `${PTL[k]} ${pt[k].ppp.toFixed(2)} (${pt[k].rel < 0.1 ? "noise" : "reliability " + pt[k].rel})` : "").filter(Boolean).join("; ");
    return `<section class="card"><header><h3>How the points projection works</h3>${m.model_version ? `<span class="eyebrow">Model v${esc(m.model_version)}</span>` : ""}</header>
      <div class="prose">
        <p class="formula">Projected points = minutes × scoring rate × pace × (1 + ${p.w_zone ?? 0.65} × zone edge + ${p.w_playtype ?? 1.4} × play-type edge)</p>
        <h4>Two matchup lenses</h4>
        <ul>
          <li><b>Scoring zones</b> look at where he scores: at the rim, in the paint, mid-range, corner threes, threes up top, and free throws. His shot mix leans toward zones the defense gives up more often, and his percentage in each zone moves with what the defense allows there. Threes use the 3PM model's openness effect.</li>
          <li><b>Play types</b> look at how he scores: isolation, pick-and-roll as ball handler or roll man, post-ups, spot-ups, handoffs, cuts, coming off screens, transition, and putbacks. His mix leans toward the play types the defense sees more of, and his points per possession in each move with what the defense allows.</li>
        </ul>
        <h4>Only trusting what's real</h4>
        <p>A defense's numbers mix real skill with luck. For each stat, the model measures how much of the team-to-team spread is bigger than chance and only credits that share. FG% allowed at the rim is mostly real (${rel.rim ?? 0.86}), in the paint fairly real (${rel.paint ?? 0.7}), and mid-range mostly luck (${rel.mid ?? 0.17}). Free throws allowed are real (${p.ft_rel ?? 0.89}). For play types, isolation and putback defense showed no real differences at all, so the model ignores them.</p>
        <p class="cap" style="padding:0">League points per possession and reliability by play type: ${esc(ptList)}.</p>
        <h4>How the weights were set</h4>
        <p>Both lenses were tested on 19,978 games from 2025-26: did players actually score more against the defenses each lens flagged? Both did, by clear margins (play types 1.73 ± 0.35, zones 0.81 ± 0.21, where 1.0 means the lens is exactly right). Because last season's defense numbers include those same games, the fitted weights were discounted 20%, the inflation an odd/even game split showed. Pace landed right at 1.0, as it should.</p>
        <h4>Grades</h4>
        <p>Grades come from the Matchup number (zones, play types, and pace together) turned into points: an A+ means the matchup adds about 1.2 points or more over his normal output, the best 5% of matchups last season. Scorers below 11 points a game, 22 minutes or 20 games are still graded, but their grades are faded as less reliable. Role and minutes still decide most of the ranking.</p>
        <h4>Zones, Play types, Free throws, Pace &amp; totals, Trends, Volume</h4>
        <p>The Points tab's other views break the same projection apart. <b>Zones</b>, <b>Play types</b> and <b>Free throws</b> rank each defense by what it gives up there and rank scorers by the points the model adds or takes away for that part of the matchup: the same numbers as the rows on a player's card. <b>Pace &amp; totals</b> sets each game's over/under next to both teams' pace and the board's projected points; the model uses pace, not the over/under. <b>Trends</b> compares a scorer's last 3, 5 or 10 games with his season. <b>Volume</b> shows the extra points from teammates out tonight, or if questionable teammates sit. All of them use this season's games and follow your what-ifs.</p>
        <h4>Teammates out</h4>
        <p>When a teammate is ruled out, his minutes and shots go to the rest of the rotation (15% of the minutes set aside for teammates at his position), calibrated to last season. Who gets them comes from teammate-pair data; the total is pinned to what teams actually recovered, about 95% of a missing player's points. Use the Injuries tab to sit players and see every teammate's change.</p>
      </div></section>`;
  }

    const ark = astRanks();
    const maxA = Math.max(1, ...all.map((r) => r.proj_ast || 0));
    const th = (key, label, cls = "", title = "") => {
