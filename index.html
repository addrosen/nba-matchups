<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="robots" content="noindex,nofollow">
<title>NBA Matchups</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: a press-box shooting sheet, sibling to the Receiver Matchup Board.
   Night picker on top, four tabbed sheets, every number a conditional-format cell. */
:root {
  --bg: #EEF1EE;
  --surface: #FFFFFF;
  --ink: #15201B;
  --ink-2: #48554E;
  --ink-3: #78847D;
  --line: #D6DCD7;
  --line-strong: #A9B3AC;
  --accent: #A3471B;
  --accent-soft: #F3E1D6;
  --lo: #F8696B;
  --mid: #FFEB84;
  --hi: #63BE7B;
  --cell-ink: #14191A;
  --bar: #EBCDB9;
  --lock: #17456B;
  --hi-ink: #1E7A3E;
  --lo-ink: #B4232A;
  --g-jump: #2563A8; --g-zone: #5B4BC4; --g-rim: #B85C14; --g-boards: #2E7D4F; --g-ast: #9C3D8F; --g-pt: #127A80;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101513; --surface: #19201D; --ink: #E7ECE8; --ink-2: #AEB9B2; --ink-3: #808C85;
    --line: #2C3632; --line-strong: #4A5751; --accent: #F0A57A; --accent-soft: #3A2A20;
    --lo: #DC5E61; --mid: #E4CD66; --hi: #58AE73; --cell-ink: #0F1413; --bar: #4A3324;
    --lock: #86BBE2; --hi-ink: #7BD394; --lo-ink: #F08A8C; color-scheme: dark;
    --g-jump: #6FA8E8; --g-zone: #A49AF0; --g-rim: #EDA266; --g-boards: #73C795; --g-ast: #E08AD3; --g-pt: #5FC6CC;
  }
}
:root[data-theme="dark"] {
  --bg: #101513; --surface: #19201D; --ink: #E7ECE8; --ink-2: #AEB9B2; --ink-3: #808C85;
  --line: #2C3632; --line-strong: #4A5751; --accent: #F0A57A; --accent-soft: #3A2A20;
  --lo: #DC5E61; --mid: #E4CD66; --hi: #58AE73; --cell-ink: #0F1413; --bar: #4A3324;
  --lock: #86BBE2; --hi-ink: #7BD394; --lo-ink: #F08A8C; color-scheme: dark;
  --g-jump: #6FA8E8; --g-zone: #A49AF0; --g-rim: #EDA266; --g-boards: #73C795; --g-ast: #E08AD3; --g-pt: #5FC6CC;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.45; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px 40px; display: flex; flex-direction: column; gap: 16px; }
@media (min-width: 700px) { .wrap { padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); } }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
h1 { font-size: 34px; font-weight: 700; letter-spacing: .01em; text-transform: uppercase; line-height: 1; }
.sub { margin: 6px 0 0; color: var(--ink-2); max-width: 74ch; }
.eyebrow { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.mast { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; justify-content: space-between; }
.seg.mode button { font-family: var(--display); font-size: 16px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding: 6px 16px; }
@media (max-width: 640px) { .seg.mode { flex-wrap: wrap; } .seg.mode button { font-size: 14px; padding: 6px 10px; } }
.dim { color: var(--ink-3); }
.lens { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 0; border-top: 1px solid var(--line); }
.lens > div { padding: 8px 14px 10px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.lens > div:last-child { border-right: 0; }
.lens b { font-family: var(--display); font-size: 22px; font-weight: 700; }
.lens small { color: var(--ink-2); font-size: 12px; }
/* night picker */
.picker { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
.field select { font: inherit; font-size: 16px; font-weight: 500; color: var(--ink); background: var(--bg); border: 1px solid var(--line-strong); border-radius: 4px; padding: 7px 10px; min-width: 0; max-width: 100%; }
.stamp { display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: var(--ink-2); padding-bottom: 4px; }
.lock { display: inline-flex; align-items: center; gap: 6px; font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--lock); }
.lock svg { width: 13px; height: 13px; fill: currentColor; }
.lock.preview { color: var(--accent); }
.wibar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; padding: 10px 14px; margin-bottom: 12px; border: 1px solid var(--accent); border-radius: 4px; background: color-mix(in srgb, var(--accent) 8%, var(--surface)); font-size: 14px; color: var(--ink-2); }
.wibar b { color: var(--ink); }
.wibtns { display: flex; gap: 8px; }
.gm.lk svg { width: 11px; height: 11px; fill: var(--lock); margin-right: 5px; vertical-align: -1px; }
.gms { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 320px; min-width: 0; }
.gm { font: inherit; font-size: 13px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 3px; padding: 5px 10px; cursor: pointer; white-space: nowrap; font-variant-numeric: tabular-nums; }
.gm:hover { color: var(--ink); border-color: var(--ink-3); }
.gm .ou { font-family: var(--display); font-weight: 700; font-size: 14px; color: var(--ink); margin-left: 3px; }
.gm[aria-pressed="true"] .ou { color: inherit; }
.gmn { align-self: center; font-size: 12.5px; color: var(--ink-3); padding-left: 2px; }
.gm[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }

/* tabs + key */
.bar { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button { font-family: var(--display); font-size: 17px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); background: transparent; border: 1px solid transparent; border-bottom: 3px solid transparent; padding: 6px 12px; cursor: pointer; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.key { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; font-size: 13px; color: var(--ink-2); }
.scale { display: flex; align-items: center; gap: 8px; }
.scale i { display: block; width: 120px; height: 12px; border-radius: 2px; background: linear-gradient(90deg, var(--lo), var(--mid), var(--hi)); }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 3px; overflow: hidden; }
.seg button { font: inherit; font-size: 13px; padding: 4px 10px; background: var(--surface); color: var(--ink-2); border: 0; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }

/* cards + tables */
#view { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; min-width: 0; display: flex; flex-direction: column; }
.card > header { padding: 12px 16px 8px; display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; justify-content: space-between; }
.card h3 { font-size: 21px; font-weight: 600; text-transform: uppercase; letter-spacing: .02em; }
.cap { color: var(--ink-2); font-size: 13px; margin: 0; max-width: 86ch; }
.card > .cap { padding: 0 16px 10px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 0 16px 10px; font-size: 13px; color: var(--ink-2); }
.scroll { overflow-x: auto; min-width: 0; }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 7px; text-align: right; white-space: nowrap; }
thead th { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); border-bottom: 1px solid var(--line-strong); vertical-align: bottom; background: var(--surface); }
tbody td { border-bottom: 1px solid var(--line); }
tbody tr:last-child td { border-bottom: 0; }
th.l, td.l { text-align: left; }
th.pl, td.pl { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; padding-left: 16px; }
td.pl { font-weight: 600; }
td.pl small { display: block; font-weight: 400; color: var(--ink-3); font-size: 12px; }
td.rk { color: var(--ink-3); font-size: 12.5px; padding-left: 16px; text-align: left; width: 1%; }
td.rk + td.pl { padding-left: 4px; }
td.h { color: var(--cell-ink); font-weight: 500; box-shadow: inset 0 0 0 1px var(--surface); border-bottom-color: transparent; }
td.mut, th.mut { color: var(--ink-3); }
td.why { text-align: left; color: var(--ink-2); white-space: normal; min-width: 190px; max-width: 280px; font-size: 12.5px; line-height: 1.35; }
td.share { background-image: linear-gradient(90deg, var(--bar) calc(var(--w) * 1%), transparent 0); font-weight: 600; }
.gs { border-left: 2px solid var(--line-strong); }
.g { display: inline-block; min-width: 30px; text-align: center; font-family: var(--display); font-weight: 700; font-size: 15px; padding: 1px 6px; border-radius: 3px; color: var(--cell-ink); }
.g.lv { opacity: .5; box-shadow: inset 0 0 0 1px var(--line-strong); cursor: help; }
.g.ng { background: transparent; color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--line-strong); cursor: help; }
.fcat { border-left: 6px solid var(--gc); scroll-margin-top: 12px; }
button.fgrp { border: 0; cursor: pointer; font-size: 13px; padding: 5px 10px; }
button.fgrp:hover { filter: brightness(1.12); text-decoration: underline; }
button.fcatlink { font-family: inherit; font-size: 12.5px; font-weight: 500; color: var(--ink); background: var(--surface); border: 1px solid color-mix(in srgb, var(--gc) 45%, transparent); border-left: 4px solid var(--gc); border-radius: 3px; padding: 4px 9px; cursor: pointer; line-height: 1.3; }
button.fcatlink:hover { background: color-mix(in srgb, var(--gc) 12%, var(--surface)); }
button.fgrp:disabled { opacity: .35; cursor: default; text-decoration: none; filter: none; }
.fcat > header h3 { display: flex; align-items: center; gap: 10px; }
.fgrp { font-family: var(--display); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--surface); background: var(--gc); border-radius: 3px; padding: 2px 7px; line-height: 1.3; }
.fdef { margin: 12px 16px 14px; border: 1px solid var(--line); border-left: 5px solid var(--tc); border-radius: 4px; background: color-mix(in srgb, var(--tc) 6%, var(--surface)); overflow: hidden; }
.fdef-h { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 10px 12px; }
.fdef .scroll { background: var(--surface); border-top: 1px solid var(--line); }
.fdef .cap { padding: 8px 12px 10px !important; background: var(--surface); border-top: 1px solid var(--line); }
.tpill { display: inline-block; font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .04em; color: #fff; background: var(--tc); border-radius: 3px; padding: 1px 8px; line-height: 1.35; border: 1px solid color-mix(in srgb, #fff 18%, var(--tc)); cursor: pointer; }
.tpill.sm { font-size: 13px; padding: 0 6px; }
.frank { font-family: var(--display); font-size: 18px; font-weight: 700; }
.flag { display: inline-block; margin-left: 6px; font-family: var(--display); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); border: 1px solid currentColor; border-radius: 2px; padding: 0 4px; vertical-align: 1px; }
.hit { font-weight: 600; }
th .sortb { font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; white-space: nowrap; }
th .sortb:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
th[aria-sort] .sortb { color: var(--accent); }
th[aria-sort="descending"] .sortb::after { content: " \25BC"; font-size: 9px; }
th[aria-sort="ascending"] .sortb::after { content: " \25B2"; font-size: 9px; }
@media (max-width: 520px) { td.pl { white-space: normal; min-width: 128px; max-width: 150px; } }

/* teams tab */
.tmhero { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 18px 20px 18px; border-radius: 6px; background: var(--tc); color: #fff; border-bottom: 7px solid var(--ts); }
.tmhero > :not(.tmwm) { position: relative; }
.tmhero :focus-visible { outline-color: #fff; }
.tmwm { position: absolute; right: -0.04em; bottom: -0.2em; font-family: var(--display); font-weight: 700; font-size: clamp(120px, 24vw, 250px); line-height: 1; letter-spacing: -.02em; color: rgb(255 255 255 / .08); pointer-events: none; user-select: none; }
.tmtop { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: flex-end; justify-content: space-between; }
.tmhero h2 { font-size: clamp(36px, 7vw, 66px); font-weight: 700; line-height: .9; text-transform: uppercase; letter-spacing: .005em; color: #fff; }
.tmhero select { font: inherit; font-size: 15px; font-weight: 600; color: #15201B; background: #fff; border: 0; border-radius: 4px; padding: 7px 10px; max-width: 100%; }
.tmmeta { margin: 0; font-size: 14px; color: rgb(255 255 255 / .82); max-width: 72ch; }
.tmpills { display: flex; flex-wrap: wrap; gap: 6px; }
.tmpills button { font: inherit; font-size: 13px; color: #fff; background: transparent; border: 1px solid rgb(255 255 255 / .42); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.tmpills button:hover { border-color: #fff; }
.tmpills button[aria-pressed="true"] { background: #fff; color: var(--tc); border-color: #fff; font-weight: 600; }
.tmshare { display: flex; flex-direction: column; gap: 8px; }
.tmshare-t { margin: 0; font-family: var(--display); font-size: 19px; font-weight: 600; color: #fff; }
.tmbar { display: flex; gap: 2px; height: 38px; }
.tmbar span { min-width: 3px; display: flex; align-items: center; justify-content: center; overflow: hidden; background: rgb(255 255 255 / var(--a)); color: #fff; font-family: var(--display); font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tmbar span:first-child { border-radius: 3px 0 0 3px; } .tmbar span:last-child { border-radius: 0 3px 3px 0; }
.tmbar span.lt { color: var(--tc); }
.tmleg { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: rgb(255 255 255 / .9); }
.tmleg li { display: flex; align-items: center; gap: 6px; }
.tmleg i { width: 10px; height: 10px; border-radius: 2px; background: rgb(255 255 255 / var(--a)); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .35); }
.tmleg b { font-weight: 600; font-variant-numeric: tabular-nums; }
.tmchips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; }
.tmchip { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 999px; padding: 5px 12px; cursor: pointer; text-align: left; }
.tmchip small { color: var(--ink-3); margin-left: 6px; font-size: 12px; }
.tmchip:hover { border-color: var(--ink-3); }
.tmchip[data-st="out"] { background: color-mix(in srgb, var(--lo) 22%, var(--surface)); border-color: var(--lo-ink); font-weight: 600; }
.tmchip[data-st="in"] { background: color-mix(in srgb, var(--hi) 22%, var(--surface)); border-color: var(--hi-ink); font-weight: 600; }
.tmnever { padding: 0 16px 10px; }
@media (max-width: 520px) { .tmchip { font-size: 12.5px; padding: 4px 10px; } .tmchip small { margin-left: 4px; } }
td.tmsel { font-weight: 600; }
td.tmsel small { display: block; font-weight: 400; font-size: 11.5px; }
.tmgrid th { text-align: center; line-height: 1.2; }
.tmgrid td { text-align: center; }
.tmgrid td.pl { text-align: left; }
td.tmh { background: color-mix(in srgb, var(--accent) var(--h), var(--surface)); box-shadow: inset 0 0 0 1px var(--surface); }
td.tmh.top { font-weight: 700; }
td.tmsat { color: var(--ink-3); font-family: var(--display); font-size: 11px; letter-spacing: .06em; }
.tmsit { margin: 0 16px 14px; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.tmsit-h { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; padding: 8px 12px; background: var(--bg); border-bottom: 1px solid var(--line); }
.tmsit td.pl { padding-left: 12px; }

/* player panel */
.link { font: inherit; font-weight: 600; color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.link:hover { color: var(--accent); text-decoration-color: currentColor; }
.scrim { position: fixed; inset: 0; z-index: 30; background: rgb(10 14 12 / .42); }
.panel { position: fixed; z-index: 31; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--bg); border-left: 1px solid var(--line-strong); box-shadow: -12px 0 32px rgb(0 0 0 / .18); overflow-y: auto; overscroll-behavior: contain; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
@media (max-width: 600px) { .panel { padding-left: env(safe-area-inset-left, 0px); border-left: 0; } }
.pin { display: flex; flex-direction: column; gap: 14px; padding: 16px; }
.phead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.phead h2 { font-size: 30px; font-weight: 700; text-transform: uppercase; line-height: 1; }
.phead .meta { color: var(--ink-2); margin-top: 4px; font-size: 13.5px; }
.xbtn { font: inherit; font-size: 22px; line-height: 1; width: 36px; height: 36px; flex: none; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--surface); color: var(--ink-2); cursor: pointer; }
.xbtn:hover { color: var(--ink); }
.big3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; }
.big3 > div { display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; border-right: 1px solid var(--line); min-width: 0; }
.big3 > div:last-child { border-right: 0; }
.big3 b { font-family: var(--display); font-size: 32px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
.big3 small { color: var(--ink-2); font-size: 12px; }
.big3 .was { color: var(--ink-3); font-size: 13px; font-weight: 500; margin-left: 4px; font-family: var(--body); }
.psec { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; display: flex; flex-direction: column; min-width: 0; }
.psec > h3 { font-size: 18px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; padding: 10px 14px 4px; }
.psec > .cap { padding: 0 14px 8px; }
.steps { display: flex; flex-direction: column; padding: 2px 14px 10px; font-variant-numeric: tabular-nums; }
.step { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 6px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.step:last-child { border-bottom: 0; }
.step span small { display: block; color: var(--ink-3); font-size: 12px; }
.step b { font-weight: 600; text-align: right; min-width: 64px; }
.step.tot { border-top: 2px solid var(--line-strong); border-bottom: 0; font-weight: 600; }
.step.tot b { font-family: var(--display); font-size: 20px; }
.up { color: var(--hi-ink); } .dn { color: var(--lo-ink); } .flat { color: var(--ink-3); }
.mates { display: flex; flex-direction: column; padding: 0 14px 6px; }
.mate { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); cursor: pointer; }

<script>
/* Local data adapter: stands in for the claude.ai database so this page runs from the
   files nba_site.py writes. data/index.js has the board meta, defenses and every night;
   each per-game document and team panel loads from data/<collection>/<id>.js on demand. */
(function () {
  const IDX = window.__NBA_INDEX || { meta: null, defense: null, nights: [] };
  const got = {}, wait = {};
  const ver = encodeURIComponent(IDX.built_at || "");
  window.__NBA_DOC = (key, d) => { got[key] = d; (wait[key] || []).forEach((w) => w[0](d)); delete wait[key]; };
  function load(key) {
    if (key in got) return Promise.resolve(got[key]);
    return new Promise((res) => {
      if (wait[key]) { wait[key].push([res]); return; }
      wait[key] = [[res]];
      const s = document.createElement("script");
      s.src = `data/${key}.js?v=${ver}`;
      s.onerror = () => { got[key] = null; (wait[key] || []).forEach((w) => w[0](null)); delete wait[key]; };
      document.head.appendChild(s);
    });
  }
  const snap = (d) => ({ exists: d != null, data: () => d });
  const qs = (pairs) => ({ docs: pairs.map(([id, d]) => ({ id, data: () => d })) });
  const night = (id) => IDX.nights.find((n) => n.id === id) || {};
  // ----- Your injury edits (what-if outs, questionable flags, minute changes): saved to
  // edits/<night>.json in the GitHub repo so phone and computer share them. Reading works
  // for anyone; saving needs the owner's GitHub token on that device.
  const REPO = IDX.repo || (location.hostname.endsWith(".github.io")
    ? `${location.hostname.split(".")[0]}/${location.pathname.split("/").filter(Boolean)[0] || ""}` : "");
  const TOKEN_KEY = "nba-gh-token";
  const token = () => { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; } };
  const shas = {};
  const b64 = (str) => { const by = new TextEncoder().encode(str); let s = ""; by.forEach((c) => (s += String.fromCharCode(c))); return btoa(s); };
  const unb64 = (b) => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g, "")), (c) => c.charCodeAt(0)));
  const api = (id) => `https://api.github.com/repos/${REPO}/contents/edits/${id}.json`;
  const hdrs = () => (token() ? { Authorization: `Bearer ${token()}`, Accept: "application/vnd.github+json" } : { Accept: "application/vnd.github+json" });
  const localKey = (id) => `nba-edits-${id}`;
  function localGet(id) { try { const v = localStorage.getItem(localKey(id)); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function localSet(id, d) { try { localStorage.setItem(localKey(id), JSON.stringify(d)); } catch (e) {} }
  async function remoteGet(id) {
    const r = await fetch(api(id) + `?t=${Date.now()}`, { headers: hdrs(), cache: "no-store" });
    if (r.status === 404) { shas[id] = null; return null; }
    if (r.ok) { const j = await r.json(); shas[id] = j.sha; return JSON.parse(unb64(j.content)); }
    // without a token GitHub allows 60 reads an hour; past that, read the published copy
    const p = await fetch(`edits/${id}.json?t=${Date.now()}`, { cache: "no-store" });
    if (p.status === 404) return null;
    if (p.ok) return await p.json();
    throw new Error("unreachable");
  }
  async function readEdits(id) {
    if (!REPO) return localGet(id);
    try { const d = await remoteGet(id); localSet(id, d || {}); return d; } catch (e) { return localGet(id); }
  }
  // apply fn to the latest saved copy and save it (retried if another device saved first)
  async function updateEdits(id, fn) {
    if (!REPO) { const d = fn(localGet(id) || {}); localSet(id, d); return d; }
    if (!token()) throw new Error("signin");
    for (let attempt = 0; attempt < 3; attempt++) {
      const cur = await remoteGet(id);
      const d = fn(cur ? JSON.parse(JSON.stringify(cur)) : {});
      d.date = id; d.updated_at = new Date().toISOString();
      const body = { message: `Injury edits ${id}`, content: b64(JSON.stringify(d, null, 1)) };
      if (shas[id]) body.sha = shas[id];
      const r = await fetch(api(id), { method: "PUT", headers: { ...hdrs(), "Content-Type": "application/json" }, body: JSON.stringify(body) });
      if (r.ok) { shas[id] = (await r.json()).content.sha; localSet(id, d); return d; }
      if (r.status === 401 || r.status === 403) throw new Error("token");
    }
    throw new Error("conflict");
  }
  window.__NBA_EDITS = {
    repo: REPO, signedIn: () => !!token(), read: readEdits, update: updateEdits,
    signIn() { const v = (window.prompt("Paste your GitHub token (it stays on this device only):") || "").trim(); if (v) { try { localStorage.setItem(TOKEN_KEY, v); } catch (e) {} location.reload(); } },
    signOut() { try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} location.reload(); },
  };
  window.addEventListener("DOMContentLoaded", () => {
    if (!REPO) return;
    const p = document.createElement("p");
    p.style.cssText = "text-align:center;font-size:12px;opacity:.7;margin:8px 16px 32px";
    const btn = document.createElement("button");
    btn.type = "button";
    btn.style.cssText = "font:inherit;background:none;border:0;padding:0;color:inherit;text-decoration:underline;cursor:pointer";
    if (token()) { p.textContent = "Injury changes on this device save to GitHub and show on all your devices. "; btn.textContent = "Sign out"; btn.onclick = window.__NBA_EDITS.signOut; }
    else { p.textContent = "Owner: "; btn.textContent = "sign in to save injury changes from this device"; btn.onclick = window.__NBA_EDITS.signIn; }
    p.appendChild(btn);
    document.body.appendChild(p);
  });
  function source(path) {
    if (path === "board/meta") return Promise.resolve(IDX.meta);
    if (path === "board/defense") return Promise.resolve(IDX.defense);
    return load(path);
  }
  function doc(path) {
    return {
      get: () => source(path).then(snap),
      onSnapshot(cb, err) { source(path).then((d) => cb(snap(d)), (e) => err && err(e)); return () => {}; },
    };
  }
  function byDate(col, id) {
    const ids = night(id)[`${col}_docs`] || [];
    return Promise.all(ids.map((d) => load(`${col}/${d}`).then((x) => [d, x]))).then((ps) => qs(ps.filter((p) => p[1])));
  }
  function collection(name) {
    if (name === "nights") return { onSnapshot(cb) { setTimeout(() => cb(qs(IDX.nights.map((n) => [n.id, n])))); return () => {}; } };
    return {
      where: (f, op, id) => ({
        get: () => byDate(name, id),
        onSnapshot(cb, err) { byDate(name, id).then(cb, (e) => err && err(e)); return () => {}; },
      }),
    };
  }
  const db = { doc, collection };
  window.claude = { use: async (what) => (what === "db" ? db : null) };
})();
</script>

      const cnt = state.stat === "combos" ? `${(n.cmb_games || []).length} game${(n.cmb_games || []).length === 1 ? "" : "s"} with combos` : state.stat === "funnels" ? `${((n.funnels || {}).entries || []).length} funnels` : state.stat === "pts" ? `${Object.keys(n.pts_index || {}).length} scorers` : state.stat === "ast" ? `${Object.keys(n.ast_index || {}).length} passers` : state.stat === "reb" ? `${Object.keys(n.reb_index || {}).length} rebounders` : state.stat === "pra" ? `${Object.keys(n.pra_index || {}).length} players` : `${(n.rows || []).length} shooters`;
      stamp.innerHTML = `${label}<span>${(n.games || []).length} games · ${cnt}${graded ? " · graded" : ""}</span>`;
    }
    const gms = $("#gms");
    if (!n || state.tab !== "board") { gms.innerHTML = ""; return; }
    // highest over/under first; games without a total go last, in tip order
    const games = (n.games || []).slice().sort((a, b) => {
      const ta = ouOf(a), tb = ouOf(b);
      if (ta != null && tb != null && ta !== tb) return tb - ta;
      if ((ta == null) !== (tb == null)) return ta == null ? 1 : -1;
      return String(a.tip_utc || "").localeCompare(String(b.tip_utc || ""));
    });
    if (state.sel.some((x) => !games.some((g) => g.game === x))) state.sel = state.sel.filter((x) => games.some((g) => g.game === x));
    gms.innerHTML = [`<button type="button" class="gm" data-game="ALL" aria-pressed="${allG()}">All games</button>`]
      .concat(games.map((g) => { const lk = gameLocked(n, g); const ou = ouOf(g); return `<button type="button" class="gm${lk ? " lk" : ""}" data-game="${esc(g.game)}" aria-pressed="${state.sel.includes(g.game)}" title="${lk ? `Locked${g.locked_at ? " " + esc(fmtTime(g.locked_at)) : ""}: these ratings won't change` : "Preview: locks at tip"}${ou != null ? ` · Over/under ${ou}${g.total_src ? " (" + esc(g.total_src) + ")" : ""}` : " · No over/under posted"}">${lk ? LOCK_SVG : ""}${esc(g.game)}${ou != null ? ` <b class="ou">${ou}</b>` : ""}${g.tip ? ` · ${esc(g.tip)}` : ""}</button>`; }))
      .concat(state.sel.length > 1 ? [`<span class="gmn">${state.sel.length} games picked</span>`] : []).join("");
  }

  // ----- Board tab -----
  const COLS = [
    { k: "proj_3pm", h: "Proj 3PM", t: "Projected made threes tonight" },
    { k: "base_3pm", h: "Normal", t: "His projection against a league-average defense" },
    { k: "boost", h: "Matchup", t: "How much tonight's defense moves his projection" },
    { k: "proj_3pa", h: "3PA", t: "Projected three-point attempts" },
    { k: "proj_pct", h: "3P%", t: "Projected three-point percentage" },
    { k: "min", h: "Min", t: "Projected minutes" },
    { k: "p2", h: "2+", t: "Model estimate of making two or more threes" },
    { k: "p3", h: "3+", t: "Model estimate of making three or more threes" },
  ];
  function boardHTML() {
    const n = currentNight();
    if (!n) return emptyBoard();
    let rows = wiRows(n, (n.rows || []).slice(), "3pm");
    if (!allG()) rows = rows.filter((r) => inSel(r.game));
    if (state.show === "best") rows = rows.filter((r) => ["A+", "A", "B"].includes(r.grade));
    else if (state.show === "proven") rows = rows.filter((r) => !r.gate && r.grade !== "–");
    const k = state.sort.key, dir = state.sort.dir === "asc" ? 1 : -1;
    rows.sort((a, b) => {
      if (k === "grade") return ((a.grade === "–") - (b.grade === "–")) || dir * ((GRADE_T[a.grade] ?? 0) - (GRADE_T[b.grade] ?? 0)) || b.proj_3pm - a.proj_3pm;
      if (k === "player") return dir * String(a.player).localeCompare(String(b.player));
      if (k === "actual") return dir * ((act(n, a)?.fg3m ?? -1) - (act(n, b)?.fg3m ?? -1));
      return dir * ((a[k] ?? -1) - (b[k] ?? -1));
    });
    const graded = n.status === "graded" && n.results;
    const maxPm = Math.max(1, ...(n.rows || []).map((r) => r.proj_3pm || 0));
    const th = (key, label, cls = "", title = "") => {
      const s = state.sort.key === key ? ` aria-sort="${state.sort.dir === "asc" ? "ascending" : "descending"}"` : "";
      return `<th class="${cls}"${s}${title ? ` title="${esc(title)}"` : ""}><button type="button" class="sortb" data-sort="${key}">${label}</button></th>`;
    };
    const head = `<tr><th class="mut" style="padding-left:16px;text-align:left">#</th>${th("player", "Player", "pl")}${th("grade", "Grade", "", "Matchup grade")}${COLS.map((c, i) => th(c.k, c.h, i === 0 || i === 6 ? "gs" : "", c.t)).join("")}${graded ? th("actual", "Actual", "gs", "Made threes / attempts in the game") : ""}<th class="l">Why</th></tr>`;
    const body = rows.map((r) => {
      const a = graded ? act(n, r) : null;
      const loc = r.home ? "vs" : "@";
      const flags = (r.flags || "").split(",").map((s) => s.trim()).filter(Boolean).map((f) => `<span class="flag">${esc(f)}</span>`).join("");
      const actualCell = graded ? (a ? `<td class="gs hit" style="background:${heat(0.5 + Math.max(-1, Math.min(1, (a.fg3m - r.proj_3pm) / 2.5)) * 0.5)};color:var(--cell-ink)">${a.fg3m} / ${a.fg3a}</td>` : `<td class="gs mut" title="Did not play">DNP</td>`) : "";
      return `<tr>
        <td class="rk">${r.rank ?? ""}</td>
        <td class="pl"><button type="button" class="link" data-player="${r.player_id}">${esc(r.player)}</button>${flags}<small><button type="button" class="tlink" data-team="${esc(r.team)}">${esc(r.team)}</button> ${loc} <button type="button" class="tlink" data-team="${esc(r.opp)}">${esc(r.opp)}</button></small></td>
        <td>${gradeChip(r.grade, r.gate)}</td>
        <td class="gs share" style="--w:${Math.round((r.proj_3pm / maxPm) * 100)}">${f2(r.proj_3pm)}</td>
        <td class="mut">${f2(r.base_3pm)}</td>
        <td class="h" style="background:${heat(boostT(r.boost))}">${sgn(r.boost)}</td>
        <td>${f1(r.proj_3pa)}</td>
        <td>${pct(r.proj_pct)}</td>
        <td class="mut">${f1(r.min)}</td>
        <td class="gs">${pct(r.p2, 0)}</td>
        <td>${pct(r.p3, 0)}</td>
        ${actualCell}
        <td class="why">${esc(r.drivers || "Neutral matchup")}</td>
      </tr>`;
    }).join("");
    const summary = graded ? gradedSummary(n) : "";
    return `${summary}<section class="card">
      <header><h3>${esc(allG() ? "Every shooter" : selLabel())}</h3>
        <span class="seg" role="group" aria-label="Which shooters">
          <button type="button" data-show="all" aria-pressed="${state.show === "all"}">All</button>
          <button type="button" data-show="best" aria-pressed="${state.show === "best"}">B or better</button>
          <button type="button" data-show="proven" aria-pressed="${state.show === "proven"}" title="Only players with established volume and sample">Proven volume</button>
        </span></header>
      ${injLine(n)}<p class="cap">Ranked by projected made threes. Click a player for his full breakdown. <b>Matchup</b> is how far tonight's defense and pace move him from his normal output; the grade measures that effect in made threes. Faded grades mark shooters whose volume or sample isn't proven yet (hover for why); <b>Proven volume</b> hides them, and the <b>Top grades</b> tab collects the best proven matchups across all four stats. 2+ and 3+ are model estimates.${n.note ? " " + esc(n.note) : ""}</p>
      <div class="scroll"><table><thead>${head}</thead><tbody>${body || `<tr><td class="l" colspan="14" style="padding:14px 16px">No shooters match this filter.</td></tr>`}</tbody></table></div>
    </section>`;
  }
  function act(n, r) { return n.results ? n.results[String(r.player_id)] : null; }

  function gradedSummary(n) {
    const rows = (n.rows || []).map((r) => ({ r, a: act(n, r) })).filter((x) => x.a);
    if (!rows.length) return "";
    const sum = (arr, f) => arr.reduce((s, x) => s + f(x), 0);
    const top = rows.slice().sort((x, y) => y.r.proj_3pm - x.r.proj_3pm).slice(0, 10);
    const good = rows.filter((x) => ["A+", "A"].includes(x.r.grade));
    const tile = (big, small) => `<div class="tile"><b>${big}</b><small>${small}</small></div>`;
    return `<section class="card"><header><h3>How the night graded</h3></header>
      <div class="tiles">
        ${tile(`${f1(sum(rows, (x) => x.a.fg3m))} <span style="font-size:18px;color:var(--ink-3)">/ ${f1(sum(rows, (x) => x.r.proj_3pm))}</span>`, "Threes made vs projected, shooters who played")}
        ${tile(`${f2(sum(top, (x) => x.a.fg3m) / top.length)}`, `Made per player by the top 10 projected (projected ${f2(sum(top, (x) => x.r.proj_3pm) / top.length)})`)}
        ${good.length ? tile(sgnN(sum(good, (x) => x.a.fg3m - x.r.base_3pm) / good.length), `A and A+ matchups vs their normal output (${good.length} players)`) : ""}
      </div></section>`;
  }

  // ----- Top grades: the best matchups among proven-volume players, all four stats -----
  const TOP_STATS = [
    { s: "3pm", name: "Made threes", unit: "threes", rows: (n) => wiRows(n, (n.rows || []).slice(), "3pm") || [], proj: "proj_3pm", base: "base_3pm", fmt: f2, vol: (r) => `${f1(r.proj_3pa)} 3PA` },
    { s: "pts", name: "Points", unit: "points", rows: (n) => wiRows(n, (state.pts[n.id] || []).slice(), "pts") || [], proj: "proj_pts", base: "base_pts", fmt: f1, vol: (r) => `${f1(r.min)} min` },
    { s: "ast", name: "Assists", unit: "assists", rows: (n) => wiRows(n, (state.ast[n.id] || []).slice(), "ast") || [], proj: "proj_ast", base: "base_ast", fmt: f2, vol: (r) => `${f1(r.min)} min` },
    { s: "reb", name: "Rebounds", unit: "rebounds", rows: (n) => wiRows(n, (state.reb[n.id] || []).slice(), "reb") || [], proj: "proj_reb", base: "base_reb", fmt: f2, vol: (r) => `${f1(r.min)} min` },
  ];
  function topHTML() {
    const n = currentNight();
    if (!n) return emptyBoard();
    const keep = state.topAll ? ["A+", "A", "B"] : ["A+", "A"];
    const edgeOf = (r, T) => (r.edge != null ? r.edge : (r[T.base] || 0) * (r.boost || 0));
    const sections = TOP_STATS.map((T) => {
      let rows = T.rows(n).filter((r) => !r.gate && keep.includes(r.grade));
      if (!allG()) rows = rows.filter((r) => inSel(r.game));
      rows.sort((a, b) => (GRADE_T[b.grade] ?? 0) - (GRADE_T[a.grade] ?? 0) || edgeOf(b, T) - edgeOf(a, T));
      const body = rows.map((r) => `<tr>
        <td class="pl"><button type="button" class="link" data-player="${r.player_id}" data-pstat="${T.s}">${esc(r.player)}</button><small><button type="button" class="tlink" data-team="${esc(r.team)}">${esc(r.team)}</button> ${r.home ? "vs" : "@"} <button type="button" class="tlink" data-team="${esc(r.opp)}">${esc(r.opp)}</button>${gameLocked(n, (n.games || []).find((g) => g.game === r.game)) ? "" : ` · <span class="dim">preview</span>`}</small></td>
        <td>${gradeChip(r.grade, r.gate)}</td>
        <td class="h" style="background:${heat(boostT(r.boost))}">${edgeOf(r, T) >= 0 ? "+" : "−"}${T.fmt(Math.abs(edgeOf(r, T)))}</td>
        <td class="gs"><b>${T.fmt(r[T.proj])}</b></td>
        <td class="mut">${T.fmt(r[T.base])}</td>
        <td class="mut">${esc(T.vol(r))}</td>
      </tr>`).join("");
      return `<section class="card"><header><h3>${T.name}</h3><span class="eyebrow">${rows.length} player${rows.length === 1 ? "" : "s"}</span></header>
        <div class="scroll"><table><thead><tr><th class="pl">Player</th><th>Grade</th><th title="Extra ${T.unit} the matchup adds over his normal output">Matchup</th><th class="gs">Projected</th><th>Normal</th><th>Volume</th></tr></thead>
        <tbody>${body || `<tr><td class="l" colspan="6" style="padding:14px 16px">No proven ${T.unit === "threes" ? "shooters" : "players"} graded ${keep.join(" or ")} ${allG() ? "tonight" : inThese()}.</td></tr>`}</tbody></table></div></section>`;
    }).join("") + praTopHTML(n, keep);
    return `<section class="card"><header><h3>Top grades${allG() ? "" : ": " + esc(selLabel())}</h3>
        <span class="seg" role="group" aria-label="Which grades">
          <button type="button" data-topall="0" aria-pressed="${!state.topAll}">A and A+</button>
          <button type="button" data-topall="1" aria-pressed="${!!state.topAll}">B or better</button>
        </span></header>
      <p class="cap">The best matchups tonight among players with proven volume and sample, for every stat. <b>Matchup</b> is how much the matchup adds in the stat's own units (made threes, points, assists, rebounds, or the PRA combo you pick) over his normal output. These are the posted board's numbers; what-ifs don't change them. Click a player for his card.</p></section>${sections}`;
  }
  // ----- Funnels: top-5 defenses by category and the opposing players who fit -----
  const FUN_RES = { fg3m: "3PM", pts: "PTS", oreb: "OREB", reb: "REB", ast: "AST" };
  const TEAM_C = { ATL: "#C8102E", BOS: "#007A33", BKN: "#2A2A2A", CHA: "#1D1160", CHI: "#CE1141", CLE: "#860038", DAL: "#00538C", DEN: "#0E2240", DET: "#C8102E", GSW: "#1D428A", HOU: "#CE1141", IND: "#002D62", LAC: "#C8102E", LAL: "#552583", MEM: "#5D76A9", MIA: "#98002E", MIL: "#00471B", MIN: "#0C2340", NOP: "#0C2340", NYK: "#006BB6", OKC: "#007AC1", ORL: "#0077C0", PHI: "#006BB6", PHX: "#1D1160", POR: "#E03A3E", SAC: "#5A2D81", SAS: "#3A3D40", TOR: "#CE1141", UTA: "#002B5C", WAS: "#002B5C" };
  const FUN_GROUP = { cs_fgm: ["jump", "Jump shots"], cs_freq: ["jump", "Jump shots"], pu_fgm: ["jump", "Jump shots"], pu_freq: ["jump", "Jump shots"],
    c3_fga: ["zone", "3PT zones"], atb_fga: ["zone", "3PT zones"], ra_fgm: ["rim", "At the rim"], oreb: ["boards", "Boards"], reb: ["boards", "Boards"],
    ast: ["ast", "Playmaking"], spot_ppg: ["pt", "Play types"], prbh_ppg: ["pt", "Play types"], roll_ppg: ["pt", "Play types"], trans_ppg: ["pt", "Play types"] };
  const tpill = (t, sm) => `<button type="button" class="tpill${sm ? " sm" : ""}" data-team="${esc(t)}" style="--tc:${TEAM_C[t] || "#555"}">${esc(t)}</button>`;
  // Funnel lists show their top 10; an arrow under the table expands to the rest.
  const FUN_TOP = 10;
  const funOpen = (k) => !!(state.fexp && state.fexp[k]);
  const funSlice = (k, arr) => (funOpen(k) ? arr : arr.slice(0, FUN_TOP));
  const moreBtn = (k, total, noun) => total > FUN_TOP
    ? `<button type="button" class="more" data-fexp="${k}" aria-expanded="${funOpen(k)}">${funOpen(k) ? `Show top ${FUN_TOP}` : `Show all ${total} ${noun}`}<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6l4.5 4.5L12.5 6"/></svg></button>` : "";
  function funnelsHTML() {
    const n = currentNight();
    if (!n) return emptyBoard();
    const F = n.funnels;
    if (!F) return `<section class="card"><header><h3>Funnels</h3></header><div class="empty"><p>Funnels start with the next board build. Games locked before then don't have them.</p></div></section>`;
    const cats = {}; (F.categories || []).forEach((c) => (cats[c.id] = c));
    const NUMQ = new Set(F.num_qual || []);
    const inGame = (e) => inSel(e.game);
    const isPct = (c) => c.id.endsWith("_freq");
    const val = (c, v) => (isPct(c) ? pct(v, 1) : f1(v));
    const qv = (c, v) => (NUMQ.has(c.freq) ? f1(v) : pct(v, 0));
    const qthr = (c) => (NUMQ.has(c.freq) ? `${Number(c.thr).toFixed(1)}+` : `${pct(c.thr, 0)}+`);
    const qlab = (c) => (F.freq_label || {})[c.freq] || "Qualifier";
    const grp = (c) => FUN_GROUP[c.id] || ["jump", ""];
    const gtag = (e) => (e.games != null && e.games < 10 ? ` <span class="dim">(${e.games} game${e.games === 1 ? "" : "s"})</span>` : "");
    const graded = !!n.results;
    const gameOf = (e) => (n.games || []).find((g) => g.game === e.game);
    const prevTag = (e) => (gameLocked(n, gameOf(e)) ? "" : ` <span class="dim">· preview</span>`);
    const pname = (p, c) => {
      const want = ["cs", "pu", "c3", "atb"].includes(c.freq) ? "3pm" : c.freq === "ast_pg" ? "ast" : ["oreb_pg", "rebch_pg"].includes(c.freq) ? "reb" : "pts";
      const has = { "3pm": (n.rows || []).some((r) => r.player_id === p.player_id), pts: !!(n.pts_index && n.pts_index[p.player_id]), ast: !!(n.ast_index && n.ast_index[p.player_id]), reb: !!(n.reb_index && n.reb_index[p.player_id]) };
      const st = has[want] ? want : ["pts", "3pm", "ast", "reb"].find((k) => has[k]);
      return st ? `<button type="button" class="link" data-player="${p.player_id}" data-pstat="${st}">${esc(p.player)}</button>` : esc(p.player);
    };
    const resCell = (p, c) => {
      if (!graded) return "";
      const a = n.results[p.player_id], k = c.res;
      if (!a) return `<td class="mut">DNP</td>`;
      const v = a[k], up = p.avg != null && v > p.avg;
      return `<td><b class="${up ? "up" : ""}">${v}</b> <span class="dim">avg ${f1(p.avg)}</span></td>`;
    };
    const playersTable = (e, c) => {
      if (!c.freq) return `<p class="cap">Defense only: no player threshold for this category.</p>`;
      const ps = e.players || [];
      if (!ps.length) return `<p class="cap">No ${esc(e.off)} player clears ${qthr(c)} ${esc(qlab(c))} with ${F.min_minutes || 15}+ minutes.</p>`;
      const pk = `p:${e.cat}:${e.def}`;
      const body = funSlice(pk, ps).map((p) => `<tr><td class="pl">${pname(p, c)}${p.q ? `<span class="flag">Questionable</span>` : ""}${p.blend ? `<small>incl. 2025-26 (${p.gp} game${p.gp === 1 ? "" : "s"} this season)</small>` : ""}</td>
        <td class="gs"><b>${qv(c, p.freq)}</b></td><td>${f1(p.vol)}</td><td class="mut">${f1(p.min)}${p.min_l10 != null ? ` · ${f1(p.min_l10)}` : ""}</td>${resCell(p, c)}</tr>`).join("");
      return `<div class="scroll"><table><thead><tr><th class="pl">${esc(e.off)} player</th><th class="gs" title="Needs ${qthr(c)}">${esc(qlab(c))} <span class="dim">(${qthr(c)})</span></th><th>${esc((F.vol_label || {})[c.freq] || "Vol")}/g</th><th title="Season · last 10 games">Min</th>${graded ? `<th>${FUN_RES[c.res]}</th>` : ""}</tr></thead><tbody>${body}</tbody></table></div>${moreBtn(pk, ps.length, "players")}`;
    };
    // one card per category
    const quiet = [], waiting = [], shown = [], cardOf = {};
    (F.categories || []).forEach((c) => { cardOf[c.id] = (() => {
      if ((F.missing || []).includes(c.id)) { waiting.push(c.label); return ""; }
      // best-ranked defense first (locked games' entries are stored ahead of open ones)
      const es = (F.entries || []).filter((e) => e.cat === c.id && inGame(e)).sort((x, y) => x.rank - y.rank || String(x.def).localeCompare(String(y.def)));
      if (!es.length) { quiet.push(c.label); return ""; }
      const top = es[0].top || [];
      const [gk, gl] = grp(c);
      shown.push({ id: c.id, label: c.label, gk });
      const blocks = es.map((e) => `<div class="fdef" style="--tc:${TEAM_C[e.def] || "#555"}">
          <div class="fdef-h">${tpill(e.def)}<span class="frank">${ord(e.rank)}</span>
            <span class="mut">${val(c, e.value)} ${isPct(c) ? "of shots" : "per game"}${gtag(e)}${e.pace != null ? ` · pace ${f1(e.pace)}` : ""}</span>
            <span class="mut" style="margin-left:auto">vs</span>${tpill(e.off, 1)}${prevTag(e)}</div>
          ${playersTable(e, c)}</div>`).join("");
      return `<section class="card fcat" data-fgrp="${gk}" data-fcat="${esc(c.id)}" style="--gc:var(--g-${gk})"><header><h3><span class="fgrp">${esc(gl)}</span>${esc(c.label)}</h3><span class="eyebrow">${c.window === "l10" ? "Last 10 games" : "Full season"}</span></header>
        <p class="cap">Top ${F.top_n || 5}: ${top.map((x) => `${esc(x[0])} ${val(c, x[2])}`).join(" · ")}. Players: ${qthr(c)} ${esc(qlab(c).toLowerCase())}, ${F.min_minutes || 15}+ min (season or last 10).</p>${blocks}</section>`;
    })(); });
    // related categories side by side (stacked on narrow screens)
    const PAIRS = [["cs_fgm", "cs_freq"], ["pu_fgm", "pu_freq"], ["oreb", "reb"], ["prbh_ppg", "roll_ppg"]];
    const used = new Set(), parts = [];
    (F.categories || []).forEach((c) => {
      if (used.has(c.id) || !cardOf[c.id]) return;
      const pair = PAIRS.find((x) => x.includes(c.id));
      if (!pair) { used.add(c.id); parts.push(cardOf[c.id]); return; }
      pair.forEach((id) => used.add(id));
      const hs = pair.map((id) => cardOf[id]).filter(Boolean);
      parts.push(hs.length === 2 ? `<div class="fpair">${hs.join("")}</div>` : hs[0]);
    });
    const catCards = parts.join("");
    const foot = (quiet.length || waiting.length) ? `<section class="card"><div style="padding:12px 16px">
      ${quiet.length ? `<p class="cap" style="padding:0 0 6px">No top-5 defense ${allG() ? "on tonight's slate" : inThese()}: ${quiet.map(esc).join(", ")}.</p>` : ""}
      ${waiting.length ? `<p class="cap" style="padding:0">Load after the next data pull: ${waiting.map(esc).join(", ")}.</p>` : ""}</div></section>` : "";
    // biggest funnels (bottom)

  const FIT_SKIP = new Set(["oreb", "reb", "ast"]);
  function funnelFits(n, F, cats, inGame) {
    const N = F.top_n || 5, fits = {};
    (F.entries || []).filter(inGame).forEach((e) => {

      if (!c || !c.freq || !c.thr || FIT_SKIP.has(e.cat)) return;

    return `<section class="card"><header><h3>How the projection works</h3>${m.model_version ? `<span class="eyebrow">Model v${esc(m.model_version)}</span>` : ""}</header>
      <div class="prose">
        <p class="formula">Projected 3PM = minutes × attempt rate × defense volume × pace × adjusted 3P%</p>
        <h4>Attempts</h4>
        <ul>
          <li><b>Minutes and attempt rate</b> are the player's own: threes per minute, at his projected minutes. Minutes come mostly from this season's games, recent games counting most, with last season worth about one game. Games where a teammate regular sat are adjusted for the minutes that freed up, so when that teammate is back his teammates' minutes come down, and when he's out tonight the injury step adds them back. A healthy player who hasn't appeared this season drifts toward zero. On this season's games so far this cut the average minutes miss from 6.2 to 4.9.</li>
          <li><b>Team minutes budget.</b> A game has about 241 player-minutes per team, but a deep roster's normal minutes add up to far more (260 to 385 this preseason). The excess is trimmed almost entirely from the bench: a 15-minute player gives up about eight times as many minutes as a 30-minute starter. This applies to every stat. On opening night, without it, projected minutes ran about 4 per player too high.</li>
          <li><b>Team scoring cap (points and assists).</b> A roster's normal points and assists can add up to more than one team produces, because new teammates bring usage from old roles and rookies take shots of their own. When that happens, every player's points (or assists) come down by the same share until the team total matches what the team is expected to score: its per-game output this season, blended early on with a prior halfway between last season's number and the league average. This season's results take over as games pile up. On the first four nights it cut the points overprojection about in half.</li>
          <li><b>Defense volume</b> uses how many threes the opponent allows per 100 possessions, split into corner and above-the-break, weighted by where this shooter takes his threes. 80% of a defense's lean is credited, the share last season's games supported.</li>
          <li><b>Pace</b> scales attempts by how fast the opponent plays relative to the league.</li>
        </ul>
        <h4>Percentage</h4>
        <ul>
          <li><b>Starting 3P%</b> is the player's percentage pulled toward league average (36%) by 250 attempts, since three-point shooting is noisy in small samples.</li>
          <li><b>Openness:</b> NBA tracking splits every three by the closest defender's distance. League-wide, wide-open threes (6+ feet) go in about 38% of the time, open ones (4–6 feet) 34%, and contested ones 32%. A defense that allows more wide-open looks shifts the shooter's mix toward them. The shift is scaled by his catch-and-shoot share: spot-up shooters gain most from a leaky defense, while pull-up shooters create their own looks.</li>
          <li><b>Corners:</b> corner threes go in about 39% of the time versus 35% above the break, so a defense that gives up corners nudges percentage up as well.</li>
        </ul>
        <h4>Teammates out</h4>
        <p>When a teammate is ruled out before the lock, his minutes go to the rest of the rotation, weighted toward players with room to play more, and the team takes back about 70% of the threes it would have lost. That estimate is then calibrated to what actually happened across 2,507 teammate pairs last season, which sets who picks up the slack. The team total is pinned to what teams actually recovered when a rotation player sat: nearly all of his minutes and three-point attempts, and about 95% of his points and assists.</p>
        <p>Each pair's own with/without split is blended in too, but lightly (50 games apart counts as half), because last season showed those splits are mostly game-to-game noise beyond the calibrated estimate. The matchup grade ignores injuries, so it still measures the defense alone. Click any player to try what-if scenarios; they never change the board.</p>
        <h4>Grades</h4>
        <p>The grade measures how much tonight's matchup moves a player, in the stat itself: extra made threes (or points, assists, rebounds) over his normal output, not a percentage. A soft defense lifts a 7-attempt shooter by far more makes than a 2-attempt one, so only real volume earns a high grade.</p>
        <p>Every projected player gets a grade. Players with a proven role are marked as such: at least 20 games last season and enough projected minutes and volume (threes: 4 attempts, 22 minutes, 150 tracked attempts; points: 11 a game; assists: 2.5; rebounds: 4.2 with 20 minutes). Grades for everyone else are faded, since a small role or sample makes them less reliable; hover for the reason. The <b>Proven volume</b> filter and the <b>Top grades</b> tab show only proven players.</p>
        <p>Cutoffs come from every graded player against every defense last season: A+ is the best 5% of matchups, A the next 7%, B the next 18%, C the middle 40%, D the next 18%, and F the bottom 12%. For threes, an A+ is worth about 0.19 extra makes or more; for points about 1.2, assists 0.43, rebounds 0.48. Nights before Oct 21 were graded on the older percentage scale.</p>
        <h4>Early season</h4>
        <p>Every rate blends 2025-26 with 2026-27. This season's weight is games ÷ (games + 20) for players and games ÷ (games + 25) for teams, so it passes 50% around the 20th game.</p>
        <h4>Locking and grading</h4>
        <p>Each game locks on its own, shortly before its tip-off, and its ratings never change afterward. Until then it's a preview that picks up injury and lineup news, so a late scratch in a 9:30 game still counts even if the 7:00 games are already locked. News after a game locks doesn't alter it, so the Results sheet is a fair test. Players ruled out before the lock are left off the board and their teammates' projections are adjusted; questionable players are flagged and assumed to play.</p>
        <h4>What it doesn't know</h4>
        <ul>
          <li>Rookies and players with fewer than 10 NBA games, until they build a sample.</li>
          <li>Individual defensive assignments, and game script such as blowouts that cut starters' minutes.</li>
        </ul>
      </div></section>`;
  }

// Teammate-injury math. Mirrors injury_ratios() in nba_3pt_model.py; keep in sync.
// stat: "pa" (three-point attempts), "pts" (points) or "ast" (assists).
const INJ_KEYS = { pa: ["rate", "e_pa", "cal_pa"], pts: ["rate_pts", "e_pts", "cal_pts"], ast: ["rate_ast", "e_ast", "cal_ast"], reb: ["rate_reb", "e_reb", "cal_reb"] };
function injStruct(ctx, out, stat) {
  const P = ctx.params, mins = ctx.min, rate = ctx[INJ_KEYS[stat][0]];
  const rot = ctx.rotation.filter((p) => !out.includes(p));
  const freed = out.reduce((s, y) => s + (mins[y] || 0), 0);
  const w = {}; let W = 0;
  rot.forEach((i) => { w[i] = mins[i] * Math.max(0, P.max_min - mins[i]); W += w[i]; });
  if (!W) W = 1;
  const m2 = {};
  rot.forEach((i) => { m2[i] = Math.min(P.max_min, mins[i] + freed * w[i] / W); });
  const fullPa = ctx.rotation.reduce((s, i) => s + mins[i] * rate[i], 0);
  let basePa = rot.reduce((s, i) => s + m2[i] * rate[i], 0);
  if (!basePa) basePa = 1;
  const lost = Math.max(0, fullPa - basePa);
  const u = 1 + P.retain * lost / basePa;
  const res = {};
  rot.forEach((i) => { if (mins[i] > 0) res[i] = [m2[i] / mins[i], m2[i] / mins[i] * u]; });
  return res;
}
function injRaw(ctx, pid, out, stat) {
  const s = injStruct(ctx, out, stat);
  if (!s[pid]) return null;
  let [mr, pr] = s[pid];
  const ekey = INJ_KEYS[stat][1];
  const cal = [ctx.params.cal_min, ctx.params[INJ_KEYS[stat][2]]];
  const notes = [];
  for (const y of out) {
    const sy = injStruct(ctx, [y], stat)[pid] || [1, 1];
    const pe = (ctx.pairs[pid] || {})[y];
    const f = pe ? pe.f : 0;
    const eff = sy.map((v, k) => { const r = v / (1 + f * (v - 1)); return 1 + Math.max(0, cal[k][0] + cal[k][1] * (r - 1)); });
    let by = eff;
    if (pe && pe.n > 0 && pe[ekey] != null) {
      const wgt = pe.n / (pe.n + ctx.params.emp_k);
      by = [(1 - wgt) * eff[0] + wgt * pe.e_min, (1 - wgt) * eff[1] + wgt * pe[ekey]];
    }
    mr *= by[0] / sy[0];
    pr *= by[1] / sy[1];
    notes.push([y, pe ? pe.n : 0]);
  }
  return [mr, pr, notes];
}
function injTeamScale(ctx, out, stat) {
  const rate = ctx[INJ_KEYS[stat][0]], mins = ctx.min, R = ctx.params.retention;
  let gm = 0, gs = 0;
  for (const i of ctx.rotation) {
    if (out.includes(i)) continue;
    const r = injRaw(ctx, i, out, stat);
    if (!r) continue;
    gm += mins[i] * (r[0] - 1);
    gs += mins[i] * rate[i] * (r[1] - 1);
  }
  const lm = out.reduce((t, y) => t + (mins[y] || 0), 0);
  const ls = out.reduce((t, y) => t + (mins[y] || 0) * (rate[y] || 0), 0);
  return [gm > 0 ? R.min * lm / gm : 1, gs > 0 ? R[stat] * ls / gs : 1];
}
const _injCache = new Map();
function injuryRatios(ctx, pid, outSet, stat) {
  stat = stat || "pa";
  if (!ctx || !ctx[INJ_KEYS[stat][0]] || !Object.keys(ctx[INJ_KEYS[stat][0]]).length) return [1, 1, []];
  const out = outSet.filter((y) => y !== pid && ctx.min[y] != null);
  if (!out.length) return [1, 1, []];
  const r = injRaw(ctx, pid, out, stat);
  if (!r) return [1, 1, []];
  let key = null;
  if (ctx.team) { key = ctx.team + "|" + stat + "|" + out.slice().sort().join(","); }
  let sc = key ? _injCache.get(key) : null;
  if (!sc || sc.ctx !== ctx) { sc = { ctx, v: injTeamScale(ctx, out, stat) }; if (key) _injCache.set(key, sc); }
  const [km, ks] = sc.v;
  const mr = 1 + km * (r[0] - 1), pr = 1 + ks * (r[1] - 1);
  const notes = r[2].map(([y, n]) => [y, out.length === 1 ? pr : injuryRatios(ctx, pid, [y], stat)[1], n]);
  return [mr, pr, notes];
}

  function injLine(n) {
    const lists = Object.entries(n.injuries || {}).flatMap(([t, arr]) => arr.map((x) => `${esc(x.player)} (${esc(t)}, ${esc(x.status)})`));
    if (!lists.length) return "";

    if (all == null) return `<p class="notice">Loading points…</p>`;

    const actual = (r) => (n.results && n.results[String(r.player_id)] ? n.results[String(r.player_id)].pts : null);
    rows.sort((a, b) => {

    const th = (key, label, cls = "", title = "") => {

      ${graded ? th("actual", "Actual", "gs", "Points scored") : ""}<th class="l">Why</th></tr>`;
    const body = rows.map((r) => {

      return `<tr>
        <td class="rk">${r.rank ?? ""}</td>

        <td>${gradeChip(r.grade, r.gate)}</td>

        <td class="mut">${f1(r.base_pts)}</td>
        <td class="h" style="background:${heat(edgeT(r.boost, 0.07))}">${sgn(r.boost)}</td>

        <td class="h" style="background:${heat(edgeT(r.pt_edge, 0.04))}">${sgn(r.pt_edge)}</td>

      <div class="scroll"><table><thead>${head}</thead><tbody>${body || `<tr><td class="l" colspan="12" style="padding:14px 16px">No players match this filter.</td></tr>`}</tbody></table></div></section>`;
  }

  function ptsGradedSummary(n, rows) {
    const xs = rows.map((r) => ({ r, a: n.results[String(r.player_id)] })).filter((x) => x.a);

    const tile = (big, small) => `<div class="tile"><b>${big}</b><small>${small}</small></div>`;
    return `<section class="card"><header><h3>How the night graded</h3></header><div class="tiles">
      ${tile(`${sum(xs, (x) => x.a.pts)} <span style="font-size:18px;color:var(--ink-3)">/ ${f1(sum(xs, (x) => x.r.proj_pts))}</span>`, "Points scored vs projected, players who played")}
      ${good.length ? tile(sgnPts(sum(good, (x) => x.a.pts - x.r.base_pts) / good.length), `A and A+ matchups vs their normal (${good.length} players)`) : ""}
      ${bad.length ? tile(sgnPts(sum(bad, (x) => x.a.pts - x.r.base_pts) / bad.length), `D and F matchups vs their normal (${bad.length} players)`) : ""}
    </div></section>`;
  }

  // rank helpers: 1 = most generous to scorers
  function ptsRanks() {
    const d = state.defense; if (!d || !d.pts_teams) return null;

    const T = d.pts_teams, rk = { src: T, zpct: {}, z100: {}, ppp: {}, freq: {}, fta: {} };
    const rankBy = (vals, desc) => { const ids = Object.keys(vals).filter((k) => vals[k] != null).sort((a, b) => desc ? vals[b] - vals[a] : vals[a] - vals[b]); const o = {}; ids.forEach((id, i) => (o[id] = i + 1)); return o; };
    ZKEYS.forEach((z) => {
      const p = {}, v = {}; T.forEach((t) => { p[t.team] = t.zones[z].pct; v[t.team] = t.zones[z].per100; });
      rk.zpct[z] = rankBy(p, true); rk.z100[z] = rankBy(v, true);
    });
    const f = {}; T.forEach((t) => (f[t.team] = t.fta_100)); rk.fta = rankBy(f, true);
    PTKEYS.forEach((k) => {
      const p = {}, q = {}; T.forEach((t) => { if (t.playtypes && t.playtypes[k]) { p[t.team] = t.playtypes[k].ppp; q[t.team] = t.playtypes[k].freq; } });
      rk.ppp[k] = rankBy(p, true); rk.freq[k] = rankBy(q, true);
    });
    // one defense rank per zone / play type: how much the defense helps scoring there,
    // computed the way the model credits it (volume shift damped by MIX_DAMP, efficiency
    // shrunk by reliability). 1 = most generous.
    const m = (state.meta && state.meta.points) || {}, rel = m.zone_rel || {};
    rk.zdef = {}; rk.ptdef = {};
    ZKEYS.forEach((z) => {
      const v = {}; T.forEach((t) => {
        const zz = t.zones[z]; if (!zz || !m.zone_100) return;
        const vol = Math.pow(zz.per100 / m.zone_100[z], PTS_MIX_DAMP);
        const eff = rel[z] != null ? 1 + rel[z] * (zz.pct - m.zone_pct[z]) / m.zone_pct[z] : 1;
        v[t.team] = vol * eff;
      }); rk.zdef[z] = rankBy(v, true);
    });
    rk.zdef.ft = rk.fta;
    PTKEYS.forEach((k) => {
      const lg = m.playtypes && m.playtypes[k]; const v = {};
      T.forEach((t) => { const x = t.playtypes && t.playtypes[k]; if (!x || !lg || x.ppp == null) return;
        v[t.team] = Math.pow((x.freq ?? lg.freq) / lg.freq, PTS_MIX_DAMP) * (1 + lg.rel * (x.ppp / lg.ppp - 1)); });
      rk.ptdef[k] = rankBy(v, true);

    state._rk = rk; return rk;
  }
  const PTS_MIX_DAMP = 0.5; // mirrors MIX_DAMP in nba_points_model.py
  const ord = (n) => (n == null ? "–" : n + (n % 10 === 1 && n !== 11 ? "st" : n % 10 === 2 && n !== 12 ? "nd" : n % 10 === 3 && n !== 13 ? "rd" : "th"));
  const rankCell = (r, label) => `<td class="h" style="background:${heat(r ? 1 - (r - 1) / 29 : 0.5)}" title="${esc(label || "")}">${ord(r)}</td>`;

  // ----- shot types allowed (catch-and-shoot, pull-up, under 10 ft) -----
  const DTK = ["cs", "pullup", "lt10"];
  const DTL = { cs: "Catch-and-shoot", pullup: "Pull-up", lt10: "Under 10 ft" };
  function dietRanks() {
    const d = state.defense && state.defense.diet; if (!d) return null;

    const rk = { src: d, a3: {} };
    ["cs", "pullup"].forEach((k) => { const ids = Object.keys(d).sort((a, b) => d[b][k].a3_100 - d[a][k].a3_100); const o = {}; ids.forEach((id, i) => (o[id] = i + 1)); rk.a3[k] = o; });

    const body = ids.map((t) => `<tr><td class="pl"><button type="button" class="link" data-team="${esc(t)}">${esc(names[t] || t)}</button><small>${esc(t)}</small></td>${cols.map((c, i) => {

  function ptsDefenseHTML() {

        <td class="h gs" style="background:${heat(edgeT(t.boost, 0.07))}">${sgn(t.boost)}</td><td class="h" style="background:${heat(edgeT(t.z_edge, 0.04))}">${sgn(t.z_edge)}</td><td class="h" style="background:${heat(edgeT(t.pt_edge, 0.04))}">${sgn(t.pt_edge)}</td>${zc}<td class="mut gs">${f1(t.pace)}</td><td class="mut">${f1(t.def_rating)}</td></tr>`;

  // ----- points panel -----
  function renderPanelPts(P) {
    const n = state.nights.find((x) => x.id === P.nightId);
    const rows = n ? state.pts[n.id] || [] : [];
    const r = rows.find((x) => String(x.player_id) === P.pid);
    if (!n || !r) { closePanel(); return; }
    const td = state.teamDocs[r.team];
    const prof = td && td.players ? td.players[P.pid] : null;
    const pp = prof && prof.pts ? prof.pts : null;
    const ctx = td && td.inj ? td.inj : null;
    const names = {}; if (td && td.players) Object.entries(td.players).forEach(([k, v]) => (names[k] = v.name));
    const nm = (id) => names[id] || "Teammate";
    const dteam = state.defense && state.defense.pts_teams ? state.defense.pts_teams.find((t) => t.team === r.opp) : null;
    const rk = ptsRanks();

    let mr = r.inj_min ?? 1, pr = r.inj_pts ?? 1;
    const changed = P.out.slice().sort().join() !== P.locked.slice().sort().join();
    if (ctx && (changed || P.out.length)) { [mr, pr] = injuryRatios(ctx, P.pid, P.out, "pts"); }
    const showDt = !!(r.dt && r.dt.length && r.dt_edge != null);
